<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Google Studio · Ads naslagwerk · DEWI</title>
<script src="dewi-frame.js"></script><!-- uniforme volledig-scherm / cockpit-toggle -->
<style>
:root{
  --bg:#0e1116; --panel:#161b22; --panel-2:#1c232d; --line:#2a323d;
  --txt:#e6edf3; --muted:#9aa7b4; --dim:#6b7684;
  --ok:#2ea043; --ok-bg:#12261a; --no:#e5484d; --no-bg:#2a1416;
  --accent:#4c8dff; --amber:#e0a13a; --radius:14px;
  --google:#4285f4;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:22px 18px 60px}
.top{display:flex;align-items:center;margin-bottom:16px;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;letter-spacing:.2px;margin-right:auto}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--google)}
.count{font-size:13px;color:var(--muted);background:var(--panel);border:1px solid var(--line);
  padding:6px 12px;border-radius:999px;white-space:nowrap}
.nav{font-size:13px;color:var(--dim);text-decoration:none}
.nav:hover{color:var(--muted)}

/* ---- controls ---- */
.controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:none;background:transparent;color:var(--muted);font-size:12.5px;font-weight:600;
  padding:6px 15px;border-radius:999px;cursor:pointer;transition:.12s}
.seg button.on{background:var(--panel-2);color:var(--txt);box-shadow:inset 0 0 0 1px var(--line)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--dim);margin-left:auto;align-items:center}
.legend .lg{display:inline-flex;align-items:center;gap:5px}
.legend .sw{width:9px;height:9px;border-radius:50%}
.freshness{font-size:11.5px;color:var(--dim)}

/* ---- account KPI strip ---- */
.kpibar{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:8px}
.kpibar .st{background:linear-gradient(180deg,#141922 0%,#12151c 100%);padding:13px 15px;display:flex;flex-direction:column;gap:3px}
.kpibar .st .k{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
.kpibar .st .v{font-size:20px;font-weight:700;color:var(--txt);line-height:1.05;display:flex;align-items:baseline;gap:7px}
.kpibar .st .v small{font-size:11px;font-weight:600;color:var(--dim)}
.kpibar .st .v.above{color:var(--ok)} .kpibar .st .v.below{color:var(--no)}
.pill{font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.02em}
.pill.above{background:var(--ok-bg);color:var(--ok)} .pill.below{background:var(--no-bg);color:var(--no)}
.pill.idle{background:var(--panel-2);color:var(--dim)}
.caphint{font-size:11px;color:var(--dim);margin:0 2px 18px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.caphint b{color:var(--muted);font-weight:600}

/* ---- campaign group ---- */
.camp{margin-bottom:20px;border:1px solid var(--line);border-radius:var(--radius);
  background:linear-gradient(180deg,#141922 0%,#12151c 100%);overflow:hidden;border-left:3px solid var(--dim)}
.camp.above{border-left-color:var(--ok)} .camp.below{border-left-color:var(--no)} .camp.idle{border-left-color:var(--dim)}
.camphead{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.camphead .cname{font-size:14px;font-weight:600;letter-spacing:.2px;display:flex;align-items:center;gap:9px}
.camphead .cname .cd{width:8px;height:8px;border-radius:50%;background:var(--google);flex:none}
.camphead .cname .ctype{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--dim);
  background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:2px 7px}
.camphead .ctot{margin-left:auto;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.camphead .kv{font-size:11px;color:var(--dim);white-space:nowrap}
.camphead .kv b{color:var(--txt);font-size:13px;font-weight:700;margin-left:4px}
.share{display:flex;align-items:center;gap:8px;min-width:130px}
.share .track{flex:1;height:6px;border-radius:999px;background:var(--panel-2);overflow:hidden}
.share .fill{height:100%;border-radius:999px;background:var(--google)}
.share .lbl{font-size:10px;color:var(--dim);white-space:nowrap}

.adset{padding:4px 14px 6px}
.adsethead{display:flex;align-items:center;gap:8px;padding:10px 4px 8px;flex-wrap:wrap;border-top:1px solid var(--line)}
.adset:first-of-type .adsethead{border-top:none}
.adsethead .asn{font-size:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:7px}
.adsethead .asn .adot{width:6px;height:6px;border-radius:50%;background:var(--dim)}
.adsethead .astot{margin-left:auto;display:flex;gap:13px;flex-wrap:wrap}
.adsethead .astot .kv{font-size:11px;color:var(--dim);white-space:nowrap}
.adsethead .astot .kv b{color:var(--muted);font-weight:700;margin-left:3px}

/* ---- asset-group cards: data-first, horizontal ---- */
.ads{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:11px;padding:4px 4px 14px}
.adcard{display:flex;gap:11px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px;position:relative}
.adcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:12px 0 0 12px;background:var(--dim)}
.adcard.above::before{background:var(--ok)} .adcard.below::before{background:var(--no)} .adcard.idle::before{background:var(--dim)}

/* format tegel (Google heeft geen ad-thumbnail via de API) */
.thumb{position:relative;width:78px;height:78px;flex:none;border-radius:9px;overflow:hidden;background:var(--panel-2);
  border:1px solid var(--line);cursor:pointer;display:flex;align-items:center;justify-content:center}
.thumb .fmt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--dim);
  text-align:center;padding:4px;line-height:1}
.thumb .fmt svg{width:24px;height:24px;opacity:.85}
.thumb .fmt .fl{font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
.thumb .statusdot{position:absolute;left:6px;top:6px;width:9px;height:9px;border-radius:50%;z-index:2;
  box-shadow:0 0 0 2px rgba(0,0,0,.55)}
.thumb .stale{position:absolute;right:5px;top:5px;z-index:2;font-size:8px;font-weight:700;padding:1px 5px;border-radius:999px;
  background:rgba(224,161,58,.92);color:#1a1204}
.thumb .astr{position:absolute;left:0;right:0;bottom:0;z-index:2;font-size:8px;font-weight:700;text-align:center;
  padding:2px 0;background:rgba(0,0,0,.55);color:var(--muted);letter-spacing:.02em}

.info{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.info .row1{display:flex;align-items:flex-start;gap:8px}
.info .adname{font-size:12px;line-height:1.3;color:var(--txt);font-weight:600;flex:1;min-width:0;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chip{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);
  background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:2px 7px;white-space:nowrap;
  display:inline-flex;align-items:center;gap:4px;flex:none}
.chip svg{width:11px;height:11px}

.mrow{display:flex;gap:14px;flex-wrap:wrap}
.mrow .m{display:flex;flex-direction:column;gap:0}
.mrow .m .k{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
.mrow .m .v{font-size:13px;font-weight:700;color:var(--txt)}
.mrow .m .v.above{color:var(--ok)} .mrow .m .v.below{color:var(--no)} .mrow .m .v.idle{color:var(--dim)}

/* break-even bar */
.bev{display:flex;align-items:center;gap:8px}
.bev .track{flex:1;position:relative;height:7px;border-radius:999px;background:var(--panel-2);overflow:hidden}
.bev .fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px}
.bev .fill.above{background:var(--ok)} .bev .fill.below{background:var(--no)}
.bev .tick{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--muted);opacity:.7}
.bev .bl{font-size:9.5px;color:var(--dim);white-space:nowrap;min-width:52px;text-align:right}

/* asset performance labels (PMax) */
.assets{display:flex;gap:5px;flex-wrap:wrap}
.assets .a{font-size:9px;font-weight:600;padding:2px 6px;border-radius:999px;border:1px solid var(--line);
  background:var(--panel-2);color:var(--dim);display:inline-flex;align-items:center;gap:4px}
.assets .a .pl{width:6px;height:6px;border-radius:50%}
.assets .a .pl.best{background:var(--ok)} .assets .a .pl.good{background:var(--accent)}
.assets .a .pl.low{background:var(--no)} .assets .a .pl.learning{background:var(--amber)} .assets .a .pl.none{background:var(--dim)}

.subline{font-size:10px;color:var(--dim);display:flex;gap:10px;flex-wrap:wrap}

/* ---- generieke sectie (IS / mix / zoektermen / ads) ---- */
.sec{margin:22px 0 0;border:1px solid var(--line);border-radius:var(--radius);
  background:linear-gradient(180deg,#141922 0%,#12151c 100%);overflow:hidden}
.sechead{display:flex;align-items:center;gap:9px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sechead .st-i{width:8px;height:8px;border-radius:50%;background:var(--google);flex:none}
.sechead h3{margin:0;font-size:13px;font-weight:600;letter-spacing:.2px;color:var(--txt)}
.sechead .st-sub{font-size:11px;color:var(--dim);margin-left:auto}
.secbody{padding:14px 16px}
.sec-empty{padding:16px;font-size:12px;color:var(--dim);line-height:1.55}

/* ---- impression share ---- */
.iscamp{margin-bottom:16px} .iscamp:last-child{margin-bottom:0}
.iscamp .isc-name{font-size:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px;margin-bottom:10px}
.iscamp .isc-name .cd{width:7px;height:7px;border-radius:50%;background:var(--google);flex:none}
.iscamp .isc-name .cvt{font-size:10.5px;color:var(--dim);font-weight:500;margin-left:auto}
.isrow{display:grid;grid-template-columns:160px 1fr 58px;align-items:center;gap:12px;margin:7px 0}
.isrow .isl{font-size:11px;color:var(--dim)}
.isrow .track{height:8px;border-radius:999px;background:var(--panel-2);overflow:hidden;border:1px solid var(--line)}
.isrow .fill{height:100%;border-radius:999px}
.isrow .fill.good{background:var(--google)} .isrow .fill.warn{background:var(--amber)} .isrow .fill.bad{background:var(--no)}
.isrow .isv{font-size:12px;font-weight:700;color:var(--txt);text-align:right;font-variant-numeric:tabular-nums}
.ishint{font-size:10.5px;color:var(--dim);margin-top:12px;line-height:1.55;border-top:1px solid var(--line);padding-top:10px}

/* ---- mix (netwerk / apparaat / land) ---- */
.mixgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.mixcol h5{margin:0 0 10px;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;
  display:flex;align-items:center;gap:6px}
.mixrow{margin:9px 0}
.mixrow .mx-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.mixrow .mx-n{font-size:11.5px;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mixrow .mx-p{font-size:12px;font-weight:700;color:var(--txt);flex:none;font-variant-numeric:tabular-nums}
.mixrow .mx-p.above{color:var(--ok)} .mixrow .mx-p.below{color:var(--no)} .mixrow .mx-p.idle{color:var(--dim)}
.mixrow .track{height:6px;border-radius:999px;background:var(--panel-2);overflow:hidden;margin-top:4px}
.mixrow .fill{height:100%;border-radius:999px;background:var(--google)}
.mixrow .mx-c{font-size:10px;color:var(--dim);margin-top:4px}

/* ---- zoektermen ---- */
.stwrap{max-height:380px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.stbl{width:100%;border-collapse:collapse;font-size:11.5px}
.stbl th{text-align:left;color:var(--dim);font-weight:500;font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;
  padding:7px 9px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#12151c;z-index:1}
.stbl td{padding:7px 9px;border-bottom:1px solid rgba(255,255,255,.04);color:var(--txt)}
.stbl td.num,.stbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.stbl td.term{max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stbl tr:hover td{background:rgba(255,255,255,.02)}
.stmore{font-size:10.5px;color:var(--dim);margin-top:9px}

/* ---- gaps ---- */
.gaps{margin-top:22px;border:1px dashed var(--line);border-radius:12px;padding:13px 16px;
  background:var(--panel);color:var(--muted);font-size:12px;line-height:1.55}
.gaps h4{margin:0 0 6px;font-size:12px;font-weight:600;color:var(--txt);display:flex;align-items:center;gap:7px}
.gaps h4 .cd{width:8px;height:8px;border-radius:50%;background:var(--amber)}
.gaps ul{margin:0;padding-left:18px} .gaps li{margin:2px 0}

/* ---- states ---- */
.state{text-align:center;padding:80px 20px;color:var(--muted)}
.state .ico{font-size:46px;color:var(--dim);margin-bottom:14px}
.state h2{font-size:18px;font-weight:600;color:var(--txt);margin:0 0 6px}
.state p{font-size:13.5px;margin:0}
.spinner{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--google);
  border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---- lightbox ---- */
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;
  z-index:80;cursor:zoom-out;padding:24px}
.lb.open{display:flex}
.lb-inner{max-width:min(92vw,520px);max-height:92vh;display:flex;flex-direction:column;gap:12px;cursor:default;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;overflow:auto}
.lb-cap{color:#cfd8e3;font-size:14px;line-height:1.5;font-weight:600}
.lb-meta{color:var(--dim);font-size:12px}
.lb-note{color:var(--amber);font-size:11.5px}
.lb table{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px}
.lb th{text-align:left;color:var(--dim);font-weight:500;font-size:10px;text-transform:uppercase;letter-spacing:.05em;
  padding:6px 8px;border-bottom:1px solid var(--line)}
.lb td{padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.04);color:var(--txt);vertical-align:top}
.lb td .pl{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.lb td .rsn{display:block;color:var(--dim);font-size:10px;margin-top:2px}
.lb-close{position:absolute;top:18px;right:22px;color:#fff;font-size:26px;cursor:pointer;
  width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%;
  background:rgba(255,255,255,.1)}

@media(max-width:820px){ .kpibar{grid-template-columns:repeat(3,1fr)} }
@media(max-width:560px){ .kpibar{grid-template-columns:repeat(2,1fr)} .ads{grid-template-columns:1fr}
  .legend{width:100%;margin-left:0} .isrow{grid-template-columns:106px 1fr 50px;gap:9px} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="dot"></span> Google Studio · ads naslagwerk</div>
    <div style="display:flex;align-items:center;gap:14px">
      <span class="count" id="count">—</span>
      <a class="nav" href="social-studio.html">Social Studio ↗</a>
      <a class="nav" href="meta-studio.html">Meta Studio ↗</a>
      <a class="nav" href="kpi.html">← dashboard</a>
    </div>
  </header>

  <div class="controls">
    <div class="seg" id="seg">
      <button data-p="7d" class="on">7 dagen</button>
      <button data-p="28d">28 dagen</button>
    </div>
    <div class="legend">
      <span class="lg"><span class="sw" style="background:var(--ok)"></span>ROAS ≥ 1,58</span>
      <span class="lg"><span class="sw" style="background:var(--no)"></span>onder break-even</span>
      <span class="lg"><span class="sw" style="background:var(--dim)"></span>geen levering</span>
      <span class="lg freshness" id="fresh"></span>
    </div>
  </div>

  <div id="stage">
    <div class="state"><div class="spinner"></div><p>Laden…</p></div>
  </div>
</div>

<div class="lb" id="lb">
  <div class="lb-close" id="lbClose">✕</div>
  <div class="lb-inner" id="lbInner"></div>
</div>

<script>
const SUPA = "https://jucubuoftjehwancegma.supabase.co";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp1Y3VidW9mdGplaHdhbmNlZ21hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI2OTYwMDIsImV4cCI6MjA5ODI3MjAwMn0.gKYBE76kVv5XdMb-GuFAELdSp5R7OjCIiUzw7hW2Jus";
const HDR = {apikey:ANON, Authorization:`Bearer ${ANON}`};
const BE_ROAS = 1.58;               // break-even ROAS
const BEV_SCALE = 4;                // schaal-max van de break-even-balk (ROAS 4 = vol)

const stage=document.getElementById('stage');
const countEl=document.getElementById('count');
const freshEl=document.getElementById('fresh');
let PERIOD='7d';
let ROWS=[];

const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const eur0=n=>'€'+Math.round(Number(n)||0).toLocaleString('nl-NL');
const roasTxt=n=>(Number(n)||0).toLocaleString('nl-NL',{minimumFractionDigits:2,maximumFractionDigits:2});
const cpaTxt=n=>(n==null||n==='')?'—':'€'+Math.round(Number(n)).toLocaleString('nl-NL');
const num=n=>(Number(n)||0).toLocaleString('nl-NL');
const conv1=n=>(Number(n)||0).toLocaleString('nl-NL',{minimumFractionDigits:0,maximumFractionDigits:1});
const pct1=n=>((Number(n)||0)*100).toLocaleString('nl-NL',{minimumFractionDigits:1,maximumFractionDigits:1})+'%';
function fmtK(n){n=Number(n)||0; if(n>=1000) return (n/1000).toFixed(n>=10000?0:1).replace('.',',')+'k'; return String(n);}
function relTxt(iso){ if(!iso) return '—'; const d=new Date(iso), now=new Date();
  const h=Math.floor((now-d)/3600000);
  if(h<1) return 'zojuist'; if(h<24) return h+' u geleden';
  const days=Math.floor(h/24); if(days===1) return 'gisteren'; if(days<7) return days+' dgn geleden';
  return d.toLocaleDateString('nl-NL',{day:'numeric',month:'short'}); }

/* ---- asset-group / campagne-status (Google Ads enums) ---- */
const STATUS={
  ENABLED:['Actief','var(--ok)'], PAUSED:['Gepauzeerd','var(--dim)'],
  REMOVED:['Verwijderd','var(--no)'], UNKNOWN:['—','var(--dim)'], UNSPECIFIED:['—','var(--dim)']
};
function statusMeta(s){ return STATUS[s]||[(s||'—'),'var(--dim)']; }

/* ---- kanaaltype-icoon (Google heeft geen creatief-thumbnail via de API) ---- */
const ICONS={
  pmax:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3l1.9 4.9L19 9.8l-4.1 2.4L14 17l-2-3.4L8 17l1-4.8L5 9.8l5.1-1.9z" stroke-linejoin="round"/></svg>',
  shopping:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 7h12l-1 12H7z"/><path d="M9 7a3 3 0 0 1 6 0" stroke-linecap="round"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4" stroke-linecap="round"/></svg>',
  display:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M4 17l4.5-4.5a2 2 0 0 1 2.8 0L20 20"/></svg>',
  channel:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="3.5" width="7" height="7" rx="1.4"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.4"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.4"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.4"/></svg>'
};
const TYPE_LABEL={PERFORMANCE_MAX:'Performance Max',SHOPPING:'Shopping',SEARCH:'Search',DISPLAY:'Display',VIDEO:'Video',DEMAND_GEN:'Demand Gen'};
function typeKey(t){
  const n=String(t||'').toUpperCase();
  if(n==='PERFORMANCE_MAX') return 'pmax';
  if(n==='SHOPPING') return 'shopping';
  if(n==='SEARCH') return 'search';
  if(n==='DISPLAY'||n==='VIDEO'||n==='DEMAND_GEN') return 'display';
  return 'channel';
}
function typeLabel(t){ return TYPE_LABEL[String(t||'').toUpperCase()] || (t? String(t).replace(/_/g,' ') : 'Campagne'); }

/* ---- asset primary-status (v25: performance_label is vervallen) ---- */
const PS={ ELIGIBLE:['best','Actief'], ENABLED:['best','Actief'], LIMITED:['learning','Beperkt'],
  PENDING:['learning','In review'], PENDING_REVIEW:['learning','In review'], UNDER_REVIEW:['learning','In review'],
  PAUSED:['none','Gepauzeerd'], REMOVED:['low','Verwijderd'], NOT_ELIGIBLE:['low','Niet in aanmerking'],
  DISAPPROVED:['low','Afgekeurd'], UNKNOWN:['none','—'], UNSPECIFIED:['none','—'], UNAVAILABLE:['none','—'] };
function psMeta(s){ return PS[String(s||'').toUpperCase()] || ['none', (s? String(s).replace(/_/g,' ').toLowerCase():'—')]; }
function psReasons(a){ const r=a&&a.primary_status_reasons; if(r==null) return '';
  if(Array.isArray(r)) return r.map(x=>String(x).replace(/_/g,' ').toLowerCase()).join(', ');
  return String(r).replace(/_/g,' ').toLowerCase(); }
const FIELD_LABEL={HEADLINE:'Kop',LONG_HEADLINE:'Lange kop',DESCRIPTION:'Tekst',MARKETING_IMAGE:'Beeld',
  SQUARE_MARKETING_IMAGE:'Beeld (vierkant)',PORTRAIT_MARKETING_IMAGE:'Beeld (portret)',LOGO:'Logo',
  LANDSCAPE_LOGO:'Logo (liggend)',YOUTUBE_VIDEO:'Video',BUSINESS_NAME:'Bedrijfsnaam',CALL_TO_ACTION_SELECTION:'CTA'};
function fieldLabel(f){ return FIELD_LABEL[String(f||'').toUpperCase()] || (f? String(f).replace(/_/g,' ').toLowerCase():'asset'); }

/* ---- dimensie-labels (netwerk / apparaat / land) ---- */
const GEO={'2724':['ES','Spanje','🇪🇸'],'2620':['PT','Portugal','🇵🇹']};
function geoLabel(id){const g=GEO[String(id)];return g?(g[2]+' '+g[1]):('land '+id);}
const DEV={MOBILE:'Mobiel',DESKTOP:'Desktop',TABLET:'Tablet',CONNECTED_TV:'Smart-tv',OTHER:'Overig'};
function devLabel(d){return DEV[String(d||'').toUpperCase()]||(d?String(d).replace(/_/g,' '):'—');}
const NET={SEARCH:'Zoeknetwerk',SEARCH_PARTNERS:'Zoekpartners',CONTENT:'Display',YOUTUBE:'YouTube',
  DISCOVER:'Discover',MIXED:'Gemengd',DISPLAY:'Display'};
function netLabel(n){return NET[String(n||'').toUpperCase()]||(n?String(n).replace(/_/g,' '):'—');}

async function load(){
  try{
    const r=await fetch(`${SUPA}/rest/v1/v_google_studio?select=*`,{headers:HDR});
    if(!r.ok) throw new Error('HTTP '+r.status);
    ROWS=await r.json();
    render();
  }catch(e){
    stage.innerHTML=`<div class="state"><div class="ico">⚠</div><h2>Kon Google Studio niet laden</h2>
      <p>${esc(e.message)} — probeer te verversen.</p></div>`;
  }
}

function beClass(rev,spend){ if(!(Number(spend)>0)) return 'idle'; return (Number(rev)/Number(spend))>=BE_ROAS?'above':'below'; }

function render(){
  let maxPull=null;
  for(const r of ROWS){ if(r.pulled_at && (!maxPull || r.pulled_at>maxPull)) maxPull=r.pulled_at; }
  freshEl.textContent = maxPull ? 'data van '+relTxt(maxPull) : '';

  // ---- rijen per rol splitsen (level bepaalt de sectie, niet één grote kaartenbak) ----
  const grid   = ROWS.filter(r=>r.period===PERIOD && (r.level==='asset_group'||r.level==='campaign'));
  const isRows = ROWS.filter(r=>r.level==='campaign_is' && r.period===PERIOD)
                     .sort((a,b)=>(Number(b.cost)||0)-(Number(a.cost)||0));
  // segmentaties (netwerk/apparaat/land/zoektermen/ads) worden voorlopig alleen 7d geleverd → val terug op 7d
  const dimPick=(lvl)=>{ let rs=ROWS.filter(r=>r.level===lvl && r.period===PERIOD); let p=PERIOD;
    if(!rs.length){ rs=ROWS.filter(r=>r.level===lvl && r.period==='7d'); p='7d'; }
    return {rows:rs, period:p}; };
  const net=dimPick('network'), dev=dimPick('device'), geo=dimPick('geo'),
        term=dimPick('search_term'), adL=dimPick('ad');

  const anyData = grid.length||isRows.length||net.rows.length||dev.rows.length||geo.rows.length||term.rows.length||adL.rows.length;
  if(!anyData){
    countEl.textContent='0 · '+PERIOD;
    stage.innerHTML=`<div class="state"><div class="ico">📭</div><h2>Nog geen Google-data</h2>
      <p>De spine-pull heeft nog niet gedraaid voor deze periode, of Google Ads-leestoegang (Basic Access) is nog niet live.
      Draai <b>Google Studio Insights</b> in n8n of wacht op 08:20.</p></div>`;
    return;
  }

  // ==== 1) KAART-GRID: account-totaal + campagne → asset-groepen (alleen asset_group/campaign) ====
  let cardCount=0, staleCount=0, pmaxCount=0;
  let gridHtml='';
  if(grid.length){
    let totSpend=0,totRev=0,totConv=0;
    const camps={};
    for(const r of grid){
      const sp=Number(r.cost)||0, rv=Number(r.conv_value)||0, cv=Number(r.conversions)||0;
      totSpend+=sp; totRev+=rv; totConv+=cv;
      const cid=r.campaign_id||('name:'+r.campaign_name);
      if(!camps[cid]) camps[cid]={id:cid,name:r.campaign_name,type:r.channel_type,spend:0,rev:0,conv:0,cards:[]};
      const c=camps[cid]; c.spend+=sp; c.rev+=rv; c.conv+=cv;
      if(!c.type && r.channel_type) c.type=r.channel_type;
      c.cards.push(r);
    }
    const campList=Object.values(camps).sort((x,y)=>y.spend-x.spend);
    const accRoas=totSpend>0?totRev/totSpend:0;
    const accCpa=totConv>0?totSpend/totConv:null;
    const accCls=beClass(totRev,totSpend);

    let head=`<div class="kpibar">
      <div class="st"><span class="k">Spend</span><span class="v">${eur0(totSpend)}</span></div>
      <div class="st"><span class="k">ROAS</span><span class="v ${accCls}">${roasTxt(accRoas)} <span class="pill ${accCls}">be 1,58</span></span></div>
      <div class="st"><span class="k">Omzet</span><span class="v">${eur0(totRev)}</span></div>
      <div class="st"><span class="k">Conversies</span><span class="v">${conv1(totConv)}</span></div>
      <div class="st"><span class="k">CPA</span><span class="v ${accCpa!=null&&accCpa<=82?'above':(totConv>0?'below':'idle')}">${cpaTxt(accCpa)}</span></div>
      <div class="st"><span class="k">Campagnes · groepen</span><span class="v">${campList.length} <small>· ${grid.length} groepen</small></span></div>
    </div>
    <div class="caphint"><span>Maandbudget PMax: <b>&lt; €500/mnd (~€16/dag)</b></span><span>·</span><span>break-even <b>ROAS 1,58 / CPA €82</b> (Google Ads-conversieattributie)</span></div>`;

    let body='';
    for(const c of campList){
      const cCls=beClass(c.rev,c.spend);
      const cRoas=c.spend>0?c.rev/c.spend:0;
      const share=totSpend>0?Math.round(c.spend/totSpend*100):0;
      const tk=typeKey(c.type);
      if(tk==='pmax') pmaxCount++;
      const cards=c.cards.sort((x,y)=>(Number(y.cost)||0)-(Number(x.cost)||0)).map(r=>{
        cardCount++; if(r.stale) staleCount++;
        const be=r.be_status||beClass(r.conv_value,r.cost);   // above | below | idle
        const rtk=typeKey(r.channel_type);
        const [slabel,scol]=statusMeta(r.status);
        const roas=Number(r.roas)||0;
        const tickPos=Math.min(BE_ROAS/BEV_SCALE,1)*100;
        const fillW=be==='idle'?0:Math.min(roas/BEV_SCALE,1)*100;
        const assets=Array.isArray(r.assets)?r.assets:[];
        // asset-labels samengevat (max 4 chips) op primary_status; rest in lightbox
        const chips=assets.slice(0,4).map(a=>{
          const [pcls,ptxt]=psMeta(a.primary_status);
          return `<span class="a"><span class="pl ${pcls}"></span>${esc(fieldLabel(a.field_type))}: ${esc(ptxt)}</span>`;
        }).join('');
        const moreAssets=assets.length>4?`<span class="a">+${assets.length-4}</span>`:'';
        const media=`<div class="thumb" data-name="${esc(r.entity_name||'')}" data-type="${esc(typeLabel(r.channel_type))}"
             data-strength="${esc(r.strength||'')}" data-meta="${esc((slabel||'')+' · '+PERIOD)}"
             data-assets='${esc(JSON.stringify(assets))}'>
          <span class="fmt"><span class="ic">${ICONS[rtk]||ICONS.channel}</span><span class="fl">${esc((TYPE_LABEL[String(r.channel_type||'').toUpperCase()]||typeLabel(r.channel_type)).split(' ')[0])}</span></span>
          <span class="statusdot" style="background:${scol}" title="${esc(slabel)}"></span>
          ${r.stale?'<span class="stale">oud</span>':''}
          ${r.strength?`<span class="astr" title="Ad strength">${esc(String(r.strength).replace(/_/g,' ').toLowerCase())}</span>`:''}
        </div>`;
        return `<div class="adcard ${be}">
          ${media}
          <div class="info">
            <div class="row1">
              <div class="adname">${esc(r.entity_name||r.entity_id)}</div>
              <span class="chip">${ICONS[rtk]||ICONS.channel}${esc((TYPE_LABEL[String(r.channel_type||'').toUpperCase()]||typeLabel(r.channel_type)))}</span>
            </div>
            <div class="mrow">
              <div class="m"><span class="k">Spend</span><span class="v">${eur0(r.cost)}</span></div>
              <div class="m"><span class="k">ROAS</span><span class="v ${be}">${roasTxt(r.roas)}</span></div>
              <div class="m"><span class="k">Conversies</span><span class="v">${conv1(r.conversions)}</span></div>
              <div class="m"><span class="k">CPA</span><span class="v ${r.cpa_ok?'above':(Number(r.conversions)>0?'below':'idle')}">${cpaTxt(r.cpa)}</span></div>
            </div>
            <div class="bev">
              <div class="track">
                ${be!=='idle'?`<div class="fill ${be}" style="width:${fillW.toFixed(1)}%"></div>`:''}
                <div class="tick" style="left:${tickPos.toFixed(1)}%"></div>
              </div>
              <span class="bl">${be==='idle'?'geen levering':(be==='above'?'boven be':'onder be')}</span>
            </div>
            ${chips?`<div class="assets">${chips}${moreAssets}</div>`:''}
            <div class="subline"><span>👁 ${fmtK(r.impressions)} impr</span><span>${fmtK(r.clicks)} clicks</span><span>CTR ${roasTxt(r.ctr)}%</span></div>
          </div>
        </div>`;
      }).join('');
      const grpLabel = tk==='pmax' ? 'Asset-groepen' : 'Campagne-niveau (geen asset-groepen)';
      body+=`<div class="camp ${cCls}">
        <div class="camphead">
          <span class="cname"><span class="cd"></span>${esc(c.name)}<span class="ctype">${esc(typeLabel(c.type))}</span></span>
          <span class="ctot">
            <span class="share"><span class="lbl">${share}%</span><span class="track"><span class="fill" style="width:${share}%"></span></span></span>
            <span class="kv">spend<b>${eur0(c.spend)}</b></span>
            <span class="kv">ROAS<b>${roasTxt(cRoas)}</b></span>
            <span class="kv">omzet<b>${eur0(c.rev)}</b></span>
            <span class="kv">conversies<b>${conv1(c.conv)}</b></span>
          </span>
        </div>
        <div class="adset">
          <div class="adsethead">
            <span class="asn"><span class="adot"></span>${esc(grpLabel)}</span>
            <span class="astot"><span class="kv">groepen<b>${c.cards.length}</b></span></span>
          </div>
          <div class="ads">${cards}</div>
        </div>
      </div>`;
    }
    countEl.textContent=`${cardCount} groep(en) · ${campList.length} campagne(s) · ${PERIOD}`;
    gridHtml=head+body;
  } else {
    countEl.textContent=`0 groepen · ${PERIOD}`;
    gridHtml=`<div class="sec"><div class="sec-empty">Geen asset-groepen of campagnekaarten met levering in de periode <b>${PERIOD}</b>. De segmentaties hieronder tonen de laatst geleverde (7-daagse) cijfers.</div></div>`;
  }

  // ==== 2) ZOEK-IMPRESSIEAANDEEL (campagne-niveau) ==== 
  gridHtml += isSection(isRows);
  // ==== 3) NETWERK · APPARAAT · LAND ====
  gridHtml += mixSection(net,dev,geo);
  // ==== 4) TOP ZOEKTERMEN ====
  gridHtml += termSection(term);
  // ==== 5) ADVERTENTIES (ad-niveau; leeg bij PMax) ====
  gridHtml += adSection(adL);
  // ==== gaten & kanttekeningen ====
  gridHtml += gapsSection(staleCount,pmaxCount,grid.length);

  stage.innerHTML=gridHtml;
  stage.querySelectorAll('.thumb').forEach(el=>{ el.onclick=()=>openThumb(el); });
}

/* ---------- secties ---------- */
function isSection(rows){
  if(!rows.length) return `<div class="sec"><div class="sechead"><span class="st-i"></span><h3>Zoek-impressieaandeel</h3></div>
    <div class="sec-empty">Geen impression-share-cijfers voor de periode <b>${PERIOD}</b>.</div></div>`;
  const bar=(cls,lbl,v)=>`<div class="isrow"><span class="isl">${lbl}</span>
      <div class="track"><div class="fill ${cls}" style="width:${(Math.min(Number(v)||0,1)*100).toFixed(1)}%"></div></div>
      <span class="isv">${pct1(v)}</span></div>`;
  const blocks=rows.map(r=>{
    const conv=Number(r.conversions)||0, roas=Number(r.cost)>0?(Number(r.conv_value)||0)/Number(r.cost):0;
    return `<div class="iscamp">
      <div class="isc-name"><span class="cd"></span>${esc(r.campaign_name||r.entity_name||'campagne')}
        <span class="cvt">${eur0(r.cost)} spend · ROAS ${conv>0?roasTxt(roas):'—'}</span></div>
      ${bar('good','Behaald aandeel',r.search_is)}
      ${bar('warn','Verloren · budget',r.search_budget_lost_is)}
      ${bar('bad','Verloren · rang',r.search_rank_lost_is)}
    </div>`;
  }).join('');
  return `<div class="sec"><div class="sechead"><span class="st-i"></span><h3>Zoek-impressieaandeel</h3>
      <span class="st-sub">campagne-niveau · ${PERIOD}</span></div>
    <div class="secbody">${blocks}
    <div class="ishint">Alleen op <b>campagne-niveau</b> beschikbaar — PMax geeft geen aandeel per asset-groep.
      <b>Behaald aandeel</b> = getoonde vertoningen ÷ in aanmerking komende; <b>Verloren · budget</b> = gemist door budgetplafond;
      <b>Verloren · rang</b> = gemist door lagere ad-rang/relevantie. De drie tellen samen op tot 100%.</div></div></div>`;
}

function mixCol(title, icon, picked, mapFn){
  const rs=picked.rows;
  if(!rs.length) return `<div class="mixcol"><h5>${icon} ${esc(title)}</h5><div class="mx-c">—</div></div>`;
  const sorted=rs.slice().sort((a,b)=>(Number(b.cost)||0)-(Number(a.cost)||0));
  const tot=sorted.reduce((s,r)=>s+(Number(r.cost)||0),0);
  const rows=sorted.map(r=>{
    const sp=Number(r.cost)||0, p=tot>0?sp/tot*100:0;
    return `<div class="mixrow">
      <div class="mx-top"><span class="mx-n">${esc(mapFn(r.entity_name))}</span><span class="mx-p">${p.toFixed(0)}%</span></div>
      <div class="track"><div class="fill" style="width:${p.toFixed(1)}%"></div></div>
      <div class="mx-c">${eur0(sp)} · ${fmtK(r.impressions)} impr · ${fmtK(r.clicks)} klik</div>
    </div>`;
  }).join('');
  return `<div class="mixcol"><h5>${icon} ${esc(title)}</h5>${rows}</div>`;
}

function mixSection(net,dev,geo){
  if(!(net.rows.length||dev.rows.length||geo.rows.length)) return '';
  const cols=[
    mixCol('Netwerk','🌐',net,netLabel),
    mixCol('Apparaat','📱',dev,devLabel),
    mixCol('Land','📍',geo,geoLabel)
  ].join('');
  const fellBack = net.period!==PERIOD||dev.period!==PERIOD||geo.period!==PERIOD;
  const sub = fellBack ? '7 dagen (28d niet geleverd)' : PERIOD;
  return `<div class="sec"><div class="sechead"><span class="st-i"></span><h3>Netwerk · apparaat · land</h3>
      <span class="st-sub">verdeling naar spend · ${sub}</span></div>
    <div class="secbody"><div class="mixgrid">${cols}</div></div></div>`;
}

function termSection(picked){
  const rs=picked.rows;
  if(!rs.length) return `<div class="sec"><div class="sechead"><span class="st-i"></span><h3>Top zoektermen</h3></div>
    <div class="sec-empty">Geen zoektermen voor de periode <b>${PERIOD}</b>.</div></div>`;
  const sorted=rs.slice().sort((a,b)=>(Number(b.cost)||0)-(Number(a.cost)||0)||(Number(b.impressions)||0)-(Number(a.impressions)||0));
  const TOPN=25, top=sorted.slice(0,TOPN);
  const trs=top.map(r=>{
    const conv=Number(r.conversions)||0, roas=Number(r.cost)>0?(Number(r.conv_value)||0)/Number(r.cost):0;
    return `<tr><td class="term" title="${esc(r.entity_name)}">${esc(r.entity_name)}</td>
      <td class="num">${fmtK(r.impressions)}</td>
      <td class="num">${num(r.clicks)}</td>
      <td class="num">${eur0(r.cost)}</td>
      <td class="num">${conv1(r.conversions)}</td>
      <td class="num">${conv>0?roasTxt(roas):'—'}</td></tr>`;
  }).join('');
  const more=sorted.length>TOPN?`<div class="stmore">+ ${sorted.length-TOPN} meer zoektermen — top ${TOPN} op spend getoond.</div>`:'';
  const sub = picked.period!==PERIOD ? '7 dagen (28d niet geleverd)' : PERIOD;
  return `<div class="sec"><div class="sechead"><span class="st-i"></span><h3>Top zoektermen</h3>
      <span class="st-sub">${sorted.length} termen · ${sub}</span></div>
    <div class="secbody"><div class="stwrap"><table class="stbl">
      <thead><tr><th>Zoekterm</th><th class="num">Impr</th><th class="num">Klik</th><th class="num">Spend</th><th class="num">Conv</th><th class="num">ROAS</th></tr></thead>
      <tbody>${trs}</tbody></table></div>${more}</div></div>`;
}

function adSection(picked){
  const rs=picked.rows;
  if(!rs.length){
    return `<div class="sec"><div class="sechead"><span class="st-i"></span><h3>Advertenties</h3><span class="st-sub">ad-niveau</span></div>
      <div class="sec-empty">Bij <b>Performance Max</b> geeft Google geen cijfers per losse advertentie vrij — de kleinste zichtbare eenheid is de asset-groep hierboven.
      Deze sectie vult zich zodra er <b>Search/Shopping</b>-advertenties draaien.</div></div>`;
  }
  const sorted=rs.slice().sort((a,b)=>(Number(b.cost)||0)-(Number(a.cost)||0));
  const rows=sorted.map(r=>{
    const be=beClass(r.conv_value,r.cost), roas=Number(r.cost)>0?(Number(r.conv_value)||0)/Number(r.cost):0;
    return `<div class="mixrow"><div class="mx-top"><span class="mx-n">${esc(r.entity_name||r.entity_id)}</span>
        <span class="mx-p ${be}">${roasTxt(roas)}×</span></div>
      <div class="mx-c">${eur0(r.cost)} · ${fmtK(r.impressions)} impr · ${fmtK(r.clicks)} klik · ${conv1(r.conversions)} conv</div></div>`;
  }).join('');
  const sub = picked.period!==PERIOD ? '7 dagen (28d niet geleverd)' : PERIOD;
  return `<div class="sec"><div class="sechead"><span class="st-i"></span><h3>Advertenties</h3>
      <span class="st-sub">${sorted.length} · ${sub}</span></div>
    <div class="secbody"><div class="mixgrid"><div class="mixcol">${rows}</div></div></div></div>`;
}

function gapsSection(staleCount,pmaxCount,gridLen){
  const gaps=[];
  gaps.push('Google geeft per <b>advertentie</b> nauwelijks losse cijfers vrij. Voor <b>Performance Max</b> is de kleinste zichtbare eenheid de <b>asset-groep</b>; losse assets tonen hun <b>primary-status</b> (Actief / Beperkt / In review / …), geen eigen spend/omzet. Die status staat op de kaart en volledig in de detailweergave (klik op de tegel).');
  gaps.push('<b>Zoek-impressieaandeel</b>, de <b>netwerk/apparaat/land-mix</b> en de <b>zoektermen</b> staan op <b>campagne-niveau</b> en worden voorlopig alleen over <b>7 dagen</b> geleverd — bij 28 dagen tonen die secties de 7-daagse cijfers.');
  gaps.push('<b>Shopping</b>- en <b>Search</b>-campagnes hebben geen asset-groepen; die verschijnen op <b>campagne-niveau</b> als één kaart, en hun losse advertenties in de sectie <b>Advertenties</b>.');
  gaps.push('ROAS/CPA zijn <b>Google Ads-conversieattributie</b> (Google\u2019s eigen toerekening) en break-even is ROAS&nbsp;1,58 / CPA&nbsp;€82 — dit staat los van de GA4-last-click cijfers in de KPI-kanalen en ligt doorgaans hoger.');
  gaps.push('Alleen entiteiten met <b>levering in de gekozen periode</b> verschijnen; groepen zonder impressies vallen buiten beeld.');
  if(staleCount) gaps.push(`<b>${staleCount}</b> groep(en) niet ververst in de laatste run (levering mogelijk gestopt) — waarden zijn laatst bekend, gemarkeerd met <b>oud</b>.`);
  if(!pmaxCount && !gridLen) gaps.push('Nog geen Performance Max-asset-groepen met levering in beeld — zodra PMax draait en leestoegang live is, verschijnen de asset-groepen met hun asset-labels.');
  return `<div class="gaps"><h4><span class="cd"></span>Gaten &amp; kanttekeningen</h4><ul>${gaps.map(g=>'<li>'+g+'</li>').join('')}</ul></div>`;
}

/* ---------- lightbox (asset-detail per groep) ---------- */
function openThumb(el){
  const name=el.dataset.name, meta=el.dataset.meta, type=el.dataset.type, strength=el.dataset.strength;
  let assets=[]; try{ assets=JSON.parse(el.dataset.assets||'[]'); }catch(e){}
  let tbl='';
  if(assets.length){
    const rows=assets.map(a=>{
      const [pcls,ptxt]=psMeta(a.primary_status);
      const rsn=psReasons(a);
      return `<tr><td>${esc(fieldLabel(a.field_type))}</td>
        <td><span class="pl ${pcls}"></span>${esc(ptxt)}${rsn?`<span class="rsn">${esc(rsn)}</span>`:''}</td>
        <td>${esc(a.text||'—')}</td></tr>`;
    }).join('');
    tbl=`<table><thead><tr><th>Type</th><th>Status</th><th>Asset</th></tr></thead><tbody>${rows}</tbody></table>`;
  } else {
    tbl=`<div class="lb-note">Geen losse asset-status beschikbaar voor deze groep (niet-PMax of nog geen assets vrijgegeven door Google).</div>`;
  }
  showLb(`<div class="lb-cap">${esc(name||'')}</div>
    <div class="lb-meta">${esc(type||'')}${strength?' · ad strength: '+esc(String(strength).replace(/_/g,' ').toLowerCase()):''} · ${esc(meta||'')}</div>
    ${tbl}`);
}
function showLb(inner){ document.getElementById('lbInner').innerHTML=inner; document.getElementById('lb').classList.add('open'); }
function closeLightbox(){ document.getElementById('lb').classList.remove('open'); document.getElementById('lbInner').innerHTML=''; }
document.getElementById('lb').onclick=closeLightbox;
document.getElementById('lbClose').onclick=e=>{e.stopPropagation();closeLightbox();};
document.getElementById('lbInner').onclick=e=>e.stopPropagation();
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLightbox();});

document.getElementById('seg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  PERIOD=b.dataset.p;
  document.querySelectorAll('#seg button').forEach(x=>x.classList.toggle('on',x===b));
  render();
});

load();
</script>
