<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Social Studio · social naslagwerk · DEWI</title>
<script src="dewi-frame.js"></script><!-- uniforme volledig-scherm / cockpit-toggle -->
<style>
:root{
  --bg:#0e1116; --panel:#161b22; --panel-2:#1c232d; --line:#2a323d;
  --txt:#e6edf3; --muted:#9aa7b4; --dim:#6b7684;
  --ok:#2ea043; --ok-bg:#12261a; --no:#e5484d; --no-bg:#2a1416;
  --accent:#4c8dff; --amber:#e0a13a; --radius:14px;
  --social:#4c8dff; --reels:#c96dd8; --stories:#e0a13a; --stills:#3fb6a8;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:22px 18px 60px}
.top{display:flex;align-items:center;margin-bottom:22px;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;letter-spacing:.2px;margin-right:auto}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}
.count{font-size:13px;color:var(--muted);background:var(--panel);border:1px solid var(--line);
  padding:6px 12px;border-radius:999px;white-space:nowrap}
.nav{font-size:13px;color:var(--dim);text-decoration:none}
.nav:hover{color:var(--muted)}

/* ---- section header ---- */
.row{margin-bottom:26px}
.rowhead{display:flex;align-items:center;gap:9px;margin:0 2px 10px}
.rowhead .cd{width:9px;height:9px;border-radius:50%}
.rowhead .lbl{font-size:14px;font-weight:600;letter-spacing:.2px}
.rowhead .n{font-size:12px;color:var(--dim)}
.rowhead .fmt{font-size:11px;color:var(--dim);margin-left:auto}
.strip{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x proximity}
.strip::-webkit-scrollbar{height:8px}
.strip::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.strip::-webkit-scrollbar-track{background:transparent}
.strip .empty{color:var(--dim);font-size:12.5px;padding:22px 6px}

/* ---- feed card ---- */
.card{flex:0 0 auto;width:158px;scroll-snap-align:start;cursor:zoom-in}
.card .frame{position:relative;background:#000;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card .frame img,.card .frame video{width:100%;display:block;object-fit:cover;background:#000}
.card.r-social .frame img{aspect-ratio:1/1}
.card.r-reels .frame img,.card.r-stories .frame img,.card.r-stills .frame img{aspect-ratio:9/16}
.card .noimg{display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:28px;aspect-ratio:9/16}
.card.r-social .noimg{aspect-ratio:1/1}
.card .play{position:absolute;left:8px;bottom:8px;width:26px;height:26px;border-radius:50%;
  background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
.card .ch{position:absolute;top:7px;right:7px;font-size:9.5px;font-weight:600;padding:2px 7px;border-radius:999px;
  background:rgba(0,0,0,.6);color:#fff;letter-spacing:.03em}
.card .vbadge{position:absolute;right:7px;bottom:7px;font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;
  background:rgba(0,0,0,.66);color:#fff;display:inline-flex;gap:4px;align-items:center}
.card .cap{padding:7px 2px 0}
.card .t{font-size:12px;line-height:1.28;color:var(--txt);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .d{font-size:11px;color:var(--dim);margin-top:3px}

/* ---- per-channel panel (pipeline boven, gepost onder) ---- */
.chan{border:1px solid var(--line);background:linear-gradient(180deg,var(--panel) 0%,#13181f 100%);
  border-radius:var(--radius);padding:14px 14px 8px;margin-bottom:20px;position:relative;overflow:hidden}
.chan::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--cacc,var(--accent))}
.chan .rowhead{margin:0 2px 10px}
.chan .rowhead .lbl{font-size:15px}
.lane{margin:0 0 4px}
.lane-lbl{display:flex;align-items:center;gap:7px;margin:0 2px 7px;font-size:11px;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.lane-lbl .dash{flex:1;height:1px;background:var(--line)}
.lane-lbl .ln{font-size:11px;color:var(--dim);background:var(--panel-2);border:1px solid var(--line);
  padding:1px 8px;border-radius:999px;letter-spacing:.02em;text-transform:none}
.lane.posted{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.pipe-empty{color:var(--dim);font-size:12.5px;padding:10px 6px 14px;display:flex;align-items:center;gap:8px}
.pipe-empty .ic{opacity:.6}

/* ---- pipeline card ---- */
.pcard.pipe{width:150px}
.pcard.pipe .frame{cursor:zoom-in}
.pcard.pipe .frame img,.pcard.pipe .frame video{aspect-ratio:9/16}
.pcard.pipe.r-social .frame img,.pcard.pipe.r-social .frame video{aspect-ratio:1/1}
.pcard.pipe .noimg{aspect-ratio:9/16}
.pcard.pipe.r-social .noimg{aspect-ratio:1/1}
/* carrousel (04-10): 1 voorstel = 1 carrousel 4:5; eerste slide + aantal + mini-slides */
.pcard.pipe.r-social.car .frame img{aspect-ratio:4/5}
.slidecount{position:absolute;right:7px;bottom:7px;font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:999px;
  background:rgba(0,0,0,.68);color:#fff;letter-spacing:.03em}
.slidethumbs{display:flex;gap:3px;margin-top:7px}
.slidethumbs img{flex:1 1 0;min-width:0;aspect-ratio:4/5;object-fit:cover;border-radius:4px;border:1px solid var(--line);background:#000}
.lb-slides{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}
.lb-slides img{flex:0 0 86%;max-width:86%;scroll-snap-align:center;margin:0}
.lb-inner.wide{max-width:min(94vw,560px)}
.phase{position:absolute;top:7px;left:7px;font-size:9px;font-weight:700;padding:2px 8px;border-radius:999px;
  letter-spacing:.03em;color:#04070d}
.phase.review{background:var(--amber)}
.phase.approved{background:var(--ok);color:#fff}
.phase.draft{background:var(--dim);color:#0e1116}
.phase.scheduled{background:var(--stills);color:#04070d}
.phase.held{background:var(--no);color:#fff}
.schedline{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:11px;color:var(--txt)}
.schedline .cal{opacity:.85}
.schedline .when{font-weight:600;white-space:nowrap}
.hold{margin-left:auto;font:inherit;font-size:10px;font-weight:700;cursor:pointer;border:1px solid var(--line);
  background:var(--panel-2);color:var(--muted);padding:3px 9px;border-radius:999px;letter-spacing:.02em;flex:none}
.hold:hover{border-color:var(--no);color:var(--no)}
.hold:disabled{opacity:.5;cursor:default}
.heldline{margin-top:7px;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
.heldline .when{color:var(--dim)}
.pcard.pipe .pcap{padding:7px 9px 9px}
.pcard.pipe .pt{font-size:12px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard.pipe .psub{font-size:10.5px;color:var(--dim);margin-top:3px}

/* ---- pending (goedkeuring) section ---- */
.pending{border:1px solid #3a3320;background:linear-gradient(180deg,#191509 0%,#14161d 100%);
  border-radius:var(--radius);padding:14px 14px 6px;margin-bottom:28px}
.pending .rowhead{margin-bottom:12px}
.pcard{flex:0 0 auto;width:172px;scroll-snap-align:start;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.pcard .frame{position:relative;background:#000;cursor:zoom-in}
.pcard .frame img,.pcard .frame video{width:100%;display:block;object-fit:cover;background:#000;aspect-ratio:4/5}
.pcard .noimg{aspect-ratio:4/5;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:26px}
.pcard .play{position:absolute;left:8px;bottom:8px;width:24px;height:24px;border-radius:50%;
  background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff}
.pcard .kchip{position:absolute;top:7px;left:7px;font-size:9.5px;font-weight:700;padding:2px 8px;border-radius:999px;
  background:rgba(224,161,58,.9);color:#1a1204;letter-spacing:.03em}
.pcard .pcap{padding:8px 9px 4px}
.pcard .pt{font-size:12px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard .psub{font-size:11px;color:var(--dim);margin-top:3px}
.pacts{display:flex;gap:7px;padding:6px 9px 10px;margin-top:auto}
.mini{flex:1;border:1px solid var(--line);border-radius:9px;background:var(--panel-2);color:var(--muted);
  padding:7px 0;font-size:15px;cursor:pointer;transition:.12s}
.mini.up:hover{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.mini.down:hover{background:var(--no-bg);border-color:var(--no);color:var(--no)}
.mini:disabled{opacity:.4;cursor:default}

/* ---- output panels (mailings / blog / lifecycle) ---- */
.outs{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:6px}
@media(max-width:720px){.outs{grid-template-columns:1fr}}
.opanel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.opanel h3{margin:0 0 8px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.opanel h3 .cd{width:9px;height:9px;border-radius:50%}
.orow{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.orow:last-child{border-bottom:none}
.orow .oic{width:32px;height:32px;flex:none;border-radius:9px;background:var(--panel-2);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:15px}
.orow .om{min-width:0;flex:1}
.orow .oname{font-size:13px;font-weight:600}
.orow .odet{font-size:11px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orow .oright{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.orow .owhen{font-size:12.5px;font-weight:600;color:var(--txt)}
.orow .odate{font-size:10.5px;color:var(--dim)}
.orow .oamt{margin-top:2px;font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:999px;
  background:var(--panel-2);border:1px solid var(--line);color:var(--muted)}

/* ---- states ---- */
.state{text-align:center;padding:80px 20px;color:var(--muted)}
.state .ico{font-size:46px;color:var(--dim);margin-bottom:14px}
.state h2{font-size:18px;font-weight:600;color:var(--txt);margin:0 0 6px}
.state p{font-size:13.5px;margin:0}
.spinner{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--accent);
  border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---- approval mode (?id=) ---- */
.review{max-width:460px;margin:10px auto 0}
.review .frame{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;position:relative}
.review .frame img,.review .frame video{width:100%;display:block;background:#000}
.review .noimg{aspect-ratio:9/16;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:34px}
.review .ctitle{font-size:15px;font-weight:600;margin:12px 2px 2px}
.review .cmeta{font-size:12px;color:var(--dim);margin:0 2px}
.thumbs{display:flex;gap:14px;justify-content:center;margin-top:16px}
.tbtn{width:64px;height:52px;border:1px solid var(--line);border-radius:12px;background:var(--panel-2);
  display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;transition:.12s}
.tbtn.up{color:var(--ok)} .tbtn.up:hover{background:var(--ok-bg);border-color:var(--ok)}
.tbtn.down{color:var(--no)} .tbtn.down:hover{background:var(--no-bg);border-color:var(--no)}
.tbtn:disabled{opacity:.4;cursor:default}

/* ---- toast ---- */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
  background:var(--panel-2);border:1px solid var(--line);color:var(--txt);padding:11px 18px;
  border-radius:12px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:60}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{border-color:var(--no);color:#ffb4b7}

/* ---- lightbox ---- */
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;
  z-index:80;cursor:zoom-out;padding:24px}
.lb.open{display:flex}
.lb-inner{max-width:min(92vw,460px);max-height:92vh;display:flex;flex-direction:column;gap:12px;cursor:default}
.lb img,.lb video{max-width:100%;max-height:74vh;border-radius:12px;display:block;margin:0 auto;background:#000}
.lb-cap{color:#cfd8e3;font-size:13px;line-height:1.5;white-space:pre-wrap}
.lb-meta{color:var(--dim);font-size:12px}
.lb-links{display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
.lb-links a{font-size:12.5px;color:#bcd3ff;text-decoration:none;border:1px solid var(--line);
  padding:6px 11px;border-radius:999px}
.lb-links a:hover{border-color:var(--accent)}
.lb-close{position:absolute;top:18px;right:22px;color:#fff;font-size:26px;cursor:pointer;
  width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%;
  background:rgba(255,255,255,.1)}

.mailframe{width:100%;height:72vh;max-height:78vh;border:1px solid var(--line);border-radius:12px;background:#fff}
.lb-links a.on{border-color:var(--accent);color:#fff}
.orow.clk{cursor:zoom-in} .orow.clk:hover{background:var(--panel-2)}
.orow.smclk{cursor:zoom-in} .orow.smclk:hover{background:var(--panel-2)}
.orow .ochev{color:var(--dim);font-size:13px;flex:none;margin-left:2px}
/* ---- aanbiedingsnieuwsbrief (offer) ---- */
.ofgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.ofgrid img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:#000;max-height:none}
.ofgrid.one{grid-template-columns:1fr}
.offacts{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:12.5px;color:#cfd8e3;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.offacts .k{color:var(--dim)}
.ofchip{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:999px;margin-left:6px;vertical-align:1px}
.ofchip.on{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok)}
.ofchip.off{background:var(--panel-2);color:var(--dim);border:1px solid var(--line)}
.lb-inner.scroll{overflow-y:auto}
@media(max-width:620px){ .card{width:132px} .pcard{width:150px} }

/* ---- weekschema (statisch naslagwerk — vaste GROWTHENGINE-cadans) ---- */
.sched{margin-top:30px}
.sched .rowhead{margin:0 2px 12px}
.sched .intro{font-size:11.5px;color:var(--dim);margin:0 2px 12px;line-height:1.5}
.schedwrap{overflow-x:auto;padding-bottom:6px}
.schedwrap::-webkit-scrollbar{height:8px}
.schedwrap::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.schedwrap::-webkit-scrollbar-track{background:transparent}
.grid{display:grid;grid-template-columns:108px repeat(7,minmax(104px,1fr));gap:6px;min-width:860px}
.grid .gh{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--dim);
  padding:2px 6px 6px;text-align:center}
.grid .gh.today{color:var(--txt)}
.grid .rl{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--txt);padding:10px 6px}
.grid .rl .cd{width:9px;height:9px;border-radius:50%;flex:none}
.grid .cell{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;min-height:46px;
  padding:6px;display:flex;flex-direction:column;gap:5px;justify-content:center}
.grid .cell.today{border-color:var(--accent)}
.grid .cell.off{background:transparent;border-style:dashed;border-color:#232b35}
.grid .cell .none{color:var(--dim);font-size:14px;text-align:center}
.chip{font-size:11px;font-weight:600;line-height:1.2;padding:4px 8px;border-radius:7px;color:#04070d;
  display:flex;align-items:center;justify-content:space-between;gap:7px;white-space:nowrap}
.chip .tm{font-weight:700;opacity:.82;font-variant-numeric:tabular-nums}
.chip.sub{background:transparent;color:var(--muted);border:1px dashed var(--line);padding:3px 7px;justify-content:center}
.sched .leg{display:flex;gap:16px;flex-wrap:wrap;margin:12px 2px 0;font-size:11.5px;color:var(--dim)}
.sched .leg span{display:inline-flex;align-items:center;gap:6px}
.sched .leg .cd{width:9px;height:9px;border-radius:50%}
.sublabel{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:16px 2px 9px}
.evrow{display:flex;gap:9px;flex-wrap:wrap}
.evpill{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);
  border-radius:999px;padding:7px 13px;font-size:12px}
.evpill .ic{font-size:14px}
.evpill .ev-when{color:var(--dim)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="dot"></span> Social Studio · social naslagwerk</div>
    <div style="display:flex;align-items:center;gap:14px">
      <span class="count" id="count">—</span>
      <a class="nav" href="kpi.html">← dashboard</a>
    </div>
  </header>
  <div id="stage">
    <div class="state"><div class="spinner"></div><p>Laden…</p></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="lb" id="lb">
  <div class="lb-close" id="lbClose">✕</div>
  <div class="lb-inner" id="lbInner"></div>
</div>

<script>
const SUPA = "https://jucubuoftjehwancegma.supabase.co";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp1Y3VidW9mdGplaHdhbmNlZ21hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI2OTYwMDIsImV4cCI6MjA5ODI3MjAwMn0.gKYBE76kVv5XdMb-GuFAELdSp5R7OjCIiUzw7hW2Jus";
const DISPATCH = "https://homedecobali.app.n8n.cloud/webhook/proposal-dispatch";
const HDR = {apikey:ANON, Authorization:`Bearer ${ANON}`};

const stage = document.getElementById('stage');
const countEl = document.getElementById('count');
const toastEl = document.getElementById('toast');

const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(msg,err){toastEl.textContent=msg;toastEl.className='toast show'+(err?' err':'');
  clearTimeout(toast._t);toast._t=setTimeout(()=>toastEl.className='toast',2600);}
function dateTxt(iso){ if(!iso) return ''; const d=new Date(iso);
  return d.toLocaleDateString('nl-NL',{day:'numeric',month:'short'}); }
function schedTxt(iso){ if(!iso) return ''; const d=new Date(iso);
  const day=d.toLocaleDateString('nl-NL',{weekday:'short',day:'numeric',month:'short',timeZone:'Europe/Madrid'});
  const tm=d.toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Madrid'});
  return day+' · '+tm; }
function fmtViews(n){ n=Number(n)||0; if(n>=1000) return (n/1000).toFixed(n>=10000?0:1).replace('.',',')+'k'; return String(n); }
function fmtN(n){ return Number(n||0).toLocaleString('nl-NL'); }
function relTxt(iso){ if(!iso) return 'nog niet'; const d=new Date(iso), now=new Date();
  const days=Math.floor((now-d)/86400000);
  if(days<=0) return 'vandaag'; if(days===1) return 'gisteren';
  if(days<7) return days+' dgn geleden';
  return d.toLocaleDateString('nl-NL',{day:'numeric',month:'short'}); }
function poster(url){ if(!url) return null;
  if(url.indexOf('/video/upload/')>=0) return url.replace('/video/upload/','/video/upload/so_0,f_jpg,w_420/');
  return url; }
function slideUrl(s){ if(!s) return null; if(typeof s==='string') return s; return s.image_url||s.imageUrl||s.url||s.media_url||null; }
function carSlides(cj){ return Array.isArray(cj) ? cj.map(slideUrl).filter(Boolean) : []; }
function carouselCover(cj){ const a=carSlides(cj); return a.length?a[0]:null; }
// alle slides naast elkaar (swipe/scroll) voor de lightbox; 1 beeld = gewoon dat beeld
function slidesBody(cj,fallback){
  const a=carSlides(cj);
  if(a.length>=2) return `<div class="lb-slides">${a.map(u=>`<img src="${esc(u)}" alt="">`).join('')}</div>
    <div class="lb-meta">Carrousel · ${a.length} slides · veeg of scroll opzij</div>`;
  const cov=a[0]||fallback;
  return cov?`<img src="${esc(cov)}" alt="">`:`<div class="lb-cap">Geen media.</div>`;
}

/* ============ STUDIO default: goedkeuring-view (v_dewi_studio) + naslagwerk (v_dewi_feed) ============ */
// Drie kanaal-panelen. feedSlots = welke v_dewi_feed.slot-waarden erin vallen
// (Stories bundelt de photo-stills én de video-stories, beide landen op Stories).
// pipeSlots = welke v_dewi_pipeline.slot-waarden de open pijplijn van dit kanaal vormen.
const PANELS = [
  {key:'stories', label:'Stories',      fmt:'stories · 9:16', color:'var(--stories)',
   feedSlots:['stills','stories'], pipeSlots:['stories']},
  {key:'reels',   label:'Reels',        fmt:'video · 9:16',   color:'var(--reels)',
   feedSlots:['reels'],            pipeSlots:['reels']},
  {key:'social',  label:'Social posts', fmt:'profiel · 1:1',  color:'var(--social)',
   feedSlots:['social'],           pipeSlots:['social']}
];
let _feed = {}, _pipe = {}, _pending = [], _outs = [], _sent = [];

async function loadStudio(){
  try{
    const [rp,rf,rq,ro,rm] = await Promise.all([
      fetch(`${SUPA}/rest/v1/v_dewi_studio?select=*`,{headers:HDR}),
      fetch(`${SUPA}/rest/v1/v_dewi_feed?select=*`,{headers:HDR}),
      fetch(`${SUPA}/rest/v1/v_dewi_pipeline?select=*`,{headers:HDR}),
      fetch(`${SUPA}/rest/v1/v_dewi_outputs?select=*&order=panel,sort`,{headers:HDR}),
      fetch(`${SUPA}/rest/v1/v_dewi_sent_mailings?select=*&order=sent_at.desc`,{headers:HDR})
    ]);
    if(!rf.ok) throw new Error('feed HTTP '+rf.status);
    _pending = rp.ok ? await rp.json() : [];
    const rows = await rf.json();
    const pipe = rq.ok ? await rq.json() : [];
    const outs = ro.ok ? await ro.json() : [];
    const sent = rm.ok ? await rm.json() : [];
    renderStudio(_pending, rows, pipe, outs, sent);
  }catch(e){
    stage.innerHTML=`<div class="state"><div class="ico">⚠</div><h2>Kon Studio niet laden</h2>
      <p>${esc(e.message)} — probeer te verversen.</p></div>`;
  }
}

function renderStudio(pending, rows, pipe, outs, sent){
  const by={social:[],reels:[],stories:[],stills:[]};
  for(const x of rows){ if(by[x.slot]) by[x.slot].push(x); }
  _feed=by;
  const pby={social:[],reels:[],stories:[],stills:[]};
  for(const x of (pipe||[])){ if(pby[x.slot]) pby[x.slot].push(x); }
  _pipe=pby;
  const openN=(pipe||[]).length;
  countEl.textContent = (pending.length? pending.length+' wacht · ' : '')
    + (openN? openN+' in pijplijn · ' : '') + rows.length + ' posts · 120 dagen';

  let html='';
  // --- pending / goedkeuring-view met creative (op moment van opvraging) ---
  if(pending.length){
    const pcards = pending.map((p,i)=>pendingCard(p,i)).join('');
    html+=`<div class="pending">
      <div class="rowhead">
        <span class="cd" style="background:var(--amber)"></span>
        <span class="lbl">Wacht op goedkeuring</span>
        <span class="n">${pending.length}</span>
        <span class="fmt">Meta / Merchant</span>
      </div>
      <div class="strip">${pcards}</div>
    </div>`;
  }
  // --- per-kanaal panelen: open pijplijn boven, geposte outreach onder ---
  for(const P of PANELS){
    // geposte outreach: alle feedSlots samengevoegd, nieuwste eerst.
    // elke kaart houdt zijn eigen (slot,index) zodat openFeedMedia blijft kloppen.
    const posted=[];
    for(const s of P.feedSlots){ (by[s]||[]).forEach((p,i)=>posted.push({slot:s,p,i})); }
    posted.sort((a,b)=>new Date(b.p.posted_at||0)-new Date(a.p.posted_at||0));
    const postedCards = posted.length
      ? posted.map(x=>feedCard(x.slot,x.p,x.i)).join('')
      : `<div class="empty">Nog niets gepost in dit kanaal.</div>`;

    // open pijplijn: items uit v_dewi_pipeline voor de pipeSlots van dit kanaal.
    const pipe = P.pipeSlots.flatMap(s=>_pipe[s]||[]);
    const pipeLane = pipe.length
      ? `<div class="strip">${pipe.map((p,i)=>pipeCard(p,i)).join('')}</div>`
      : `<div class="pipe-empty"><span class="ic">✓</span> Geen open voorstellen — dit kanaal loopt automatisch door naar publicatie.</div>`;

    html+=`<div class="chan" style="--cacc:${P.color}">
      <div class="rowhead">
        <span class="cd" style="background:${P.color}"></span>
        <span class="lbl">${P.label}</span>
        <span class="n">${posted.length} gepost</span>
        <span class="fmt">${P.fmt}</span>
      </div>
      <div class="lane">
        <div class="lane-lbl">In de pijplijn <span class="dash"></span>${pipe.length?`<span class="ln">${pipe.length} open</span>`:''}</div>
        ${pipeLane}
      </div>
      <div class="lane posted">
        <div class="lane-lbl">Geposte outreach <span class="dash"></span><span class="ln">120 dagen</span></div>
        <div class="strip">${postedCards}</div>
      </div>
    </div>`;
  }
  _outs = outs||[];
  html += renderOutputs(outs||[]);
  _sent = sent||[];
  html += renderSentMailings(_sent);
  html += renderSchedule();
  stage.innerHTML=html;

  stage.querySelectorAll('.card').forEach(el=>{ el.onclick=()=>openFeedMedia(el.dataset.slot, +el.dataset.i); });
  stage.querySelectorAll('.pcard.pipe .frame').forEach(el=>{ el.onclick=()=>openPipeMedia(el.dataset.slot, +el.dataset.i); });
  stage.querySelectorAll('.pending .pcard .frame').forEach(el=>{ el.onclick=()=>openPendingMedia(+el.dataset.i); });
  stage.querySelectorAll('.mini').forEach(b=>{ b.onclick=()=>decideCard(b.dataset.id, b.dataset.kind, b); });
  stage.querySelectorAll('.hold').forEach(b=>{ b.onclick=(ev)=>{ ev.stopPropagation(); holdCard(b.dataset.id, b.dataset.kind, b); }; });
  stage.querySelectorAll('.orow.clk').forEach(el=>{ el.onclick=()=>{ const o=_outs.find(x=>x.key===el.dataset.okey); if(!o) return;
    if(o.ref_offer) return openOffer(o.ref_offer, o.last_sent);
    openMail({preview:o.ref_preview,label:o.label,mail_creative:o.ref_creative}); }; });
  stage.querySelectorAll('.orow.smclk[data-smi]').forEach(el=>{ el.onclick=()=>{ const m=_sent[+el.dataset.smi]; if(!m) return;
    if(m.offer) return openOffer(m.offer, m.sent_at);
    openMail({preview:m.preview,label:mailSubject(m),mail_creative:m.mail_creative}); }; });
}

function pendingCard(p,i){
  const isVid = p.media_type==='video' && p.video_url;
  const cov = isVid ? poster(p.video_url) : (carouselCover(p.carousel_json) || p.image_url);
  const media = cov
    ? `<img loading="lazy" src="${esc(cov)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'noimg',textContent:'🖼'}))">`
    : `<div class="noimg">🖼</div>`;
  return `<div class="pcard">
    <div class="frame" data-i="${i}">
      ${media}
      <span class="kchip">${esc(p.kind||'')}</span>
      ${isVid?'<div class="play">▶</div>':''}
    </div>
    <div class="pcap">
      <div class="pt">${esc(p.title||'')}</div>
      <div class="psub">${esc(p.origin_label||p.subtitle||'')}</div>
    </div>
    <div class="pacts">
      <button class="mini up" data-id="${esc(p.id)}" data-kind="${esc(p.kind||'')}" title="Goedkeuren">👍</button>
      <button class="mini down" data-id="${esc(p.id)}" data-kind="${esc(p.kind||'')}" title="Afkeuren">👎</button>
    </div>
  </div>`;
}

function feedCard(slot,p,i){
  const isVid = p.media_type==='video';
  const src = isVid ? poster(p.media_url) : p.media_url;
  const media = src
    ? `<img loading="lazy" src="${esc(src)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'noimg',textContent:'🖼'}))">`
    : `<div class="noimg">🖼</div>`;
  const ch = (p.channel||'').indexOf('facebook')>=0 && (p.channel||'').indexOf('instagram')>=0 ? 'FB·IG'
    : (p.channel||'').indexOf('facebook')>=0 ? 'FB'
    : (p.channel||'').indexOf('instagram')>=0 ? 'IG' : '';
  return `<div class="card r-${slot}" data-slot="${slot}" data-i="${i}">
    <div class="frame">
      ${media}
      ${isVid?'<div class="play">▶</div>':''}
      ${ch?`<div class="ch">${ch}</div>`:''}
      ${p.views!=null?`<div class="vbadge">👁 ${fmtViews(p.views)}</div>`:''}
    </div>
    <div class="cap">
      <div class="t">${esc(p.title||'')}</div>
      <div class="d">${esc(dateTxt(p.posted_at))}</div>
    </div>
  </div>`;
}

function pipeCard(p,i){
  const isVid = p.media_type==='video' && p.video_url;
  const cov = isVid ? poster(p.video_url) : (carouselCover(p.carousel_json) || p.image_url);
  const media = cov
    ? `<img loading="lazy" src="${esc(cov)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'noimg',textContent:'🖼'}))">`
    : `<div class="noimg">🖼</div>`;
  const ph = p.phase||'draft';
  const slides = isVid ? [] : carSlides(p.carousel_json);
  const isCar = slides.length>=2;
  // Ingepland (opt-out): toon geplande tijd + Tegenhouden-knop (hergebruikt de Dispatch-webhook, action=skip).
  // Tegengehouden: alleen een rustige notitie — de Scheduler slaat de rij over.
  let extra='';
  if(ph==='scheduled'){
    extra=`<div class="schedline"><span class="cal">📅</span><span class="when">${esc(schedTxt(p.scheduled_for))}</span>
      <button class="hold" data-id="${esc(p.id)}" data-kind="${esc(p.kind||'')}" title="Niet posten — tegenhouden">Tegenhouden</button></div>`;
  }else if(ph==='held'){
    extra=`<div class="heldline"><span>⛔ Tegengehouden</span>${p.scheduled_for?`<span class="when">· was ${esc(schedTxt(p.scheduled_for))}</span>`:''}</div>`;
  }
  return `<div class="pcard pipe r-${esc(p.slot)}${isCar?' car':''}">
    <div class="frame" data-slot="${esc(p.slot)}" data-i="${i}">
      ${media}
      <span class="phase ${esc(ph)}">${esc(p.phase_label||'')}</span>
      ${isVid?'<div class="play">▶</div>':''}
      ${isCar?`<span class="slidecount" title="Carrousel">▦ ${slides.length} slides</span>`:''}
    </div>
    <div class="pcap">
      <div class="pt">${esc(p.title||'')}</div>
      <div class="psub">${esc(p.origin_label||'')}${p.created_at?' · '+esc(dateTxt(p.created_at)):''}</div>
      ${isCar?`<div class="slidethumbs">${slides.slice(0,5).map(u=>`<img loading="lazy" src="${esc(u)}" alt="">`).join('')}</div>`:''}
      ${extra}
    </div>
  </div>`;
}

function openPipeMedia(slot,i){
  const p=(_pipe[slot]||[])[i]; if(!p) return;
  const isVid=p.media_type==='video'&&p.video_url;
  let body;
  if(isVid) body=`<video src="${esc(p.video_url)}" controls autoplay playsinline></video>`;
  else body=slidesBody(p.carousel_json,p.image_url);
  const links=[];
  if(p.product_url) links.push(`<a href="${esc(p.product_url)}" target="_blank" rel="noopener">Product ↗</a>`);
  showLb(`${body}
    <div class="lb-meta">${esc(p.phase_label||'')} · in de pijplijn${p.scheduled_for?' · 📅 '+esc(schedTxt(p.scheduled_for)):''}</div>
    ${p.title?`<div class="lb-cap" style="font-weight:600">${esc(p.title)}</div>`:''}
    ${p.origin_label?`<div class="lb-cap">${esc(p.origin_label)}</div>`:''}
    ${links.length?`<div class="lb-links">${links.join('')}</div>`:''}`);
}

function openFeedMedia(slot,i){
  const p=(_feed[slot]||[])[i]; if(!p) return;
  const isVid=p.media_type==='video';
  const body = isVid ? `<video src="${esc(p.media_url)}" controls autoplay playsinline></video>`
    : (p.media_url?`<img src="${esc(p.media_url)}" alt="">`:`<div class="lb-cap">Geen media.</div>`);
  const links=[];
  if(p.fb_url) links.push(`<a href="${esc(p.fb_url)}" target="_blank" rel="noopener">Bekijk op Facebook ↗</a>`);
  if(p.product_url) links.push(`<a href="${esc(p.product_url)}" target="_blank" rel="noopener">Product ↗</a>`);
  showLb(`${body}
    <div class="lb-meta">${esc(slot)} · ${esc(dateTxt(p.posted_at))}${p.external_post_id?' · IG '+esc(p.external_post_id):''}</div>
    ${p.views!=null?`<div class="lb-meta">👁 ${fmtViews(p.views)} views${p.reach!=null?' · '+fmtViews(p.reach)+' bereik':''}${p.interactions!=null?' · '+fmtViews(p.interactions)+' interacties':''}</div>`:''}
    ${p.title?`<div class="lb-cap" style="font-weight:600">${esc(p.title)}</div>`:''}
    ${p.caption?`<div class="lb-cap">${esc(p.caption)}</div>`:''}
    ${links.length?`<div class="lb-links">${links.join('')}</div>`:''}`);
}

function openPendingMedia(i){
  const p=_pending[i]; if(!p) return;
  if(isMail(p)){ return openMail({preview:p.preview,label:(p.origin_label||p.title||'mailing'),kind:p.kind,mail_creative:p.mail_creative}); }
  const isVid=p.media_type==='video'&&p.video_url;
  let body;
  if(isVid) body=`<video src="${esc(p.video_url)}" controls autoplay playsinline></video>`;
  else body=slidesBody(p.carousel_json,p.image_url);
  const links=[];
  if(p.product_url) links.push(`<a href="${esc(p.product_url)}" target="_blank" rel="noopener">Product ↗</a>`);
  showLb(`${body}
    <div class="lb-meta">${esc(p.kind||'')} · wacht op goedkeuring</div>
    ${p.title?`<div class="lb-cap" style="font-weight:600">${esc(p.title)}</div>`:''}
    ${p.subtitle?`<div class="lb-cap">${esc(p.subtitle)}</div>`:''}
    ${links.length?`<div class="lb-links">${links.join('')}</div>`:''}`);
}

async function decideCard(id,kind,btn){
  if(btn.disabled) return;
  const card=btn.closest('.pcard');
  card.querySelectorAll('.mini').forEach(b=>b.disabled=true);
  const action = btn.classList.contains('up') ? 'approve' : 'skip';
  try{
    const url=`${DISPATCH}?id=${encodeURIComponent(id)}&kind=${encodeURIComponent(kind)}&action=${action}`;
    const r=await fetch(url,{method:'GET'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    toast(action==='approve'?'👍 Goedgekeurd — naar publisher':'👎 Afgekeurd');
    card.style.transition='.25s'; card.style.opacity='0'; card.style.width='0';
    setTimeout(()=>{ card.remove();
      const left=stage.querySelectorAll('.pcard').length;
      if(!left){ const pw=stage.querySelector('.pending'); if(pw) pw.remove(); }
    },260);
  }catch(e){
    card.querySelectorAll('.mini').forEach(b=>b.disabled=false);
    toast('Actie mislukt: '+e.message,true);
  }
}

// Tegenhouden van een ingepland item: zelfde Dispatch-webhook als Telegram (action=skip -> status=held).
async function holdCard(id,kind,btn){
  if(btn.disabled) return;
  btn.disabled=true; const old=btn.textContent; btn.textContent='…';
  try{
    const url=`${DISPATCH}?id=${encodeURIComponent(id)}&kind=${encodeURIComponent(kind||'')}&action=skip`;
    const r=await fetch(url,{method:'GET'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    toast('⛔ Tegengehouden — wordt niet gepost');
    loadStudio();
  }catch(e){ btn.disabled=false; btn.textContent=old; toast('Tegenhouden mislukt: '+e.message,true); }
}

function renderOutputs(outs){
  if(!outs || !outs.length) return '';
  const ICON={story_news:'✉️',product_news:'🛍️',offer_news:'🏷️',blog:'📝',preorder:'📦',welcome:'👋',favorites:'❤️'};
  const PANELS=[['broadcast','Nieuwsbrieven & blog','var(--stories)'],['lifecycle','Lifecycle-mails','var(--stills)']];
  const block=PANELS.map(([pk,ptitle,color])=>{
    const items=outs.filter(o=>o.panel===pk);
    const orows=items.map(o=>{
      const amt=(o.amount!=null)?`<span class="oamt">${fmtN(o.amount)} ${esc(o.unit||'')}</span>`:'';
      const clk=(Array.isArray(o.ref_creative)&&o.ref_creative.length)||!!o.ref_offer;
      return `<div class="orow${clk?' clk':''}"${clk?` data-okey="${esc(o.key)}"`:''}>
        <div class="oic">${ICON[o.key]||'•'}</div>
        <div class="om">
          <div class="oname">${esc(o.label)}</div>
          ${o.detail?`<div class="odet">${esc(o.detail)}</div>`:''}
        </div>
        <div class="oright">
          <div class="owhen">${esc(relTxt(o.last_sent))}</div>
          <div class="odate">${o.last_sent?'laatst '+esc(dateTxt(o.last_sent)):'nog niet verzonden'}</div>
          ${amt}
        </div>
        ${clk?'<div class="ochev">🔍</div>':''}
      </div>`;
    }).join('') || `<div class="orow"><div class="odet">Geen data.</div></div>`;
    return `<div class="opanel"><h3><span class="cd" style="background:${color}"></span>${ptitle}</h3>${orows}</div>`;
  }).join('');
  return `<div class="outs">${block}</div>`;
}

/* ============ verzonden nieuwsbrieven (klikbaar terug te lezen) ============ */
function mailSubject(m){
  const cre=Array.isArray(m.mail_creative)?m.mail_creative:[];
  const es=cre.find(c=>c&&/^es/i.test(c.lang||''))||cre.find(c=>c&&c.subject);
  if(es&&es.subject) return es.subject;
  const first=(m.preview||'').split('\n')[0]||'';
  return first.replace(/^\[[A-Z]{2}\]\s*/,'')||'Nieuwsbrief';
}
function renderSentMailings(sent){
  if(!sent || !sent.length) return '';
  const TYPE={product_news:['🛍️','Product'],story_news:['✉️','Verhaal'],offer_news:['🏷️','Aanbieding'],overig:['📩','Overig']};
  const rows=sent.map((m,i)=>{
    const t=TYPE[m.mtype]||['📩','Nieuwsbrief'];
    const subj=mailSubject(m);
    const det=[t[1],m.variant].filter(Boolean).join(' · ');
    const clk=(Array.isArray(m.mail_creative)&&m.mail_creative.some(c=>c&&c.html))||!!m.offer;
    return `<div class="orow${clk?' smclk':''}"${clk?` data-smi="${i}"`:''}>
      <div class="oic">${t[0]}</div>
      <div class="om">
        <div class="oname">${esc(subj)}</div>
        <div class="odet">${esc(det)}</div>
      </div>
      <div class="oright">
        <div class="owhen">${esc(relTxt(m.sent_at))}</div>
        <div class="odate">${esc(dateTxt(m.sent_at))}</div>
      </div>
      ${clk?'<div class="ochev">🔍</div>':'<div class="ochev">·</div>'}
    </div>`;
  }).join('');
  return `<div class="row" style="margin-top:26px">
    <div class="rowhead">
      <span class="cd" style="background:var(--stories)"></span>
      <span class="lbl">Verzonden nieuwsbrieven</span>
      <span class="n">${sent.length}</span>
      <span class="fmt">klik om terug te lezen · 180 dagen</span>
    </div>
    <div class="opanel">${rows}</div>
  </div>`;
}

/* ============ weekschema (vaste GROWTHENGINE-cadans, Europe/Madrid) ============ */
function renderSchedule(){
  const days=['Ma','Di','Wo','Do','Vr','Za','Zo'];
  const today=(new Date().getDay()+6)%7; // ma=0 … zo=6

  const chip=o=>`<span class="chip" style="background:${o.c}">`
    +`<span>${esc(o.t)}</span><span class="tm">${esc(o.tm)}</span></span>`
    +(o.note?`<span class="chip sub">${esc(o.note)}</span>`:'');

  function row(r){
    let cells='';
    for(let d=0;d<7;d++){
      const list=[...(r.every||[]),...((r.day&&r.day[d])||[])];
      const cls='cell'+(d===today?' today':'')+(list.length?'':' off');
      cells+=`<div class="${cls}">${list.length?list.map(chip).join(''):'<span class="none">·</span>'}</div>`;
    }
    return `<div class="rl"><span class="cd" style="background:${r.col}"></span>${r.lbl}</div>${cells}`;
  }
  const header='<div class="gh"></div>'+days.map((d,i)=>`<div class="gh${i===today?' today':''}">${d}</div>`).join('');

  // --- social: profiel / stories / reels ---
  const BLUE='var(--social)', AMBER='var(--stories)', PURPLE='var(--reels)', TEAL='var(--stills)';
  const social=[
    {lbl:'Profiel', col:BLUE, day:{
      1:[{t:'Carrousel',tm:'09:00',c:BLUE}],
      3:[{t:'Carrousel',tm:'09:00',c:BLUE},{t:'Shop the Look',tm:'11:00',c:BLUE}],
      5:[{t:'Carrousel',tm:'09:00',c:BLUE}],
      6:[{t:'Carrousel',tm:'09:00',c:BLUE}]
    }},
    {lbl:'Stories', col:AMBER,
      every:[{t:'Still',tm:'14:00',c:TEAL}],
      day:{ 1:[{t:'Reveal',tm:'17:30',c:AMBER}], 4:[{t:'Reveal',tm:'17:30',c:AMBER}] }
    },
    {lbl:'Reels', col:PURPLE, day:{
      0:[{t:'Reel',tm:'17:00',c:PURPLE}],
      2:[{t:'Reel',tm:'17:00',c:PURPLE}],
      4:[{t:'Reel',tm:'17:00',c:PURPLE}],
      5:[{t:'Reel',tm:'09:00',c:PURPLE}],
      6:[{t:'Reel',tm:'09:00',c:PURPLE}]
    }}
  ];
  const socialGrid=`<div class="grid">${header}${social.map(row).join('')}</div>`;

  // --- outbound mail: vaste nieuwsbrieven + event-gestuurd ---
  const mail=[
    {lbl:'Nieuwsbrief', col:AMBER, day:{
      2:[{t:'🏷️ Aanbieding',tm:'12:00',c:AMBER,note:'om de week'}],

      <span><span class="cd" style="background:${AMBER}"></span>Story reveal (video)</span>

/* ============ single approval (?id=) ============ */
let apItem=null, apBusy=false;
async function loadApproval(id){
  try{
    const r=await fetch(`${SUPA}/rest/v1/v_dewi_studio?select=*`,{headers:HDR});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const q=await r.json();
    apItem=q.find(x=>x.id===id)||null;
    renderApproval();
  }catch(e){
    stage.innerHTML=`<div class="state"><div class="ico">⚠</div><h2>Kon voorstel niet laden</h2>
      <p>${esc(e.message)} — probeer te verversen.</p></div>`;
  }
}
function renderApproval(){
  const p=apItem;
  if(!p){ countEl.textContent='—';
    stage.innerHTML=`<div class="state"><div class="ico">✓</div><h2>Voorstel niet meer open</h2>
      <p>Al afgehandeld of verlopen. <a class="nav" href="social-studio.html">→ naar het naslagwerk</a></p></div>`; return; }
  countEl.textContent='1 goedkeuring';
  const isVid=p.media_type==='video'&&p.video_url;
  const cov=isVid?null:(carouselCover(p.carousel_json)||p.image_url);
  const media=isVid?`<video src="${esc(p.video_url)}" controls playsinline></video>`
    :(cov?`<img src="${esc(cov)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'noimg',textContent:'🖼'}))">`
    :`<div class="noimg">🖼</div>`);
  stage.innerHTML=`<div class="review">
    <div class="frame">${media}</div>
    <div class="ctitle">${esc(p.title||'')}</div>
    <div class="cmeta">${esc(p.kind||'')}${p.origin_label?' · '+esc(p.origin_label):''}</div>
    <div class="thumbs">
      <button class="tbtn up" id="btnUp" title="Goedkeuren">👍</button>
      <button class="tbtn down" id="btnDown" title="Afkeuren">👎</button>
    </div>
    <div class="state" style="padding:22px 0 0"><p style="font-size:12px">Goedkeuring geldt voor Meta / Merchant. Organic social loopt automatisch — zie het <a class="nav" href="social-studio.html">naslagwerk</a>.</p></div>
  </div>`;
  document.getElementById('btnUp').onclick=()=>decideSingle('approve');
  document.getElementById('btnDown').onclick=()=>decideSingle('skip');
}
async function decideSingle(action){
  if(apBusy||!apItem) return; apBusy=true;
  const up=document.getElementById('btnUp'),down=document.getElementById('btnDown');
  if(up)up.disabled=true; if(down)down.disabled=true;
  try{
    const url=`${DISPATCH}?id=${encodeURIComponent(apItem.id)}&kind=${encodeURIComponent(apItem.kind)}&action=${action}`;
    const r=await fetch(url,{method:'GET'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    toast(action==='approve'?'👍 Goedgekeurd — naar publisher':'👎 Afgekeurd');
    apItem=null; apBusy=false; renderApproval();
  }catch(e){
    apBusy=false; if(up)up.disabled=false; if(down)down.disabled=false;
    toast('Actie mislukt: '+e.message,true);
  }
}

/* ============ mail preview ============ */
function langOf(html){ const m=(html||'').match(/<html[^>]*lang="?([a-z]{2})/i); return m?m[1].toUpperCase():''; }
function isMail(p){ return (Array.isArray(p.mail_creative)&&p.mail_creative.length)||p.kind==='newsletter'; }
function openMail(o){
  const cre=Array.isArray(o.mail_creative)?o.mail_creative.filter(c=>c&&c.html):[];
  const inner=document.getElementById('lbInner'); inner.innerHTML='';
  if(o.preview){ const s=document.createElement('div'); s.className='lb-cap'; s.style.whiteSpace='pre-wrap'; s.style.fontWeight='600'; s.textContent=o.preview; inner.appendChild(s); }
  const meta=document.createElement('div'); meta.className='lb-meta'; meta.textContent=(o.label||o.kind||'mailing'); inner.appendChild(meta);
  if(cre.length){
    const tabs=document.createElement('div'); tabs.className='lb-links';
    const frame=document.createElement('iframe'); frame.className='mailframe'; frame.setAttribute('sandbox','allow-same-origin'); frame.setAttribute('title','mail-preview');
    const show=k=>{ frame.srcdoc=cre[k].html||''; [...tabs.children].forEach((a,j)=>a.classList.toggle('on',j===k)); };
    cre.forEach((c,k)=>{ const a=document.createElement('a'); a.href='#'; a.textContent=langOf(c.html)||('Variant '+(k+1)); a.onclick=e=>{e.preventDefault();show(k);}; tabs.appendChild(a); });
    if(cre.length>1) inner.appendChild(tabs);
    inner.appendChild(frame);
    show(0);
  } else { const d=document.createElement('div'); d.className='lb-cap'; d.textContent='Geen mail-preview beschikbaar.'; inner.appendChild(d); }
  document.getElementById('lb').classList.add('open');
}

/* ============ aanbiedingsnieuwsbrief (dewi_offer_mailings, om de week) ============ */
function openOffer(f, sentAt){
  const imgs=(Array.isArray(f.images)?f.images:[]).filter(Boolean).slice(0,4);
  const grid=imgs.length?`<div class="ofgrid${imgs.length===1?' one':''}">${imgs.map(u=>`<img src="${esc(u)}" alt="" loading="lazy">`).join('')}</div>`:'';
  const until=f.valid_until?new Date(f.valid_until).toLocaleDateString('nl-NL',{weekday:'short',day:'numeric',month:'short'}):'';
  const chip=f.active?'<span class="ofchip on">actief</span>':'<span class="ofchip off">verlopen</span>';
  const code=f.code?esc(f.code):(f.active?'<span style="color:var(--dim)">verborgen zolang actief</span>':'—');
  const rec=[f.recipients_es!=null?'ES '+fmtN(f.recipients_es):'',f.recipients_pt!=null?'PT '+fmtN(f.recipients_pt):''].filter(Boolean).join(' · ');
  const links=[];
  if(f.handle) links.push(`<a href="https://homedecobali.es/products/${encodeURIComponent(f.handle)}" target="_blank" rel="noopener">Product ↗</a>`);
  showLb(`${grid}
    <div class="lb-cap" style="font-weight:600">−${esc(f.pct)}% · ${esc(f.title||'')}</div>
    ${f.title_pt?`<div class="lb-meta">PT · ${esc(f.title_pt)}</div>`:''}
    <div class="offacts">
      <span class="k">Editie</span><span>${esc(f.edition?dateTxt(f.edition):dateTxt(sentAt))} · verzonden ${esc(relTxt(sentAt))}</span>
      <span class="k">Korting</span><span>${esc(f.pct)}% hele bestelling ${chip}</span>
      <span class="k">Geldig t/m</span><span>${esc(until)}</span>
      <span class="k">Code</span><span>${code}</span>
      <span class="k">Ontvangers</span><span>${fmtN(f.recipients_total)}${rec?' ('+esc(rec)+')':''}</span>
      ${f.utm?`<span class="k">UTM</span><span>${esc(f.utm)}</span>`:''}
      ${Array.isArray(f.campaign_ids)&&f.campaign_ids.length?`<span class="k">Brevo</span><span>campagne ${f.campaign_ids.map(esc).join(' · ')}</span>`:''}
    </div>
    ${f.desc_es?`<div class="lb-cap" style="font-size:12.5px;color:var(--muted)">${esc(f.desc_es)}</div>`:''}
    ${links.length?`<div class="lb-links">${links.join('')}</div>`:''}`);
  document.getElementById('lbInner').classList.add('scroll');
}

/* ============ lightbox ============ */
function showLb(inner){ const el=document.getElementById('lbInner'); el.classList.remove('scroll'); el.innerHTML=inner; el.classList.toggle('wide', !!el.querySelector('.lb-slides')); document.getElementById('lb').classList.add('open'); }
function closeLightbox(){ document.getElementById('lb').classList.remove('open'); document.getElementById('lbInner').innerHTML=''; }
document.getElementById('lb').onclick=closeLightbox;
document.getElementById('lbClose').onclick=e=>{e.stopPropagation();closeLightbox();};
document.getElementById('lbInner').onclick=e=>e.stopPropagation();
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLightbox();});

/* ============ boot ============ */
const wantId=new URLSearchParams(location.search).get('id');
if(wantId) loadApproval(wantId); else loadStudio();
</script>
