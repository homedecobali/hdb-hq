<!DOCTYPE html>
<!--
  DEWI — office.html
  Isometrische kantoorvloer: elke afdeling is een platform, elke agent een figuur met zijn live status
  (menu ☰ > Systeem > Office 3D). Zelfde conventie als de andere cockpit-pagina's:
  - leest SUPABASE_URL + anon key uit dewi-config.js (team-guard zit daar ook in),
  - eigen <header> met het DEWI-merkje zodat dewi-frame.js de paneel-toggle en het menu plaatst,
  - draait op de anon-key zonder sessie en leest alleen views met anon-select:
      v_office_depts        afdelingen (kleur, icoon, volgorde)
      v_office_agents       agents + status (working / ok / error / silent / paused / idle)
      v_office_tools        tool -> workflows (uit dewi_agent_tools, gevuld door Workflow Backup 02:30)
      v_office_agent_loops  open loops per workflow (alleen bij een gekozen agent)
      v_office_links        wie roept wie aan (uit dewi_agent_links, gevuld door Workflow Backup 02:30)
      dewi_runs_public      laatste runs van een gekozen agent + alle runs van de laatste 48 uur
  Samenwerking: staat er een koppeling A -> B in v_office_links en liepen A en B binnen 3 minuten van elkaar,
  dan staat A op van zijn kruk, loopt naar B, overlegt en loopt terug. Nieuwe gezamenlijke runs worden direct
  gespeeld ("Nu"); daartussen worden die van de laatste 48 uur herhaald. Knop linksonder zet het lopen uit.
  Geen bibliotheken: de scene is SVG, de projectie is 2:1 isometrisch (zie iso()).
  Indeling per afdeling: GRP = rij (pijplijn SCOUT > COMPILE > BUILD > PUBLISH > REVIEW, daarna
  overige groepen op agent_sort); binnen een rij op grp_step, dan agent_sort.
  Deeplink: office.html?agent=<agent_id>.
-->
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Office · DEWI</title>
<script src="dewi-config.js"></script>
<script src="dewi-frame.js"></script><!-- uniforme paneel-toggle + menu -->
<style>
  :root{
    --bg:#070b12; --ground:#0a101a; --slab:#111a28; --line:#1c2636; --panel:#0e1421; --panel2:#121a29;
    --text:#cfe2ec; --dim:#7590a3; --cyan:#00d4ff; --green:#3ee08f; --amber:#ffb547; --red:#ff5d5d;
    --grey:#8aa0b5; --violet:#b58cff;
    --font:'Segoe UI',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);font:13px/1.45 var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit}
  a{color:var(--cyan);text-decoration:none}
  a:hover{text-decoration:underline}
  :focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:4px}
  #app{display:flex;flex-direction:column;height:100%}

  /* kop — zelfde opbouw als organisation.html zodat dewi-frame.js zijn knop voor .spacer zet */
  header{display:flex;align-items:center;gap:16px;padding:11px 20px;flex-wrap:wrap;
    border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(0,212,255,.05),transparent)}
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 9px var(--green);align-self:center}
  .brand .ttl{font-weight:700;letter-spacing:3px;font-size:16px}
  .brand .sub{color:var(--dim);font-size:13px}
  .spacer{flex:1}
  .metrics{display:flex;gap:18px}
  .metric{text-align:right;line-height:1.1}
  .metric b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
  .metric span{font-size:11px;color:var(--dim)}
  .metric.m-error b{color:var(--red)} .metric.m-silent b{color:var(--amber)} .metric.m-working b{color:var(--cyan)}
  .metric.zero b{color:var(--dim)}
  .upd{color:var(--dim);font-size:11.5px;font-variant-numeric:tabular-nums;min-width:112px;text-align:right}

  main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 348px}
  .stage{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}

  /* tools-balk */
  .tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:10px 16px 8px;min-height:46px;border-bottom:1px solid var(--line)}
  .tools .lbl{color:var(--dim);font-size:12px;margin-right:4px}
  .tools .note{color:var(--dim);font-size:11.5px;margin-left:6px}
  .tool{appearance:none;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:4px 10px;border-radius:999px;
    border:1px solid var(--line);background:rgba(0,0,0,.3);font-size:12px;font-weight:600;color:var(--text);
    transition:border-color .12s,background .12s,color .12s}
  .tool i{font-style:normal;font-weight:700;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
  .tool:hover,.tool.pre{border-color:var(--cyan)}
  .tool.has{border-color:var(--cyan);color:var(--cyan)}
  .tool.on{background:var(--cyan);border-color:var(--cyan);color:#04101a}
  .tool.on i{color:#04101a}

  .scene{flex:1;min-height:0;overflow:auto;position:relative;background:var(--ground)}
  #floor{display:block;width:100%;height:100%;font-family:var(--font)}
  #wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:hidden}
  #wires path{fill:none;stroke:var(--cyan);stroke-width:1.1;stroke-opacity:.5;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .32s ease-out forwards}
  #wires circle{fill:var(--cyan)}
  @keyframes draw{to{stroke-dashoffset:0}}

  /* vloer */
  .ground{fill:var(--ground)}
  .grid{stroke:#111a27;stroke-width:1}
  .dept{--c:#8aa0b5}
  #floor.intro .dept{animation:rise .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i)*45ms)}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}}
  .slab{cursor:pointer;outline:none;transition:opacity .2s}
  .slab-top{fill:var(--slab);stroke:color-mix(in srgb,var(--c) 55%,transparent);stroke-width:1;stroke-linejoin:round}
  .slab-l{fill:color-mix(in srgb,var(--c) 30%,#0a0f18)}
  .slab-r{fill:color-mix(in srgb,var(--c) 15%,#0a0f18)}
  .slab:hover .slab-top,.slab:focus-visible .slab-top,.dept.cur .slab-top{stroke:var(--c);stroke-width:1.6}
  .band{fill:#fff;fill-opacity:.03}
  .plate{font-weight:700;font-size:10.5px;letter-spacing:.07em;fill:color-mix(in srgb,var(--c) 48%,#fff)}
  .count{font-weight:600;font-size:8.5px;fill:color-mix(in srgb,var(--c) 40%,#cfe2ec)}
  .lane{font-weight:700;font-size:7.6px;letter-spacing:.09em;fill:color-mix(in srgb,var(--c) 50%,#b9cbd8)}

  /* agents: vaste plek (ring + kruk) met een zittende figuur; lopers staan in een eigen laag bovenop */
  .ag{cursor:pointer;outline:none;transition:opacity .2s;--s:var(--green)}
  .ag .hit{fill:transparent}
  .ag .ring{fill:var(--s);fill-opacity:.14;stroke:var(--s);stroke-width:1.4}
  .stool-t{fill:#33465f} .stool-l{fill:#202d40} .stool-r{fill:#172131}
  .fig .torso{fill:var(--c)}
  .fig .arm{stroke:color-mix(in srgb,var(--c) 70%,#000);stroke-width:2.4;stroke-linecap:round}
  .fig .leg{fill:none;stroke:#aebdcd;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
  .fig .leg.far{stroke:#8e9fb2}
  .fig .head{fill:var(--skin,#e0ac84)}
  .fig .hair{fill:var(--hair,#2a211b)}
  .ag .loop{fill:var(--violet);stroke:#0a0f18;stroke-width:.8}
  .ag.s-working,.walker.s-working{--s:var(--cyan)} .ag.s-error,.walker.s-error{--s:var(--red)}
  .ag.s-silent,.walker.s-silent{--s:var(--amber)} .ag.s-paused,.walker.s-paused{--s:var(--grey)} .ag.s-idle,.walker.s-idle{--s:var(--dim)}
  .ag.s-silent .ring,.ag.s-idle .ring{stroke-dasharray:3 2.4}
  .s-silent .fig{opacity:.5}
  .s-idle .fig{opacity:.32}
  .s-paused .fig .torso{fill:#56667a} .s-paused .fig .head{fill:#8a99aa} .s-paused .fig .hair{fill:#56667a} .s-paused .fig .arm{stroke:#414f61} .s-paused .fig .leg{stroke:#77879a}
  .ag .badge circle{fill:var(--s);stroke:#0a0f18;stroke-width:1}
  .ag .badge text{font-weight:800;font-size:8px;fill:#06101a}
  .ag .pulse{fill:none;stroke:var(--cyan);stroke-width:1.4;transform-box:fill-box;transform-origin:center;animation:pulse 1.9s ease-out infinite}
  @keyframes pulse{from{transform:scale(1);opacity:.9}to{transform:scale(2.2);opacity:0}}
  .ag.s-working .fig .up{animation:busy .8s ease-in-out infinite}
  @keyframes busy{50%{transform:translateY(-1.1px)}}
  .ag.s-error .ring{animation:blink 1.1s steps(2,jump-none) infinite}
  @keyframes blink{from{fill-opacity:.14}to{fill-opacity:.6}}
  .ag:hover .ring,.ag:focus-visible .ring{stroke-width:2.4;fill-opacity:.32}
  .ag:focus-visible .hit{stroke:#fff;stroke-width:1;stroke-dasharray:2 2}
  .ag.sel .ring{stroke:#fff;stroke-width:2.4;fill-opacity:.4}
  .ag.away .fig,.ag.away .badge,.ag.away .pulse{display:none}
  .ag.away .ring{fill-opacity:.04;stroke-opacity:.55;stroke-dasharray:2 3}
  .bubble{display:none}
  .ag.talk .bubble,.walker.talk .bubble{display:block}
  .bubble rect,.bubble path{fill:#e8eff7}
  .bubble circle{fill:#0a0f18;animation:dots 1s infinite}
  .bubble circle:nth-of-type(2){animation-delay:.16s} .bubble circle:nth-of-type(3){animation-delay:.32s}
  @keyframes dots{0%,60%,100%{opacity:.2}30%{opacity:1}}
  .walker{cursor:pointer;transition:opacity .2s}
  .walker .shadow{fill:#000;fill-opacity:.38}
  .walker.sel .shadow{fill:#fff;fill-opacity:.5}
  #floor.has-hl .ag:not(.hl),#floor.has-hl .walker:not(.hl){opacity:.13}
  #floor.has-hl .dept:not(.hl-d) .slab{opacity:.4}

  .walkbar{position:absolute;left:66px;right:16px;bottom:16px;z-index:4;display:flex;align-items:center;gap:10px;pointer-events:none}
  .walkbar button{pointer-events:auto;appearance:none;cursor:pointer;flex:none;border:1px solid var(--line);background:rgba(7,11,18,.86);
    border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;color:var(--text)}
  .walkbar button:hover{border-color:var(--cyan)}
  .walkbar button[aria-pressed="false"]{color:var(--cyan);border-color:var(--cyan)}
  #cap{min-width:0;color:var(--text);font-size:12px;background:rgba(7,11,18,.86);border:1px solid var(--line);border-radius:999px;
    padding:5px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #cap:empty{display:none}
  #cap b{font-weight:700;color:var(--cyan)}
  #cap .muted{color:var(--dim)}

  #tip{position:absolute;z-index:5;pointer-events:none;display:none;transform:translate(-50%,-100%);white-space:nowrap;
    background:#0b1220;border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12px;box-shadow:0 6px 18px rgba(0,0,0,.5)}
  #tip b{display:block;font-weight:700}
  #tip span{color:var(--dim);font-size:11.5px}
  #msg{position:absolute;left:16px;right:16px;bottom:16px;z-index:6;display:none;background:#2a1216;border:1px solid var(--red);
    color:#ffd9d9;border-radius:10px;padding:9px 12px;font-size:12.5px}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim)}

  /* paneel */
  .panel{border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:16px 16px 28px;min-height:0}
  .panel h2{margin:0 0 2px;font-size:17px;font-weight:700;line-height:1.25}
  .panel h3{margin:20px 0 7px;font-size:12.5px;font-weight:600;color:var(--dim)}
  .panel p{margin:6px 0}
  .back{appearance:none;border:0;background:none;padding:0;margin:0 0 12px;color:var(--cyan);cursor:pointer;font-size:12.5px}
  .back:hover{text-decoration:underline}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:color-mix(in srgb,var(--c) 55%,#fff);margin-bottom:6px}
  button.chip{appearance:none;border:0;background:none;padding:0;cursor:pointer}
  button.chip:hover{text-decoration:underline}
  .pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--s);color:var(--s);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;margin:8px 0 2px}
  .sdot{width:9px;height:9px;border-radius:50%;background:var(--s);flex:none;display:inline-block}
  .s-working{--s:var(--cyan)} .s-ok{--s:var(--green)} .s-error{--s:var(--red)} .s-silent{--s:var(--amber)} .s-paused{--s:var(--grey)} .s-idle{--s:var(--dim)}
  .sdot.hollow{background:none;border:1.5px dashed var(--s)}
  .why{color:var(--dim);font-size:12.5px}
  dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 14px;margin:12px 0 0}
  dt{color:var(--dim)} dd{margin:0;overflow-wrap:anywhere}
  .sum{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:12.5px;overflow-wrap:anywhere}
  .list{list-style:none;margin:0;padding:0}
  .row{appearance:none;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;cursor:pointer;
    display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 9px;align-items:center;padding:7px 4px}
  .list li:first-child .row{border-top:0}
  .row:hover,.row.cur{background:rgba(255,255,255,.035)}
  .row .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .mt{color:var(--dim);font-size:11.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .row .sb{grid-column:2 / -1;color:var(--dim);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .ic{width:18px;text-align:center}
  .bar{grid-column:2 / -1;display:flex;height:4px;border-radius:2px;overflow:hidden;background:var(--line);margin-top:3px}
  .bar i{display:block;background:var(--s)}
  .lanehd{margin:12px 0 2px;font-size:11px;font-weight:700;letter-spacing:.06em;color:color-mix(in srgb,var(--c) 50%,#b9cbd8)}
  .runs{list-style:none;margin:0;padding:0}
  .runs li{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:12px;align-items:baseline}
  .runs li:first-child{border-top:0}
  .runs time{color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
  .runs .rs{overflow-wrap:anywhere}
  .ptools{display:flex;flex-wrap:wrap;gap:6px}
  .links{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
  .links a{border:1px solid var(--line);border-radius:9px;padding:6px 11px;font-weight:600;font-size:12.5px}
  .links a:hover{border-color:var(--cyan);text-decoration:none}
  .muted{color:var(--dim)}
  .loopitem{border-left:2px solid var(--violet);padding:2px 0 2px 9px;margin:6px 0;font-size:12.5px}

  @media (max-width:880px){
    body{overflow:auto}
    #app{height:auto;min-height:100%}
    main{display:block}
    .stage{height:66vh;min-height:400px}
    .tools{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
    .tools::-webkit-scrollbar{display:none}
    .tools .tool,.tools .lbl,.tools .note{flex:none;white-space:nowrap}
    .panel{border-left:0;border-top:1px solid var(--line);padding-bottom:84px}
    .walkbar{left:12px;right:12px;bottom:10px}
    .metrics{gap:13px} .upd{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    #floor.intro .dept,.ag .pulse,.ag.s-error .ring,#wires path,.ag.s-working .fig .up,.bubble circle{animation:none}
    #wires path{stroke-dashoffset:0}
    .ag .pulse{opacity:.5;transform:scale(1.5)}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><span class="dot" id="live"></span><span class="ttl">DEWI</span><span class="sub">Office</span></div>
    <div class="spacer"></div>
    <div class="metrics" id="metrics"></div>
    <div class="upd" id="upd"></div>
  </header>
  <main>
    <section class="stage" id="stage" aria-label="Kantoorvloer">
      <div class="tools" id="tools"><span class="lbl">Tools</span></div>
      <div class="scene" id="scene">
        <svg id="floor" role="group" aria-label="Afdelingen en agents"></svg>
        <div id="loading">Kantoor wordt opgebouwd…</div>
      </div>
      <svg id="wires" aria-hidden="true"></svg>
      <div class="walkbar"><button type="button" id="walkBtn" aria-pressed="true">Pauzeer</button><span id="cap"></span></div>
      <div id="tip" role="tooltip"></div>
      <div id="msg" role="alert"></div>
    </section>
    <aside class="panel" id="panel" aria-label="Details"></aside>
  </main>
</div>

<script>
(function () {
  "use strict";

  /* ---------------------------------------------------------------- config */
  var CFG = window.DEWI_CONFIG || {};
  var SB_URL = CFG.SUPABASE_URL || "https://jucubuoftjehwancegma.supabase.co";
  var SB_KEY = CFG.SUPABASE_ANON_KEY || "";
  var N8N = "https://homedecobali.app.n8n.cloud/workflow/";
  var REFRESH_MS = 60000;

  var HW = 26, HH = 13;                 /* halve tegel: 1 cel = 52 x 26 px op het scherm */
  var SLAB = 18;                        /* dikte van een afdelingsplatform */
  var EDGE = Math.sqrt(HW * HW + HH * HH);
  var PAD = 0.5, LANE_GAP = 0.3, MAX_COLS = 6, DEPT_GAP = 1.4;
  var MIN_SCALE = 0.85;                 /* kleiner dan dit: niet verder krimpen maar laten scrollen */
  var STAGES = ["SCOUT", "COMPILE", "BUILD", "PUBLISH", "REVIEW"];

  var WINDOW_H = 48;                    /* herhaling: gezamenlijke runs van de laatste 48 uur */
  var PAIR_MS = 180000;                 /* A en B "werkten samen" als hun runs binnen 3 minuten van elkaar liggen */
  var LIVE_MS = 900000;                 /* bij het openen telt alles van de laatste 15 minuten als "nu" */
  var WALK_SPEED = 74, STRIDE = 34, TALK_MS = 2400, MAX_WALKERS = 3;
  var SVGNS = "http://www.w3.org/2000/svg";

  var STATES = {
    error:   { l: "Fout",               g: "!" },
    silent:  { l: "Stil",               g: "z" },
    working: { l: "Bezig",              g: "" },
    ok:      { l: "In orde",            g: "" },
    paused:  { l: "Gepauzeerd",         g: "‖" },
    idle:    { l: "Nog nooit gedraaid", g: "" }
  };
  var STATE_ORDER = ["error", "silent", "working", "ok", "paused", "idle"];

  var S = { depts: [], agents: [], tools: [], byId: {}, byWf: {}, toolsByWf: {}, sig: "",
            focus: null, hoverTool: null, runs: {}, loops: {}, loadedAt: null, first: true,
            links: [], linksOut: {}, linksIn: {}, pairLast: {}, hl: null };
  /* lopers + afspeellijst */
  var W = { on: true, list: [], raf: 0, last: 0, timer: 0, started: false, trips: [], idx: 0, live: [], played: {},
            runs: [], seen: {}, lastRaw: "", liveCut: 0, linksKnown: false };
  var REDUCED = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  try { var pref = localStorage.getItem("dewi_office_walk"); W.on = pref === null ? !REDUCED : pref === "1"; } catch (e0) { W.on = !REDUCED; }

  var $ = function (id) { return document.getElementById(id); };
  var elFloor = $("floor"), elStage = $("stage"), elScene = $("scene"), elTools = $("tools"),
      elWires = $("wires"), elTip = $("tip"), elMsg = $("msg"), elPanel = $("panel"),
      elCap = $("cap"), elWalkBtn = $("walkBtn");

  /* --------------------------------------------------------------- helpers */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function st(a) { return STATES[a.state] ? a.state : "ok"; }
  function iso(x, y, z) { return [(x - y) * HW, (x + y) * HH - (z || 0)]; }
  function pts(arr) { return arr.map(function (p) { return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" "); }
  function rel(isoStr) {
    if (!isoStr) return "nooit";
    var s = (Date.now() - new Date(isoStr).getTime()) / 1000;
    if (s < 90) return "zojuist";
    if (s < 3600) return Math.round(s / 60) + " min geleden";
    if (s < 172800) return Math.round(s / 3600) + " u geleden";
    return Math.round(s / 86400) + " d geleden";
  }
  var fmtAbs = new Intl.DateTimeFormat("nl-NL", { timeZone: "Europe/Madrid", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
  var fmtDay = new Intl.DateTimeFormat("nl-NL", { timeZone: "Europe/Madrid", weekday: "short", hour: "2-digit", minute: "2-digit" });
  var fmtClock = new Intl.DateTimeFormat("nl-NL", { timeZone: "Europe/Madrid", hour: "2-digit", minute: "2-digit", second: "2-digit" });
  function abs(isoStr) { return isoStr ? fmtAbs.format(new Date(isoStr)) : "—"; }
  function shortWf(n) { var p = String(n || "").split("·"); return (p[p.length - 1] || "").trim(); }

  function rest(path) {
    return fetch(SB_URL + "/rest/v1/" + path, { headers: { apikey: SB_KEY, Authorization: "Bearer " + SB_KEY } })
      .then(function (r) {
        if (!r.ok) throw new Error(path.split("?")[0] + ": HTTP " + r.status);

      });
  }
  function settle(p) { return p.then(function (v) { return { ok: true, v: v }; }, function (e) { return { ok: false, e: e }; }); }

  /* ----------------------------------------------------------------- laden */
  function load() {
    return Promise.all([
      settle(rest("v_office_depts?select=dept_name,dept_color,dept_icon,dept_sort&order=dept_sort")),
      settle(rest("v_office_agents?select=*")),
      settle(rest("v_office_tools?select=tool,workflows")),
      settle(rest("v_office_links?select=from_agent,to_agent,kind")),
      settle(rest("dewi_runs_public?select=workflow,run_at&run_at=" + (W.lastRaw ? "gt." + encodeURIComponent(W.lastRaw)
        : "gte." + encodeURIComponent(new Date(Date.now() - WINDOW_H * 3600000).toISOString())) + "&order=run_at.desc&limit=1000"))
    ]).then(function (res) {
      if (!res[0].ok || !res[1].ok) {
        var e = (res[1].ok ? res[0].e : res[1].e) || {};
        showMsg("De office-data kon niet geladen worden (" + (e.message || e) + "). Nieuwe poging over een minuut.");
        $("live").style.background = "var(--red)"; $("live").style.boxShadow = "0 0 9px var(--red)";
        return;
      }
      showMsg("");
      $("live").style.background = ""; $("live").style.boxShadow = "";
      ingest(res[0].v || [], res[1].v || [], res[2].ok ? (res[2].v || []) : null);
      ingestWork(res[3].ok ? (res[3].v || []) : null, res[4].ok ? (res[4].v || []) : null);
    });
  }

  function ingest(depts, agents, tools) {
    S.agents = agents; S.byId = {}; S.byWf = {};
    agents.forEach(function (a) { S.byId[a.agent_id] = a; S.byWf[a.workflow_name] = a; });

    /* afdelingen: volgorde/kleur uit v_office_depts; een afdeling die daar ontbreekt komt uit de agents zelf */
    var oldPos = {};
    S.depts.forEach(function (d) { oldPos[d.name] = [d.x, d.y]; });
    var seen = {};
    S.depts = depts.map(function (d) { seen[d.dept_name] = 1; return { name: d.dept_name, color: d.dept_color || "#8aa0b5", icon: d.dept_icon || "", sort: d.dept_sort }; });
    agents.forEach(function (a) {
      if (!seen[a.dept_name]) { seen[a.dept_name] = 1; S.depts.push({ name: a.dept_name, color: a.dept_color || "#8aa0b5", icon: a.dept_icon || "", sort: a.dept_sort == null ? 999 : a.dept_sort }); }
    });
    S.depts.sort(function (x, y) { return (x.sort - y.sort) || String(x.name).localeCompare(String(y.name)); });
    S.depts.forEach(function (d) { d.agents = agents.filter(function (a) { return a.dept_name === d.name; }); });
    S.depts = S.depts.filter(function (d) { return d.agents.length; });

    if (tools) {
      S.toolsByWf = {};
      S.tools = tools.map(function (t) {
        var ids = [];
        (t.workflows || []).forEach(function (wf) {
          var a = S.byWf[wf]; if (!a) return;
          ids.push(a.agent_id);
          (S.toolsByWf[wf] = S.toolsByWf[wf] || []).push(t.tool);
        });
        return { tool: t.tool, ids: ids };
      }).filter(function (t) { return t.ids.length; })
        .sort(function (x, y) { return (y.ids.length - x.ids.length) || x.tool.localeCompare(y.tool); });
    }

    /* focus die niet meer bestaat loslaten */
    var f = S.focus;
    if (f && ((f.type === "agent" && !S.byId[f.id]) || (f.type === "dept" && !S.depts.some(function (d) { return d.name === f.name; })) ||
              (f.type === "tool" && !S.tools.some(function (t) { return t.tool === f.name; })))) S.focus = null;

    var sig = agents.map(function (a) { return [a.agent_id, a.dept_name, a.grp, a.grp_step, a.agent_sort].join("|"); }).sort().join(";")
            + "#" + S.depts.map(function (d) { return d.name + d.color + d.icon; }).join(";");
    if (sig !== S.sig) { S.sig = sig; layout(); renderFloor(); }
    else {
      /* zelfde indeling, maar S.depts en S.agents zijn nieuwe objecten: rijen, posities en tekenvolgorde opnieuw zetten */
      var byName = {};
      S.depts.forEach(function (d) {
        planDept(d); d.x = oldPos[d.name][0]; d.y = oldPos[d.name][1]; byName[d.name] = d;
        d.agents.forEach(function (a) { a._p = iso(d.x + a._lx, d.y + a._ly, SLAB); });
      });
      S.paint = S.paint.map(function (d) { return byName[d.name]; });
      patchAgents();
    }

    S.loadedAt = new Date();
    renderHeader(); renderTools(); renderPanel(); applyFocus();
    if (S.focus && S.focus.type === "agent") loadRuns(S.byId[S.focus.id]);
    if (S.first) { S.first = false; var q = new URLSearchParams(location.search).get("agent"); if (q && S.byId[q]) setFocus({ type: "agent", id: q }); }
  }

  /* --------------------------------------------------------------- indeling */
  function laneKey(l) {
    if (!l.name) return -1;
    var i = STAGES.indexOf(l.name.toUpperCase());
    return i >= 0 ? i : 10 + l.minSort / 1000;
  }
  function planDept(d) {
    var map = {}, lanes = [];
    d.agents.forEach(function (a) {
      var k = a.grp || "";
      if (!map[k]) { map[k] = { name: k, agents: [], minSort: 1e9 }; lanes.push(map[k]); }
      map[k].agents.push(a);
      map[k].minSort = Math.min(map[k].minSort, a.agent_sort == null ? 999 : a.agent_sort);
    });
    lanes.sort(function (x, y) { return laneKey(x) - laneKey(y); });
    var maxLabel = 0;
    lanes.forEach(function (l) {
      maxLabel = Math.max(maxLabel, l.name.length);
      l.agents.sort(function (x, y) {
        return ((x.grp_step == null ? 999 : x.grp_step) - (y.grp_step == null ? 999 : y.grp_step)) ||
               ((x.agent_sort == null ? 999 : x.agent_sort) - (y.agent_sort == null ? 999 : y.agent_sort)) ||
               String(x.agent_name).localeCompare(String(y.agent_name));
      });
    });
    var gutter = maxLabel ? Math.min(3.6, Math.max(1.3, maxLabel * 5.7 / EDGE + 0.55)) : 0;
    var cols = 0, y = PAD;
    lanes.forEach(function (l, i) {
      if (i) y += LANE_GAP;
      var n = l.agents.length, rows = Math.ceil(n / MAX_COLS), per = Math.ceil(n / rows);
      l.y0 = y;
      for (var r = 0; r < rows; r++) {
        l.agents.slice(r * per, (r + 1) * per).forEach(function (a, c) {
          a._lx = PAD + gutter + c + 0.5; a._ly = y + 0.5;
          cols = Math.max(cols, c + 1);
        });
        y += 1;
      }
      l.y1 = y;
    });
    d.lanes = lanes; d.gutter = gutter;
    d.labelChars = Math.max(3, Math.floor((gutter - 0.5) * EDGE / 5.7));
    d.w = Math.max(PAD * 2 + gutter + cols, (String(d.name).length * 7.3 + 40) / EDGE, 3);
    d.d = y + PAD;
  }
  /* Schermrechthoek van een platform op wereldpositie (x,y): [links, boven, rechts, onder]. */
  function screenBox(d, x, y) {
    return [(x - (y + d.d)) * HW, (x + y) * HH - SLAB - 40, ((x + d.w) - y) * HW, (x + d.w + y + d.d) * HH];
  }
  /* Platforms een voor een neerzetten op de plek die de hele scene het grootst in beeld laat (tw x th = beschikbare
     ruimte). Een wereld-rechthoek wordt op het scherm een ruit met lege hoeken; pakken op de schermmaat vult het beeld. */
  function pack(order, tw, th) {
    var placed = [], bb = null, wb = null, cost = 0;
    order.forEach(function (d) {
      var best = null;
      if (!placed.length) best = { x: 0, y: 0, c: 0 };
      else {
        for (var x = wb[0] - d.w - DEPT_GAP; x <= wb[2] + DEPT_GAP + 1e-9; x += 0.5) {
          for (var y = wb[1] - d.d - DEPT_GAP; y <= wb[3] + DEPT_GAP + 1e-9; y += 0.5) {
            var hit = false;
            for (var i = 0; i < placed.length && !hit; i++) {
              var q = placed[i];
              hit = x < q.x + q.d.w + DEPT_GAP - 1e-9 && q.x < x + d.w + DEPT_GAP - 1e-9 && y < q.y + q.d.d + DEPT_GAP - 1e-9 && q.y < y + d.d + DEPT_GAP - 1e-9;
            }
            if (hit) continue;
            var b = screenBox(d, x, y);
            var w = Math.max(bb[2], b[2]) - Math.min(bb[0], b[0]), h = Math.max(bb[3], b[3]) - Math.min(bb[1], b[1]);
            var cx = (b[0] + b[2]) / 2 - (bb[0] + bb[2]) / 2, cy = (b[1] + b[3]) / 2 - (bb[1] + bb[3]) / 2;
            var c = Math.max(w / tw, h / th) + 0.05 * (w * h) / (tw * th) + 0.00002 * (cx * cx + cy * cy * 4) / (tw + th);
            if (!best || c < best.c - 1e-9) best = { x: x, y: y, c: c };
          }
        }
      }
      placed.push({ d: d, x: best.x, y: best.y });
      var sb = screenBox(d, best.x, best.y);
      bb = bb ? [Math.min(bb[0], sb[0]), Math.min(bb[1], sb[1]), Math.max(bb[2], sb[2]), Math.max(bb[3], sb[3])] : sb;
      wb = wb ? [Math.min(wb[0], best.x), Math.min(wb[1], best.y), Math.max(wb[2], best.x + d.w), Math.max(wb[3], best.y + d.d)] : [best.x, best.y, best.x + d.w, best.y + d.d];
      cost = Math.max((bb[2] - bb[0]) / tw, (bb[3] - bb[1]) / th);
    });
    return { placed: placed, bb: bb, wb: wb, cost: cost };
  }
  function layout() {
    S.depts.forEach(planDept);
    var tw = Math.max(300, elScene.clientWidth - 28), th = Math.max(240, elScene.clientHeight - 28);
    S.sceneSize = [elScene.clientWidth, elScene.clientHeight];
    var orders = [
      S.depts.slice(),
      S.depts.slice().sort(function (p, q) { return q.w * q.d - p.w * p.d; }),
      S.depts.slice().sort(function (p, q) { return q.d - p.d || q.w - p.w; }),
      S.depts.slice().sort(function (p, q) { return q.w - p.w || q.d - p.d; })
    ];
    var best = null;
    orders.forEach(function (o) { var r = pack(o, tw, th); if (!best || r.cost < best.cost - 1e-6) best = r; });
    best.placed.forEach(function (pl) { pl.d.x = pl.x; pl.d.y = pl.y; });
    S.bb = best.bb; S.wb = best.wb;
    S.depts.forEach(function (d) { d.agents.forEach(function (a) { a._p = iso(d.x + a._lx, d.y + a._ly, SLAB); }); });

    /* tekenvolgorde van achter naar voor */
    var rest = S.depts.slice(), out = [];
    function behind(q, r) { return (q.x + q.w <= r.x + 1e-9 && q.y < r.y + r.d) || (q.y + q.d <= r.y + 1e-9 && q.x < r.x + r.w); }
    while (rest.length) {
      var pick = -1;
      for (var i = 0; i < rest.length && pick < 0; i++) {
        var free = true;
        for (var j = 0; j < rest.length && free; j++) if (j !== i && behind(rest[j], rest[i]) && !behind(rest[i], rest[j])) free = false;
        if (free) pick = i;
      }
      if (pick < 0) { pick = 0; for (var k = 1; k < rest.length; k++) if (rest[k].x + rest[k].y < rest[pick].x + rest[pick].y) pick = k; }
      out.push(rest.splice(pick, 1)[0]);
    }
    S.paint = out;
  }

  /* ---------------------------------------------------------------- tekenen */
  /* Figuur met voeten op (0,0). Staand recht van voren; zittend driekwart op een kruk (bovenlijf 3,6 px lager,
     knieen naar rechts). Huid- en haarkleur komen per agent uit look(); het shirt heeft de afdelingskleur. */
  var FIG_UP = '<line class="arm l" x1="-4.9" y1="-18.6" x2="-5.7" y2="-11.6"/><rect class="torso" x="-4.2" y="-20.6" width="8.4" height="11.6" rx="3"/>'
    + '<line class="arm r" x1="4.9" y1="-18.6" x2="5.7" y2="-11.6"/><circle class="head" cy="-24.6" r="4.3"/>'
    + '<path class="hair" d="M-4.4,-24.9a4.4,4.4 0 0 1 8.8,0q-4.4,-2.3 -8.8,0z"/>';
  var FIG_SIT = '<g class="fig"><path class="leg far" d="M-2.8,-7.2L2.4,-6.2L2.8,-.8"/>'
    + '<g transform="translate(-1.5,3.6)"><g class="up">' + FIG_UP + "</g></g>"
    + '<path class="leg" d="M-.4,-6.1L4.9,-5.1L5.3,.3"/></g>';
  var FIG_STAND = '<g class="fig"><line class="leg l" x1="-2.1" y1="-10" x2="-2.3" y2="-.6"/><line class="leg r" x1="2.1" y1="-10" x2="2.3" y2="-.6"/>'
    + '<g class="up">' + FIG_UP + "</g></g>";
  var STOOL = '<polygon class="stool-l" points="-8.2,-6.4 -1.5,-3.3 -1.5,1.3 -8.2,-1.8"/><polygon class="stool-r" points="5.2,-6.4 -1.5,-3.3 -1.5,1.3 5.2,-1.8"/>'
    + '<polygon class="stool-t" points="-8.2,-6.4 -1.5,-9.5 5.2,-6.4 -1.5,-3.3"/>';
  var SKIN = ["#f3cfae", "#e6b48c", "#cf9466", "#a9714b", "#7d4e30"], HAIR = ["#1d1a17", "#3b2a1c", "#6d4b2b", "#b38b53", "#8d8f98", "#2a2f3a"];
  function look(a) {
    var id = String(a.agent_id), n = 0;
    for (var i = 0; i < id.length; i++) n = (n * 31 + id.charCodeAt(i)) >>> 0;
    return "--skin:" + SKIN[n % SKIN.length] + ";--hair:" + HAIR[(n >>> 3) % HAIR.length];
  }
  function bubble(y) {
    return '<g class="bubble" transform="translate(4,' + y + ')"><rect width="15" height="9" rx="4.5"/><path d="M2.6,8.2l-1.8,3.6l5.2,-3.4Z"/>'
      + '<circle cx="4" cy="4.5" r="1.15"/><circle cx="7.5" cy="4.5" r="1.15"/><circle cx="11" cy="4.5" r="1.15"/></g>';
  }
  function agentInner(a) {
    var s = st(a), g = STATES[s].g;
    return '<rect class="hit" x="-13" y="-36" width="26" height="45" rx="6"/>'
      + '<ellipse class="ring" rx="11" ry="5.5"/>'
      + (s === "working" ? '<ellipse class="pulse" rx="11" ry="5.5"/>' : "")
      + STOOL + FIG_SIT
      + (g ? '<g class="badge" transform="translate(0,-32.5)"><circle r="5.2"/><text y="2.9" text-anchor="middle">' + esc(g) + "</text></g>" : "")
      + (Number(a.open_loops) > 0 ? '<path class="loop" d="M9.5,-21l3.2,3.2l-3.2,3.2l-3.2,-3.2Z"/>' : "")
      + bubble(-39);
  }
  function walkerInner() {
    return '<ellipse class="shadow" rx="6.4" ry="2.7"/><g class="flip">' + FIG_STAND + "</g>" + bubble(-42);
  }
  function agentLabel(a) { return a.agent_name + ", " + STATES[st(a)].l.toLowerCase() + ", afdeling " + a.dept_name; }

  function renderFloor() {
    var wb = S.wb, far = 40, h = "", i, a, b;
    var gx0 = Math.floor(wb[0]) - far, gx1 = Math.ceil(wb[2]) + far, gy0 = Math.floor(wb[1]) - far, gy1 = Math.ceil(wb[3]) + far;
    h += '<polygon class="ground" points="' + pts([iso(gx0, gy0), iso(gx1, gy0), iso(gx1, gy1), iso(gx0, gy1)]) + '"/>';
    for (i = gx0; i <= gx1; i += 2) { a = iso(i, gy0); b = iso(i, gy1); h += '<line class="grid" x1="' + a[0] + '" y1="' + a[1] + '" x2="' + b[0] + '" y2="' + b[1] + '"/>'; }
    for (i = gy0; i <= gy1; i += 2) { a = iso(gx0, i); b = iso(gx1, i); h += '<line class="grid" x1="' + a[0] + '" y1="' + a[1] + '" x2="' + b[0] + '" y2="' + b[1] + '"/>'; }

    S.paint.forEach(function (d, di) {
      var x0 = d.x, y0 = d.y, x1 = d.x + d.w, y1 = d.y + d.d;
      h += '<g class="dept" data-dept="' + esc(d.name) + '" style="--c:' + esc(d.color) + ";--i:" + di + '">';
      h += '<g class="slab" tabindex="0" role="button" aria-label="Afdeling ' + esc(d.name) + ", " + d.agents.length + ' agents">';
      h += '<polygon class="slab-l" points="' + pts([iso(x0, y1, SLAB), iso(x1, y1, SLAB), iso(x1, y1), iso(x0, y1)]) + '"/>';
      h += '<polygon class="slab-r" points="' + pts([iso(x1, y1, SLAB), iso(x1, y0, SLAB), iso(x1, y0), iso(x1, y1)]) + '"/>';
      h += '<polygon class="slab-top" points="' + pts([iso(x0, y0, SLAB), iso(x1, y0, SLAB), iso(x1, y1, SLAB), iso(x0, y1, SLAB)]) + '"/>';
      d.lanes.forEach(function (l) {
        if (d.lanes.length > 1) {
          h += '<polygon class="band" points="' + pts([iso(x0 + 0.22, y0 + l.y0 + 0.05, SLAB), iso(x1 - 0.22, y0 + l.y0 + 0.05, SLAB), iso(x1 - 0.22, y0 + l.y1 - 0.05, SLAB), iso(x0 + 0.22, y0 + l.y1 - 0.05, SLAB)]) + '"/>';
        }
        if (l.name) {

        }
      });
      var pp = iso(x0 + 0.3, y1, 0);
      h += '<text class="plate" transform="matrix(.894,.447,0,1,' + pp[0].toFixed(1) + "," + (pp[1] - 5.2).toFixed(1) + ')">' + esc((d.icon ? d.icon + " " : "") + d.name) + "</text>";
      if (d.d >= 2.4) {

        h += '<text class="count" transform="matrix(.894,-.447,0,1,' + cp[0].toFixed(1) + "," + (cp[1] - 5.6).toFixed(1) + ')">' + d.agents.length + " agents</text>";
      }
      h += "</g>";
      d.agents.slice().sort(function (p, q) { return (p._lx + p._ly) - (q._lx + q._ly); }).forEach(function (ag) {
        h += '<g class="ag s-' + st(ag) + '" data-id="' + esc(ag.agent_id) + '" style="' + look(ag) + '" tabindex="0" role="button" aria-label="' + esc(agentLabel(ag)) +
             '" transform="translate(' + ag._p[0].toFixed(1) + "," + ag._p[1].toFixed(1) + ')">' + agentInner(ag) + "</g>";
      });
      h += "</g>";
    });

    h += '<g id="walk-layer"></g>';
    S.vb = [S.bb[0] - 16, S.bb[1] - 14, S.bb[2] - S.bb[0] + 32, S.bb[3] - S.bb[1] + 30];
    elFloor.setAttribute("viewBox", S.vb.map(function (n) { return n.toFixed(1); }).join(" "));
    clearWalkers();
    elFloor.innerHTML = h;
    $("loading").style.display = "none";
    fit(true);
    if (S.first) { elFloor.classList.add("intro"); setTimeout(function () { elFloor.classList.remove("intro"); }, 1400); }
  }
  /* Past de scene in beeld; wordt hij daardoor te klein om te lezen, dan vaste schaal en scrollen. */
  function fit(center) {
    if (!S.vb) return;

    if (sc < MIN_SCALE) {

      if (center) { elScene.scrollLeft = (elScene.scrollWidth - cw) / 2; elScene.scrollTop = 0; }
    } else { elFloor.style.width = ""; elFloor.style.height = ""; }
  }
  function agentEl(id) { return elFloor.querySelector('.ag[data-id="' + CSS.escape(id) + '"]'); }
  function patchAgents() {

  }

  /* ------------------------------------------------------------------- kop */
  function counts(list) {
    var c = {}; STATE_ORDER.forEach(function (k) { c[k] = 0; });
    list.forEach(function (a) { c[st(a)]++; });
    return c;
  }
  function renderHeader() {
    var c = counts(S.agents), runs = 0;
    S.agents.forEach(function (a) { runs += Number(a.runs_24h) || 0; });
    function m(cls, val, lbl) { return '<div class="metric ' + cls + (val ? "" : " zero") + '"><b>' + val + "</b><span>" + lbl + "</span></div>"; }
    $("metrics").innerHTML = m("", S.agents.length, "agents") + m("m-working", c.working, "bezig") + m("m-error", c.error, "fout") + m("m-silent", c.silent, "stil") + m("", runs, "runs 24 u");
    $("upd").textContent = "bijgewerkt " + fmtClock.format(S.loadedAt);
  }

  /* ----------------------------------------------------------------- tools */

        var a = hd.getBoundingClientRect();

  elFloor.addEventListener("pointerout", function (e) { if (closest(e.target, ".ag,.walker")) hideTip(); });
  elFloor.addEventListener("focusin", function (e) { var ag = closest(e.target, ".ag"); if (ag) tipFor(ag); });
  elFloor.addEventListener("focusout", hideTip);

  /* ---------------------------------------------------------- samenwerking */
  /* Koppelingen (wie roept wie aan) + runs van de laatste 48 uur -> tochten. Een tocht = agent A loopt langs
     een of meer agents B waarmee hij rond hetzelfde moment draaide. */
  function ingestWork(links, runs) {
    if (links) {
      W.linksKnown = true;
      S.links = []; S.linksOut = {}; S.linksIn = {};
      links.forEach(function (l) {
        if (!S.byId[l.from_agent] || !S.byId[l.to_agent] || l.from_agent === l.to_agent) return;
        var o = { from: l.from_agent, to: l.to_agent, kind: l.kind };
        S.links.push(o);
        (S.linksOut[o.from] = S.linksOut[o.from] || []).push(o);
        (S.linksIn[o.to] = S.linksIn[o.to] || []).push(o);
      });
    }
    var firstRuns = !W.lastRaw && !!runs;
    var prevMax = 0;
    W.runs.forEach(function (r) { if (r.t > prevMax) prevMax = r.t; });
    if (runs) {
      runs.forEach(function (r) {
        var key = r.workflow + "|" + r.run_at; if (W.seen[key]) return;
        W.seen[key] = 1;
        W.runs.push({ wf: r.workflow, t: Date.parse(r.run_at) });
        if (!W.lastRaw || r.run_at > W.lastRaw) W.lastRaw = r.run_at;
      });
      var cutoff = Date.now() - WINDOW_H * 3600000;
      W.runs = W.runs.filter(function (r) { return r.t >= cutoff; });
    }
    if (firstRuns) W.liveCut = Date.now() - LIVE_MS; else if (prevMax) W.liveCut = Math.max(W.liveCut, prevMax);

    var trips = buildTrips();
    W.trips = trips;
    if (W.idx > trips.length) W.idx = 0;
    trips.forEach(function (tr) {
      var key = tr.from + "|" + tr.t;
      if (tr.tEnd > W.liveCut && !W.played[key]) { W.played[key] = 1; if (W.on) W.live.push(tr); }   /* staat lopen uit, dan niet opsparen */
    });
    if (S.focus && S.focus.type === "agent") renderPanel();
    if (!W.started && S.agents.length) { W.started = true; schedule(1700); }
    if (!W.on || (!W.list.length && !W.live.length)) idleCaption();
  }
  function buildTrips() {
    var by = {}, ev = [], trips = [], perFrom = {};
    W.runs.forEach(function (r) { (by[r.wf] = by[r.wf] || []).push(r.t); });
    S.pairLast = {};
    S.links.forEach(function (l) {
      var ta = by[S.byId[l.from].workflow_name], tb = by[S.byId[l.to].workflow_name];
      if (!ta || !tb) return;
      ta.forEach(function (t) {
        var m = null;
        for (var i = 0; i < tb.length; i++) if (Math.abs(tb[i] - t) <= PAIR_MS && (m === null || Math.abs(tb[i] - t) < Math.abs(m - t))) m = tb[i];
        if (m === null) return;
        ev.push({ t: t, tm: Math.max(t, m), from: l.from, to: l.to });
        var k = l.from + ">" + l.to; if (!S.pairLast[k] || t > S.pairLast[k]) S.pairLast[k] = t;
      });
    });
    ev.sort(function (x, y) { return (x.t - y.t) || (x.from < y.from ? -1 : x.from > y.from ? 1 : 0); });
    ev.forEach(function (e) {
      var hit = null;
      for (var i = trips.length - 1; i >= 0 && e.t - trips[i].tLast <= 300000; i--) if (trips[i].from === e.from) { hit = trips[i]; break; }
      if (hit) { if (hit.stops.indexOf(e.to) < 0 && hit.stops.length < 4) hit.stops.push(e.to); hit.tLast = e.t; hit.tEnd = Math.max(hit.tEnd, e.tm); }
      else trips.push({ t: e.t, tLast: e.t, tEnd: e.tm, from: e.from, stops: [e.to] });   /* tEnd = laatste run van het tweetal: bepaalt of het "nu" is */
    });
    /* een agent die elk kwartier samen met een ander draait mag de herhaling niet vullen: hooguit zijn 5 laatste tochten */
    for (var j = trips.length - 1; j >= 0; j--) {
      perFrom[trips[j].from] = (perFrom[trips[j].from] || 0) + 1;
      if (perFrom[trips[j].from] > 5) trips.splice(j, 1);
    }
    return trips;
  }

  /* ----------------------------------------------------------------- lopers */
  function walkerOf(id) { for (var i = 0; i < W.list.length; i++) if (W.list[i].id === id) return W.list[i]; return null; }
  function busy(id) {                 /* loopt zelf, of krijgt net bezoek */
    if (walkerOf(id)) return true;
    for (var i = 0; i < W.list.length; i++) if (W.list[i].stops.indexOf(id) >= 0) return true;
    return false;
  }
  function onPlatform(sx, sy) {       /* ligt dit punt (op platformhoogte) boven een platform? anders loopt hij over de vloer */
    var a = sx / HW, b = (sy + SLAB) / HH, wx = (a + b) / 2, wy = (b - a) / 2;
    for (var i = 0; i < S.depts.length; i++) {
      var d = S.depts[i];
      if (wx >= d.x - 0.08 && wx <= d.x + d.w + 0.08 && wy >= d.y - 0.08 && wy <= d.y + d.d + 0.08) return true;
    }
    return false;
  }
  function standPoint(id, fromX) {    /* plek naast de kruk van de ander, aan de kant waar de loper vandaan komt */
    var p = S.byId[id]._p; return [p[0] + (fromX <= p[0] ? -13 : 13), p[1] + 5];
  }
  function names(ids) { return ids.map(function (id) { return S.byId[id] ? S.byId[id].agent_name : id; }).join(", "); }
  function setCaption(tr, live) {
    elCap.innerHTML = (live ? "<b>Nu</b> " : '<span class="muted">Herhaling ' + esc(fmtDay.format(new Date(tr.t))) + "</span> ")
      + esc(names([tr.from])) + " → " + esc(names(tr.stops));
  }
  function idleCaption() {
    if (!W.on) { elCap.innerHTML = '<span class="muted">Lopen staat uit</span>'; return; }
    if (!W.linksKnown || !S.links.length) elCap.innerHTML = '<span class="muted">Nog geen samenwerking bekend; volgt na de Workflow Backup van 02:30</span>';
    else if (!W.trips.length) elCap.innerHTML = '<span class="muted">Geen gezamenlijke runs in de laatste ' + WINDOW_H + " uur</span>";
  }
  function renderWalkBtn() {
    elWalkBtn.textContent = W.on ? "Pauzeer" : "Laat lopen";
    elWalkBtn.setAttribute("aria-pressed", W.on ? "true" : "false");
    elWalkBtn.title = W.on ? "Lopen stilzetten" : "Agents weer laten lopen";
  }
  function schedule(ms) { clearTimeout(W.timer); W.timer = setTimeout(player, ms); }
  function player() {
    if (!W.on) return;
    if (document.hidden || !S.agents.length) return schedule(2500);
    var live = W.live.length > 0, tr = null;
    if (live) tr = W.live[0];
    else if (W.trips.length) {
      if (W.idx >= W.trips.length) { W.idx = 0; return schedule(W.trips.length > 3 ? 5000 : 9000); }   /* adempauze tussen rondes */
      tr = W.trips[W.idx];
    }
    if (!tr) { idleCaption(); return schedule(8000); }
    var ids = [tr.from].concat(tr.stops);
    if (W.list.length >= MAX_WALKERS || ids.some(busy)) return schedule(900);
    if (live) W.live.shift(); else W.idx++;
    startTrip(tr, live);
    schedule(3600);
  }
  function startTrip(tr, live) {
    var a = S.byId[tr.from], home = a && agentEl(tr.from), layer = elFloor.querySelector("#walk-layer");
    if (!home || !layer) return;
    var stops = tr.stops.filter(function (id) { return S.byId[id] && agentEl(id); });
    if (!stops.length) return;
    var g = document.createElementNS(SVGNS, "g");
    g.setAttribute("class", "walker s-" + st(a) + (S.hl && S.hl.indexOf(a.agent_id) >= 0 ? " hl" : "") + (S.focus && S.focus.type === "agent" && S.focus.id === a.agent_id ? " sel" : ""));
    g.setAttribute("data-id", a.agent_id);
    g.setAttribute("style", "--c:" + (a.dept_color || "#8aa0b5") + ";" + look(a));
    g.innerHTML = walkerInner();
    layer.appendChild(g);
    home.classList.add("away");
    var w = { id: a.agent_id, el: g, x: a._p[0], y: a._p[1], hx: a._p[0], hy: a._p[1], drop: 0, phase: 0, face: 1,
              stops: stops, i: 0, mode: "rise", wait: 260, target: standPoint(stops[0], a._p[0]),
              legs: g.querySelectorAll(".leg"), arms: g.querySelectorAll(".arm"), up: g.querySelector(".up"), flip: g.querySelector(".flip") };
    W.list.push(w);
    setCaption({ t: tr.t, from: tr.from, stops: stops }, live);
    draw(w, false);
    if (S.pairs && S.pairs.length) drawWires();
    if (!W.raf) { W.last = 0; W.raf = requestAnimationFrame(frame); }
  }
  function endTalk(w) {
    w.el.classList.remove("talk");
    var o = agentEl(w.stops[w.i]); if (o) o.classList.remove("talk");
  }
  function finish(w) {
    if (w.mode === "talk") endTalk(w);
    if (w.el.parentNode) w.el.parentNode.removeChild(w.el);
    var home = agentEl(w.id); if (home) home.classList.remove("away");
    var i = W.list.indexOf(w); if (i >= 0) W.list.splice(i, 1);
  }
  function clearWalkers() {
    W.list.slice().forEach(finish);
    Array.prototype.forEach.call(elFloor.querySelectorAll(".ag.away,.ag.talk"), function (e) { e.classList.remove("away", "talk"); });
  }
  function draw(w, moving) {
    var sw = moving ? Math.sin(w.phase / STRIDE * 2 * Math.PI) : 0, a = sw * 27;
    w.legs[0].setAttribute("transform", "rotate(" + a.toFixed(1) + " 0 -10)");
    w.legs[1].setAttribute("transform", "rotate(" + (-a).toFixed(1) + " 0 -10)");
    w.arms[0].setAttribute("transform", "rotate(" + (-a * 0.8).toFixed(1) + " -4.9 -18.6)");
    w.arms[1].setAttribute("transform", "rotate(" + (a * 0.8).toFixed(1) + " 4.9 -18.6)");
    w.up.setAttribute("transform", "translate(0," + (-Math.abs(sw) * 0.9).toFixed(2) + ")");
    w.flip.setAttribute("transform", "scale(" + w.face + ",1)");
    w.el.setAttribute("transform", "translate(" + w.x.toFixed(1) + "," + (w.y + w.drop).toFixed(1) + ")");
  }
  function step(w, dt) {
    var moving = false;
    if (w.mode === "rise" || w.mode === "talk") {
      w.wait -= dt * 1000;
      if (w.wait <= 0) {
        if (w.mode === "talk") {
          endTalk(w); w.i++;
          if (w.i < w.stops.length) { w.target = standPoint(w.stops[w.i], w.x); w.mode = "walk"; }
          else { w.target = [w.hx, w.hy]; w.mode = "home"; }
        } else w.mode = "walk";
      }
    } else {
      var dx = w.target[0] - w.x, dy = w.target[1] - w.y, dist = Math.sqrt(dx * dx + dy * dy), go = WALK_SPEED * dt;
      if (dist <= go) {
        w.x = w.target[0]; w.y = w.target[1];
        if (w.mode === "home") { finish(w); if (S.pairs && S.pairs.length) drawWires(); return; }
        var o = agentEl(w.stops[w.i]), op = S.byId[w.stops[w.i]];
        if (op) w.face = op._p[0] >= w.x ? 1 : -1;
        w.mode = "talk"; w.wait = TALK_MS; w.el.classList.add("talk"); if (o) o.classList.add("talk");
      } else {
        w.x += dx / dist * go; w.y += dy / dist * go; w.phase += go; moving = true;
        if (Math.abs(dx) > 0.6) w.face = dx < 0 ? -1 : 1;
      }
    }
    var want = onPlatform(w.x, w.y) ? 0 : SLAB;
    w.drop += (want - w.drop) * Math.min(1, dt * 11);
    draw(w, moving);
  }
  function frame(ts) {
    var dt = W.last ? Math.min(0.05, (ts - W.last) / 1000) : 0.016;
    W.last = ts;
    W.list.slice().forEach(function (w) { step(w, dt); });
    W.raf = W.list.length ? requestAnimationFrame(frame) : 0;
  }
  elWalkBtn.addEventListener("click", function () {
    W.on = !W.on;
    try { localStorage.setItem("dewi_office_walk", W.on ? "1" : "0"); } catch (e) {}
    renderWalkBtn();
    if (W.on) { W.started = true; elCap.innerHTML = ""; schedule(300); }
    else { clearTimeout(W.timer); clearWalkers(); idleCaption(); if (S.pairs && S.pairs.length) drawWires(); }
  });

  /* ----------------------------------------------------------------- start */
  renderWalkBtn();
  if (!SB_KEY) { $("loading").style.display = "none"; showMsg("dewi-config.js is niet geladen: geen Supabase-sleutel gevonden."); return; }
  load();
  setInterval(function () { if (!document.hidden) load(); }, REFRESH_MS);
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && S.loadedAt && Date.now() - S.loadedAt.getTime() > REFRESH_MS) load();
  });
})();
</script>
</body>
</html>
