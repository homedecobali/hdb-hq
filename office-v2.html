<!DOCTYPE html>
<!--
  DEWI — office-v2.html  (v2-presentatielaag; office.html blijft ongewijzigd als terugvaloptie)
  Isometrisch kantoor rond een centrale BRAIN: elke afdeling is een platform aan een datapijp,
  elke agent een bureau met monitor en stoel; de monitor draagt de live status.
  (menu ☰ > Systeem > Office v2). Zelfde conventie als de andere cockpit-pagina's:
  - leest SUPABASE_URL + anon key uit dewi-config.js (team-guard zit daar ook in),
  - eigen <header> met het DEWI-merkje zodat dewi-frame.js de paneel-toggle en het menu plaatst,
  - draait op de anon-key zonder sessie en leest alleen views met anon-select:
      v_office_depts        afdelingen (kleur, icoon, volgorde)
      v_office_agents       agents + status (working / ok / error / silent / paused / idle)
      v_office_tools        tool -> workflows (uit dewi_agent_tools, gevuld door Workflow Backup 02:30)
      v_office_links        agent -> agent (sub-workflow-aanroepen, uit dewi_agent_links)
      v_office_agent_loops  open loops per workflow (alleen bij een gekozen agent)
      dewi_runs_public      laatste runs (alleen bij een gekozen agent)
  Geen bibliotheken: de scene is SVG, de projectie is 2:1 isometrisch (zie iso()).
  Verschil met office.html: radiale indeling rond de Brain, permanente datapijpen met lopende
  puntjes (snelheid = runs 24 u), stippelbogen voor sub-workflow-koppelingen, bureau+monitor+stoel
  per agent, zwevende afdelingskaartjes, wheel-zoom + drag-pan op de viewBox, zoom naar selectie,
  paneel in terminal-stijl. Monitors tonen statuskleur (geen view levert een output-beeld); een
  afbeeldings-URL in een run-samenvatting wordt in het paneel als thumbnail getoond.
  Deeplink: office-v2.html?agent=<agent_id>.
  Brain (12-10): boven het Brain-platform zweeft een levend 3D-brein (office-v2-assets/brain-core.mp4,
  10 s naadloze loop, zwarte achtergrond). Het is een HTML-<video> over de SVG met mix-blend-mode:screen
  (zwart valt weg) die via placeBrainLive() de onzichtbare .live-anchor in de scene volgt bij zoom/pan/resize.
  Reduced motion: alleen de stilstaande poster (brain-core.webp).
  Powerballen (12-10): een agent die de Brain aanspreekt (= zijn workflow heeft een AI-tool, anthropic/openai,
  volgens v_office_tools) stuurt bij elke NIEUWE run (last_run_at veranderd sinds de vorige verversing) een
  gloeiende bal in de afdelingskleur: bureau -> platformrand -> datapijp -> lichtpilaar -> brein, met een
  flits bij aankomst. Zolang zo'n agent 'working' is volgt er elke ~7 s een bal. Runs uit de afgelopen
  minuut worden over de minuut uitgesmeerd. Niet bij reduced motion of een verborgen tab.
  Sub-afdelingen (12-10): roept een agent een sub-agent aan (v_office_links, kind subworkflow/webhook) en
  heeft die sub-agent een nieuwe run (of draait hij) terwijl de aanroeper vlak ervoor draaide, dan klapt er
  aan de buitenkant van de afdeling van de aanroeper tijdelijk een mini-platform met loopbrug uit. De
  aanroeper zelf staat op uit zijn stoel (opsta-frames op zijn eigen bureau, ~0,8 s), zijn bureau wordt leeg,
  hij loopt via de gangpaden tussen de bureaus naar de rand, over de brug, gaat op het sub-bureau zitten,
  werkt (zolang de sub-agent 'working' is, anders ~9 s), staat op, loopt terug en gaat weer zitten; dan
  vervaagt het platform. Eén persoon kan maar op één plek zijn: is de aanroeper al onderweg, dan wacht een
  volgende sub-run (max. 3 pogingen). Klik op het platform = de sub-agent openen.
  Extra werkplekken (15-10, vervangt de koppeling-op-tijd hierboven): een agent met "sub-workflow" in zijn
  schema (isSub) krijgt GEEN bureau; hij telt wel mee in alle totalen, kaartjes en het paneel (d.agents = alle,
  d.desks = met bureau, d.subs = zonder; in het afdelingspaneel onder SUB-WORKFLOWS). Elke verversing haalt de
  sub-runs van het afgelopen half uur uit dewi_runs_public; elke nieuwe run is een aanroep. callerOf() zoekt wie
  aanriep: eerst op naam in de run-samenvatting ("Copy OK - Reels Builder", "melding voor Reel-Publisher"),
  eerst onder de gekoppelde aanroepers (v_office_links), dan onder alle agents; anders de gekoppelde aanroeper
  die het dichtst bij die run draaide (≤ 20 min). Is de aanroeper zelf een sub-workflow (Propose -> Notify),
  dan wordt diens aanroeper gezocht (max. 3 niveaus) tot de agent van de hoofdworkflow. Bij de afdeling van die
  agent klapt een extra werkplek uit; hij staat op, loopt erheen, werkt er (duur = duration_ms van de run,
  6–20 s; gebruikt de sub-workflow AI dan gaat er een powerbal vanaf die werkplek) en loopt terug naar zijn
  stoel. Per aanroeper één tocht tegelijk; aanroepen die binnenkomen terwijl hij nog zit werkt hij daar na
  elkaar af (label i/n), latere wachten in zijn rij (max. 6, max. 5 min oud). Verschillende afdelingen (twee
  aanroepers van Telegram/Notify tegelijk) krijgen elk hun eigen werkplek. Geen SUB_SKIP meer. Eerste lading
  speelt niets na. De volgcamera (Motion) negeert sub-agents; de aanroeper triggert hem zelf.
  Loper (13-10): walker-v4.webp + map (640 x 480 = 4 x 2 frames van 160 x 240; rij 0 = naar rechtsonder,
  rij 1 = naar rechtsboven, links = gespiegeld). Alleen frames met dezelfde lichaamsrichting (geen draai).
  Diepte: binnen een afdeling wordt de loper tussen de bureaus in de tekenvolgorde gezet (x + y).
  Zonder sheet: een holografische figuur van die maat.
  Tekstballonnen (12-10): een agent in 'working' (en een kopie die op een sub-platform zit) krijgt een
  ballonnetje met wat hij doet (begin van last_summary, anders zijn naam). Max. 8 tegelijk, rustig zwevend.
  Lege runs (12-10): summary met idle / (stil) / geen bijvulling / niets te … / worklist leeg telt niet als
  actief (NOOP_RE in st()); ook geen powerbal of sub-afdeling.
  Koppelingsbogen (12-10): alleen getekend als beide agents actief zijn (dan oplichtend en stromend), of
  als een van beide de gekozen agent is; inactieve stippellijnen verdwijnen.
  Avatars v3 (12-10): desk-v3.webp / walker-v3.webp zijn de basis; *-v3-map.webp coderen per pixel
  R = schaduw, G = kleding-gewicht, B = haar-gewicht. Bij het laden kleurt tinted() per combinatie
  (afdelingskleur x haarkleur) één keer een canvas in en cachet de data-URL; geen SVG-filters, dus geen
  kosten bij zoom/pan. Haarkleur per agent = hash(agent_id) uit HAIR. screen-v3.webp = schermvlak van de
  nieuwe monitor (masker voor de statuskleur). Zolang de v3-bestanden niet geladen zijn: oude sprites.
  Bureau-poses (13-10): desk-empty-v3.webp (leeg bureau, zelfde uitlijning als desk-v3, geen figuur dus geen
  map) voor gepauzeerde / nooit-gedraaide agents en voor een agent die weg is; desk-stand-v3.webp + map
  (6 frames van 384 x 487 naast elkaar: zitten -> opstaan -> omdraaien; zelfde breedte/uitlijning als
  desk-v3, 56 bronpixels extra onderaan voor de voeten). S.pose[agent_id] = { p: 'stand'|'empty', f }.
  Leesbaarheid paneel (13-10): rechterpaneel standaard 420 px breed, 13 px tekst x zoom 115 %, lichter --dim.
  Kop: Paneel A− / A+ (90–180 %), ⇔ (420 <-> 600 px), ↺ (standaard). Sleepgreep op de linkerrand van het paneel
  (dubbelklik = standaard, pijltjestoetsen bij focus). Keuze per browser in localStorage 'dewi.office2.panel'.
  Inrichting (14-10): elke afdeling heeft lage wanden op de twee achterranden (N langs y0, W langs x0, hoogte
  WALL_H, LED-rand in afdelingskleur) met in het midden een doorgang; de achterstrook is WALL (1,5 cel) breed en
  de oude props-strook rechts (PROP_LANE) is weg. Tegen de wanden staan meubels en planten (furnish(): boekenkast,
  locker, dressoir met printer/vaas/mappen, koffiebar, waterkoeler, staande lamp, sanseveria, palm in rotan mand,
  bolplant, cactus + de sprites plant/archiefkast/serverrek/whiteboard, gespiegeld per wand); aan de wanden hangt
  decoratie (dashboardscherm, prints, rotan wandbord, prikbord, klok, wandplank). Het vergrootglas (prop-lens) was
  alleen decoratie en is weg. Keuze vast per afdeling (seed = naam); thema per afdeling via furnPool().
  Meubels dragen data-k (x + y) net als de bureaus; de loper voegt zich daartussen. Looplijn achter = WALK_BACK,
  sub-platforms aan N/W alleen recht voor de doorgang.
  Motion (14-10): volgcamera. Gaat een agent aan het werk (nieuw 'working' of een nieuwe, niet-lege run sinds
  de vorige verversing), dan zoomt de camera 10 s in op zijn afdeling en daarna weer uit; meerdere afdelingen
  één voor één (queueAutoCam / acNext). Wacht 30 s na eigen slepen/zoomen/klikken en doet niets met een
  selectie open. Knop 'Motion' rechtsonder (aan/uit, toont tijdens het inzoomen de afdeling + 10 s-balkje);
  keuze in localStorage 'dewi.office2.motion', standaard uit bij reduced motion.
  Motion v2 (14-10): knop rechtsboven in de kop; tijdens het inzoomen een LIVE-banner linksboven in de vloer
  (afdeling, agent, 'gaat aan het werk' / 'heeft net gedraaid', wat hij doet = begin van last_summary, +N als er
  meer agents van die afdeling bij komen, voortgangsbalk van AUTO_HOLD). Klik op de banner = agent openen.
  Zwevend paneel (14-10): het rechterpaneel ligt als kaart over de vloer (absolute, 12 px marge, radius 16,
  glas met blur); de vloer loopt eronder door. sceneInset()/visW() = het zichtbare deel links van het paneel:
  layout(), boxFor() (fit + inzoomen) en de zoomknoppen rekenen daarmee. Tekstgrootte (--pz) staat nu op
  .panel > * zodat de kaart zelf niet meeschaalt. Onder 880 px gewoon onder de vloer zoals voorheen.
  Brein-waakhond (15-10): de video bleef stilstaan als de browser hem ooit pauzeerde (play() ging maar één keer).
  kickBrain() + interval van 4 s: loopt currentTime niet op, dan opnieuw play(); twee keer vast = bron opnieuw
  laden. Ook bij terugkeer naar tab/venster, pause/stalled/error-events en de eerste klik. Niet bij reduced motion.
  Overleghoek (15-10): roept één hoofdagent binnen MEET_WINDOW (10 min) DRIE of meer verschillende
  sub-workflows aan (MEET_MIN; nu Reels Builder en Story Builder: Schrijf Copy + Fidelity Guard + Propose,
  en via Propose ook Notify), dan krijgt hij geen losse extra werkplekken maar één gedeelde koffiehoek
  (groter platform met statafel en koffiekopjes, label ☕ OVERLEG) bij zijn afdeling. De hoofdagent staat
  op en loopt erheen; de sub-agents (geen bureau) verschijnen aan de overkant van de hoek en lopen naar
  de tafel, in hun eigen afdelingskleur. Ze staan om de tafel en praten om de beurt (ballon = begin van
  hun laatste samenvatting); helpers die AI gebruiken sturen een powerbal. Daarna lopen de helpers weg,
  de hoofdagent terug naar zijn stoel en de hoek vervaagt. Aanroepen die binnenkomen terwijl de hoek
  bezig is schuiven aan (max. 5 helpers). Per hoofdagent hooguit één overleg per venster (S.metAt);
  telt een groep nog geen 3, dan gewoon de losse extra werkplek. Elke afdeling/aanroeper eigen hoek.
  Achtergrondfoto (15-10) is op 16-10 weer verwijderd (te druk): vloer, vloertextuur en raster zijn terug.
  Sfeer (17-10), bewust ingetogen:
  - Dag/nacht: lichtstand volgt de zonnehoogte in Madrid (sunElev). 's Nachts een donkere laag over de vloer
    (#nightLayer) met daarboven gloed (#glowLayer) van staande lampen, bureaulampjes en schermen; rond zons-
    op/-ondergang een warme tint. Agents zonder run in de laatste 45 min zijn 's nachts naar huis (leeg bureau,
    class .away); wie werkt of een fout heeft blijft. Kop: zonnetje/maan + Madrid-tijd (#skyc).
  - Bali-aankleding: frangipani (kamboja) en monstera tussen de planten. Elk bureau heeft een plantje dat
    meegroeit met runs_7d (dewi_runs_stats_7d); slap en geel bij een fout, droog zonder runs. 7 dagen 100%
    geslaagd (min. 5 runs) = canang sari met wierookje op het bureau. Fout = rookwolkje boven het scherm.
  - Weer = Oordeel van de dag (dewi_office_reviews, alleen met ingelogde sessie via supabase-js; RLS):
    groen zonlicht door bladeren (nacht: vuurvliegjes), oranje drijvende wolkschaduwen, rood regen op het glas
    (canvas #fxSky). Krijtbord bij het brein met score; klik = kpi.html#review.
  - Gong: nieuwe online order (bridge_open_orders, source_name = 'web', gevuld door Open Orders Sync, elk uur)
    = toast + confetti uit het brein (+ gong als geluid aan staat). Gezien-lijst in localStorage.
  - Wall of fame: lijstjes aan de wanden tonen de best bereikte posts (v_dewi_feed, 60 dgn, op reach).
  - Klusjesman: staat een agent op fout, dan loopt Self-Heal (overdag) via de vloer om het brein naar dat
    bureau, kijkt even met zijn gereedschapskist en loopt terug. Per agent hooguit eens per 20 min.
  - Replay 24u (knop in de kop): speelt dewi_runs_public van de afgelopen 24 uur versneld af; elke run licht
    op (ring, powerbal bij AI), de zon gaat onder en op, wie niet draait gaat naar huis. Schuifbalk met
    runs-histogram (nacht donker, fouten rood), snelheid 1/2/4x, LIVE = terug.
  - Geluid (knop, standaard uit, localStorage 'dewi.office2.sound'): WebAudio-gamelan (pelog), zachte regen
    bij rood weer, gong bij een order. Geen audiobestanden.
  Reduced motion: geen animaties, wel de stilstaande lichtstand en aankleding.
  Muren op volle hoogte (17-10): WALL_H 112. Achtermuren (N/W) met losse ramen in wisselende maten (windowsOn: 0-2 per
  wandstuk, smal+hoog of breed+laag; ruiten tonen de lucht via #gSky / --skyT/--skyB) en een dichte dubbele deur in de
  doorgang (backDoor); lijsten en wall of fame hangen hoger en groter. Voorkant (S/E) = glazen pui (frontGlass, .fglass,
  ná de bureaus getekend). Extra werkplekken en de overleghoek alleen vóór de afdeling (subSpot: S/E, 5 plekken x 2
  afstanden, nooit op het scherm achter een andere afdeling). Bij de loopbrug tijdelijk een glazen deur (makeDoor);
  walkDoors: tot de deur, open, erdoor, dicht — terug net zo.
  Oordeel van de dag (17-10): breed schoolbord aan de N-muur van MARKETING (chalkBoardWall + chalkWallFill; grote
  dagscore), niets ervoor geplaatst; klik = kpi.html#review. De gong (object) is weer weg; het gong-geluid bij een
  online order blijft (alleen met ♪ aan).
  Looproute tussen afdelingen (Self-Heal, 17-10): eigen deur -> buitenom naar de eigen pipe (perimeter) -> over de pipe
  naar het brein -> om het brein -> over de pipe van de doelafdeling -> vlak ervoor buitenom naar de pui -> deur. Buiten
  de afdelingen bepaalt placeAny de diepte (achter een afdeling/het brein = in de tekenvolgorde ervóór).
  Looprichtingen: walker-v4 heeft alleen de twee iso-diagonalen; walkRow kiest bij WALK8 (walker-v5, 5 rijen) ook opzij,
  recht naar voren en recht weg. Zet WALK8 = "walker-v5" zodra die bestanden er staan.
-->
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Office v2 · DEWI</title>
<script src="dewi-config.js"></script>
<script src="dewi-frame.js"></script><!-- uniforme paneel-toggle + menu -->
<!-- 17-10: alleen voor de ingelogde extra's (oordeel/weer, online-ordergong); zelfde client als kpi.html -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#06090f; --ground:#080c14; --slab:#101826; --line:#1c2636; --panel:#0b1019; --panel2:#0f1623;
    --text:#cfe2ec; --dim:#7590a3; --cyan:#00d4ff; --green:#3ee08f; --amber:#ffb547; --red:#ff5d5d;
    --grey:#8aa0b5; --violet:#b58cff; --gold:#ffd166;
    --font:'Segoe UI',system-ui,-apple-system,sans-serif;
    --mono:ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);font:13px/1.45 var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit}
  a{color:var(--cyan);text-decoration:none}
  a:hover{text-decoration:underline}
  :focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:4px}
  #app{display:flex;flex-direction:column;height:100%}

  /* kop — zelfde opbouw als organisation.html zodat dewi-frame.js zijn knop voor .spacer zet */
  header{display:flex;align-items:center;gap:16px;padding:11px 20px;flex-wrap:wrap;
    border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(0,212,255,.05),transparent)}
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 9px var(--green);align-self:center}
  .brand .ttl{font-weight:700;letter-spacing:3px;font-size:16px}
  .brand .sub{color:var(--dim);font-size:13px}
  .brand .ver{font:700 9.5px var(--mono);letter-spacing:.14em;color:var(--cyan);border:1px solid rgba(0,212,255,.4);border-radius:4px;padding:1px 5px;align-self:center}
  .spacer{flex:1}
  .metrics{display:flex;gap:18px}
  .metric{text-align:right;line-height:1.1}
  .metric b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
  .metric span{font-size:11px;color:var(--dim)}
  .metric.m-error b{color:var(--red)} .metric.m-silent b{color:var(--amber)} .metric.m-working b{color:var(--cyan)}
  .metric.zero b{color:var(--dim)}
  .upd{color:var(--dim);font-size:11.5px;font-variant-numeric:tabular-nums;min-width:112px;text-align:right}

  main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);position:relative}
  /* 14-10: het paneel zweeft over de vloer (afgeronde hoeken, glas); de vloer loopt eronder door */
  /* Leesbaarheid paneel (13-10): tekstgrootte (--pz, via zoom) en breedte (--pw) instelbaar, onthouden per browser */
  .pz{display:flex;align-items:center;gap:4px}
  .pz .lb{font:700 10px var(--mono);letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-right:4px}
  .pz button{appearance:none;min-width:30px;height:28px;padding:0 7px;border-radius:7px;border:1px solid var(--line);background:rgba(7,11,18,.9);
    color:var(--text);cursor:pointer;font:700 13px var(--mono);line-height:1}
  .pz button:hover{border-color:var(--cyan);color:var(--cyan)}
  .pz button.big{font-size:16px}
  .pz .pv{font:600 11.5px var(--mono);color:var(--dim);min-width:40px;text-align:center;font-variant-numeric:tabular-nums}
  .pgrip{position:absolute;top:22px;bottom:22px;width:10px;right:calc(var(--pw,420px) + 7px);cursor:col-resize;z-index:8;touch-action:none}
  .pgrip::after{content:"";position:absolute;top:50%;left:3px;width:4px;height:44px;margin-top:-22px;border-radius:2px;background:var(--line);transition:background .12s}
  .pgrip:hover::after,.pgrip.drag::after,.pgrip:focus-visible::after{background:var(--cyan)}
  body.pdrag{cursor:col-resize;user-select:none;-webkit-user-select:none}
  .stage{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}

  /* tools-balk ("verbonden met") */
  .tools{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:9px calc(var(--pw,420px) + 30px) 9px 16px;min-height:56px;border-bottom:1px solid var(--line);position:relative}
  .tools .lbl{font:700 10px var(--mono);letter-spacing:.16em;color:var(--dim);margin-right:4px;text-transform:uppercase}
  .tools .note{color:var(--dim);font-size:11.5px;margin-left:6px}
  /* Icoonstrip: alleen het beeldmerk. De naam staat in aria-label en verschijnt bij hover. */
  .tool{position:relative;appearance:none;cursor:pointer;width:38px;height:38px;padding:0;border:0;background:none;flex:none;
    display:inline-flex;align-items:center;justify-content:center}
  .tool .ic{position:relative;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;
    font:800 13px var(--mono);letter-spacing:0;color:var(--tc,#44607A);background:#fff;overflow:hidden;
    box-shadow:0 0 0 1px rgba(0,0,0,.25) inset,0 2px 7px rgba(0,0,0,.5);
    transition:transform .12s,box-shadow .12s,background .12s}
  .tool .ic .lg{width:25px;height:25px;display:block;color:var(--tc,#44607A);overflow:visible}
  .tool i{position:absolute;right:-5px;bottom:-5px;font-style:normal;font:700 9.5px var(--mono);font-variant-numeric:tabular-nums;
    color:var(--text);background:#0a0f18;border:1px solid var(--line);border-radius:7px;padding:0 3.5px;line-height:14px;min-width:14px;text-align:center}
  .tool:hover .ic,.tool:focus-visible .ic,.tool.pre .ic{transform:translateY(-3px);
    box-shadow:0 0 0 2px var(--tc,#44607A),0 0 16px -2px var(--tc,#44607A),0 5px 10px rgba(0,0,0,.55)}
  .tool.has .ic{box-shadow:0 0 0 2px var(--tc,var(--cyan)),0 0 14px -3px var(--tc,var(--cyan)),0 2px 7px rgba(0,0,0,.5)}
  .tool.on .ic{background:var(--tc,var(--cyan));color:#fff;
    box-shadow:0 0 0 1.5px rgba(255,255,255,.85),0 0 20px -2px var(--tc,var(--cyan)),0 2px 8px rgba(0,0,0,.55)}
  .tool.on .ic .lg{color:#fff}
  .tool.on i{color:var(--text);border-color:var(--tc,var(--cyan))}
  .tool::after{content:attr(data-name);position:absolute;top:43px;left:50%;transform:translateX(-50%);z-index:7;
    background:#0b1220;border:1px solid var(--line);border-radius:7px;padding:3px 8px;white-space:nowrap;
    font:600 11px var(--mono);color:var(--text);pointer-events:none;opacity:0;transition:opacity .1s;
    box-shadow:0 6px 16px rgba(0,0,0,.55)}
  .tool:hover::after,.tool:focus-visible::after{opacity:1}
  .tool i{font-style:normal;font-weight:700;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
  .tool:hover,.tool.pre{border-color:var(--cyan)}
  .tool.has{border-color:var(--tc,var(--cyan));color:var(--tc,var(--cyan))}
  .tool.on{background:var(--tc,var(--cyan));border-color:var(--tc,var(--cyan));color:#04101a}
  .tool.on i{color:rgba(0,0,0,.6)}
  .tool.on .ic{background:rgba(0,0,0,.55);color:var(--tc,#fff);box-shadow:none}

  .scene{flex:1;min-height:0;position:relative;overflow:hidden;background:
    radial-gradient(ellipse 70% 60% at 50% 48%,rgba(0,212,255,.06),transparent 70%),var(--ground);touch-action:none}
  #floor{display:block;width:100%;height:100%;font-family:var(--font);cursor:grab;user-select:none;-webkit-user-select:none}
  #floor.drag{cursor:grabbing}
  #wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:hidden}
  #wires path{fill:none;stroke:var(--cyan);stroke-width:1.1;stroke-opacity:.55;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .32s ease-out forwards}
  #wires circle{fill:var(--cyan)}
  @keyframes draw{to{stroke-dashoffset:0}}

  /* camera-knoppen (rechtsonder; linksonder zit de ☰ van dewi-nav) */
  .cam{position:absolute;right:calc(var(--pw,420px) + 26px);bottom:14px;z-index:5;display:flex;flex-direction:column;gap:4px}
  .cam button{appearance:none;width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:rgba(7,11,18,.9);color:var(--text);cursor:pointer;font:700 15px var(--mono);line-height:1}
  .cam button:hover{border-color:var(--cyan);color:var(--cyan)}
  .hint{position:absolute;left:calc((100% - var(--pw,420px) - 24px) / 2);bottom:16px;transform:translateX(-50%);z-index:4;font:11px var(--mono);letter-spacing:.06em;color:var(--dim);
    background:rgba(7,11,18,.75);border:1px solid var(--line);border-radius:999px;padding:4px 11px;pointer-events:none;white-space:nowrap;transition:opacity .4s}
  .hint.off{opacity:0}

  /* vloer */
  .ground{fill:var(--ground)}
  .ground-tex{opacity:.9}
  .grid{stroke:#0e1521;stroke-width:1}
  /* 17-10: kantine */
  .room .ct-floor{fill:color-mix(in srgb,#e0a458 14%,#151b24)}
  .room .ct-tile{stroke:#000;stroke-opacity:.18;stroke-width:.7}
  .neon .neon-bg{fill:#1b140f;stroke:#ffb35c;stroke-width:1.3}
  .neon text{font:800 11px "Segoe UI",system-ui,sans-serif;fill:#ffd9a0;letter-spacing:1.4px;filter:drop-shadow(0 0 3px #ff9a3d)}
  .tc-lbl{font:800 5.4px "Segoe UI",system-ui,sans-serif;fill:#2a2a2a;letter-spacing:.3px}
  .toolcab .tc-in,.toolcab .tc-kit{display:none}
  .toolcab.open .tc-in{display:inline}.toolcab.open .tc-doors{display:none}.toolcab.has .tc-kit{display:inline}
  .walker .w-kit{pointer-events:none}
  .slab-tex{opacity:.85}
  .prop{pointer-events:none}
  /* inrichting (14-10) */
  .walls,.pp{pointer-events:none}
  .pshadow{fill:#000;fill-opacity:.3}
  .wled{fill-opacity:.95}
  .dept{--c:#8aa0b5}
  #floor.intro .dept,#floor.intro .brain{animation:rise .55s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i)*55ms)}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}}
  .slab{cursor:pointer;outline:none;transition:opacity .2s}
  .shadow{fill:#000;fill-opacity:.45}
  .slab-top{fill:var(--slab);stroke:color-mix(in srgb,var(--c) 65%,transparent);stroke-width:1.1;stroke-linejoin:round}
  .slab-glow{fill:color-mix(in srgb,var(--c) 7%,transparent)}
  .slab-l{fill:color-mix(in srgb,var(--c) 34%,#070b12)}
  .slab-r{fill:color-mix(in srgb,var(--c) 18%,#070b12)}
  .slab-lip{fill:none;stroke:color-mix(in srgb,var(--c) 85%,#fff);stroke-width:1.4;stroke-opacity:.55}
  .slab:hover .slab-top,.slab:focus-visible .slab-top,.dept.cur .slab-top{stroke:var(--c);stroke-width:1.8}
  .dept.cur .slab-glow{fill:color-mix(in srgb,var(--c) 16%,transparent)}
  .band{fill:#fff;fill-opacity:.028}
  .lane{font:700 7.6px var(--mono);letter-spacing:.1em;fill:color-mix(in srgb,var(--c) 55%,#b9cbd8)}
  .plate{font:700 10.5px var(--mono);letter-spacing:.08em;fill:color-mix(in srgb,var(--c) 55%,#fff)}

  /* zwevend afdelingskaartje */
  /* Afdelingspaneel: witte kaart boven het platform. Bij hover komt hij op en valt de slagschaduw dieper. */
  .card{cursor:pointer;color:var(--c)}
  .card .stem{stroke:color-mix(in srgb,var(--c) 45%,transparent);stroke-width:1;stroke-dasharray:2 2}
  .card .pin{fill:var(--c)}
  .pcard{transition:transform .16s ease,filter .16s ease}
  .card:hover .pcard,.card:focus-visible .pcard,.dept.cur .card .pcard{transform:translateY(-4px)}
  .card .bg{fill:#111a29;fill-opacity:.94}
  .card .edge{fill:none;stroke:var(--c);stroke-opacity:.5;stroke-width:1.1}
  .card:hover .edge,.dept.cur .card .edge{stroke-opacity:.95;stroke-width:1.5}
  .card .ring{fill:none;stroke:var(--c);stroke-width:0;opacity:0;transition:stroke-width .14s,opacity .14s}
  .card .tt{font:700 9.3px "Segoe UI",system-ui,sans-serif;letter-spacing:.13em;fill:#f2f6fb}
  .card .dot2{fill:var(--c)}
  .card .num{font:300 26px "Segoe UI",system-ui,sans-serif;letter-spacing:-.02em;fill:#fff}
  .card .numl{font:700 7.4px "Segoe UI",system-ui,sans-serif;letter-spacing:.14em;fill:#8d9cb4}
  .card .lb{font:600 7.6px "Segoe UI",system-ui,sans-serif;letter-spacing:.09em;fill:#93a2b8}
  .card .vl{font:700 10.6px "Segoe UI",system-ui,sans-serif;fill:#fff;text-anchor:end;font-variant-numeric:tabular-nums}
  .card .lead{stroke:#46566d;stroke-opacity:.75;stroke-width:1;stroke-dasharray:1 2.6}
  .card .sep{stroke:#fff;stroke-opacity:.14;stroke-width:1}
  .card .fl{font:700 7.3px "Segoe UI",system-ui,sans-serif;letter-spacing:.11em;fill:#8d9cb4}
  .card .fv{font:700 10px "Segoe UI",system-ui,sans-serif;fill:#fff;font-variant-numeric:tabular-nums}
  .card .fv.d{fill:var(--c)}

  /* datapijpen Brain -> afdeling */
  .pipe-base{fill:none;stroke:#0d1522;stroke-width:7;stroke-linecap:round}
  .pipe-edge{fill:none;stroke:color-mix(in srgb,var(--c) 30%,#0d1522);stroke-width:5;stroke-linecap:round}
  .pipe-core{fill:none;stroke:color-mix(in srgb,var(--c) 40%,transparent);stroke-width:1.2}
  .pipe-flow{fill:none;stroke:var(--c);stroke-width:2.6;stroke-linecap:round;stroke-dasharray:3 13;animation:flow var(--t,6s) linear infinite;opacity:.9}
  .pipe-flow.quiet{opacity:.25;animation-duration:calc(var(--t,6s)*3)}
  @keyframes flow{to{stroke-dashoffset:-160}}

  /* sub-workflow-bogen tussen agents */
  .link{fill:none;stroke:var(--violet);stroke-width:1.1;stroke-dasharray:3 4;stroke-opacity:.55;pointer-events:none}
  /* 12-10: koppelingen alleen zichtbaar als ze actief zijn (of bij de gekozen agent) */
  .link.live{stroke-width:1.8;stroke-opacity:.95;stroke-dasharray:5 6;animation:linkflow .9s linear infinite;filter:drop-shadow(0 0 3px var(--violet))}
  @keyframes linkflow{to{stroke-dashoffset:-11}}
  .link-dot{fill:var(--violet);pointer-events:none}
  #linksLayer{pointer-events:none}
  #floor.has-hl .link{stroke-opacity:.12}

  /* Brain */
  .brain .core-glow{fill:url(#gBrainGlow)}
  .brain .halo{fill:url(#gBrainGlow);animation:breathe 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes breathe{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.1)}}
  .brain .bt{font:700 11px var(--mono);letter-spacing:.26em;fill:var(--cyan);text-anchor:middle}
  .brain .bs{font:8.5px var(--mono);letter-spacing:.08em;fill:var(--dim);text-anchor:middle}
  .brain .live-anchor{fill:transparent;cursor:pointer}
  .brain .beam{fill:url(#gBeam);mix-blend-mode:screen;pointer-events:none;animation:beam 3.6s ease-in-out infinite}
  @keyframes beam{0%,100%{opacity:.55}50%{opacity:.95}}
  /* levend brein: video over de SVG, zwart valt weg door screen; positie/schaal zet placeBrainLive() */
  .brain-live{position:absolute;left:0;top:0;width:600px;height:540px;z-index:1;pointer-events:none;
    mix-blend-mode:screen;transform-origin:0 0;will-change:transform;opacity:0;transition:opacity .8s ease;background:#000}
  .brain-live.on{opacity:1}
  /* powerballen afdeling -> brein */
  #ballLayer{pointer-events:none}
  #ballLayer .pb-glow{fill:var(--c);opacity:.55;filter:url(#fSoft)}
  #ballLayer .pb-core{fill:color-mix(in srgb,var(--c) 35%,#fff)}
  #ballLayer .pb-trail{fill:var(--c);opacity:.35}
  #ballLayer .pb-hit{fill:none;stroke:var(--c);stroke-width:2}
  /* tijdelijke sub-afdeling + lopende kopie-agent */
  .subdept{transition:opacity .7s ease;opacity:0;cursor:pointer}
  .subdept.on{opacity:1}
  .subdept .bridge{fill:color-mix(in srgb,var(--c) 22%,#101826);stroke:color-mix(in srgb,var(--c) 55%,transparent);stroke-width:.8}
  .subdept .sub-l{fill:color-mix(in srgb,var(--c) 14%,#0b111c)}
  .subdept .sub-r{fill:color-mix(in srgb,var(--c) 9%,#080d16)}
  .subdept .sub-top{fill:color-mix(in srgb,var(--c) 12%,#121b2a);stroke:var(--c);stroke-width:1.1;stroke-opacity:.8}
  .subdept .sub-name{font:700 7.5px var(--mono);letter-spacing:.1em;fill:var(--c);text-anchor:middle}
  .subdept .sd-img{transition:opacity .25s,filter .25s}
  .subdept .sd-img.vacant{opacity:.9}
  .subdept.meet .mt-rug{fill:color-mix(in srgb,var(--c) 18%,transparent);stroke:color-mix(in srgb,var(--c) 45%,transparent);stroke-width:.6}
  .subdept.meet .mt-sh{fill:#000;opacity:.35}
  .subdept.meet .mt-leg{fill:#3a4452}
  .subdept.meet .mt-edge{fill:#5b4433}
  .subdept.meet .mt-top{fill:#8a6a4c;stroke:color-mix(in srgb,var(--c) 50%,#c9a27a);stroke-width:.5}
  .subdept.meet.busy .mt-rug{stroke:var(--c);stroke-opacity:.9}
  .walker.ghost{opacity:0;transition:opacity .6s ease}
  .walker.ghost.in{opacity:1}
  .subdept .sd-screen{fill:var(--c);opacity:0;mix-blend-mode:screen;transition:opacity .3s}
  .subdept.busy .sd-screen{animation:pulse 1.2s ease-in-out infinite}
  /* tekstballonnen boven werkende agents */
  #bubbleLayer{pointer-events:none}
  .bub .b-k{transform:scale(var(--bk,1));transform-origin:0 0;transform-box:view-box}
  .bub .b-pop{animation:bubIn .35s cubic-bezier(.2,.8,.2,1.2) both}
  .bub .b-in{animation:bubFloat 3.2s ease-in-out infinite}
  .bub rect,.bub path{fill:#f4fbff;stroke:var(--c,#00d4ff);stroke-width:1.5}
  .bub text{font:600 12px var(--font);fill:#0b1220}
  .bub .dots circle{fill:var(--c,#00d4ff);animation:dot 1.2s ease-in-out infinite}
  .bub .dots circle:nth-child(2){animation-delay:.2s} .bub .dots circle:nth-child(3){animation-delay:.4s}
  @keyframes bubIn{from{opacity:0;transform:translateY(6px) scale(.6)}to{opacity:1;transform:none}}
  @keyframes bubFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
  @keyframes dot{0%,100%{opacity:.25}50%{opacity:1}}
  .walker{pointer-events:none}
  .walker .w-sh{fill:#000;opacity:.45}
  .walker .w-body{fill:color-mix(in srgb,var(--c) 45%,#e8fbff);opacity:.92}
  .walker .w-glow{fill:var(--c);opacity:.45;filter:url(#fSoft)}
  .walker .w-leg{stroke:color-mix(in srgb,var(--c) 45%,#e8fbff);stroke-width:2.6;stroke-linecap:round;opacity:.92}
  .walker .w-legs line:first-child{animation:legA .32s ease-in-out infinite alternate;transform-box:view-box}
  .walker .w-legs line:last-child{animation:legA .32s ease-in-out infinite alternate-reverse;transform-box:view-box}
  @keyframes legA{from{transform:translateX(-2.2px)}to{transform:translateX(2.2px)}}
  .walker .w-up{animation:bob .16s ease-in-out infinite alternate}
  @keyframes bob{from{transform:translateY(0)}to{transform:translateY(-1.6px)}}

  /* agents: gerenderd bureau + monitor + stoel (sprite), scherm ingekleurd naar status */
  .ag{cursor:pointer;outline:none;transition:opacity .2s;--s:var(--green)}
  .ag .hit{fill:transparent}
  .ag .sprite{image-rendering:auto}
  .ag .m-screen{fill:var(--s);opacity:.62;mix-blend-mode:screen}
  .ag .m-glow{fill:var(--s);opacity:.3;filter:url(#fSoft);mix-blend-mode:screen;pointer-events:none}
  .ag .loop{fill:var(--violet)}
  .ag .m-code{pointer-events:none}
  .ag .m-code rect{fill:#04222e;opacity:.78}
  .ag .m-code rect.hi{fill:#d8fbff;opacity:.9}
  .ag .m-code rect.bbx{fill:none}
  .ag.s-working .m-screen{opacity:.5}
  .ag .m-code .roll{animation:codeRoll 5s linear infinite}
  @keyframes codeRoll{from{transform:translateY(0)}to{transform:translateY(-1px)}}
  .ag .pin .plate{fill:#0c1320;stroke:var(--s);stroke-width:1;filter:url(#fPinSh)}
  .ag .pin .stem{stroke:var(--s);stroke-width:1;opacity:.55}
  .ag .pin .pg{font-weight:800;font-size:8px;fill:var(--s)}
  .ag .selring{fill:none;stroke:#fff;stroke-width:1.4;stroke-dasharray:3 2;display:none}
  .ag.s-working{--s:var(--cyan)} .ag.s-ok{--s:var(--green)} .ag.s-error{--s:var(--red)} .ag.s-silent{--s:var(--amber)}
  .ag.s-paused{--s:var(--grey)} .ag.s-idle{--s:#3a4a5c}
  .ag.s-ok .m-screen{opacity:.26} .ag.s-ok .m-glow{opacity:.07}
  .ag.s-idle .m-screen{opacity:.2} .ag.s-idle .m-glow,.ag.s-paused .m-glow{display:none}
  .ag.s-paused .m-screen{opacity:.28}
  .ag.s-silent .m-screen{animation:dimflick 2.6s steps(2,jump-none) infinite}
  @keyframes dimflick{from{opacity:.62}to{opacity:.3}}
  .ag.s-working .m-glow{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.2}50%{opacity:.6}}
  .ag.s-error .m-screen{animation:blink 1.1s steps(2,jump-none) infinite}
  @keyframes blink{from{opacity:.75}to{opacity:.28}}
  .ag.s-paused .sprite,.ag.s-idle .sprite{filter:grayscale(.55) brightness(.8)}
  .ag:hover .m-screen,.ag:focus-visible .m-screen{opacity:1}
  .ag:focus-visible .hit{stroke:#fff;stroke-width:1;stroke-dasharray:2 2}
  .ag.sel .selring{display:block}
  #floor.has-hl .ag:not(.hl){opacity:.14}
  #floor.has-hl .dept:not(.hl-d) .slab,#floor.has-hl .dept:not(.hl-d) .card,#floor.has-hl .dept:not(.hl-d) .pipe,#floor.has-hl .dept:not(.hl-d) .walls,#floor.has-hl .dept:not(.hl-d) .fglass,#floor.has-hl .dept:not(.hl-d) .pp{opacity:.35}

  #tip{position:absolute;z-index:5;pointer-events:none;display:none;transform:translate(-50%,-100%);white-space:nowrap;
    background:#0b1220;border:1px solid var(--line);border-radius:9px;padding:7px 12px;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.5)}
  #tip b{display:block;font-weight:700}
  #tip span{color:var(--dim);font-size:13px;font-family:var(--mono)}
  #msg{position:absolute;left:16px;right:calc(var(--pw,420px) + 28px);bottom:16px;z-index:6;display:none;background:#2a1216;border:1px solid var(--red);
    color:#ffd9d9;border-radius:10px;padding:9px 12px;font-size:12.5px}
  /* Motion-knop in de kop (14-10) */
  .motion{appearance:none;height:28px;display:flex;align-items:center;gap:7px;padding:0 12px;border-radius:999px;cursor:pointer;
    border:1px solid rgba(0,212,255,.35);background:rgba(7,11,18,.9);color:var(--text);font:700 10.5px var(--mono);letter-spacing:.16em;text-transform:uppercase}
  .motion:hover{border-color:var(--cyan)}
  .motion .md{width:8px;height:8px;border-radius:50%;background:var(--grey);flex:none}
  .motion[aria-pressed="true"] .md{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
  .motion[aria-pressed="false"]{color:var(--dim);border-color:var(--line)}
  .motion.live{border-color:var(--mc,var(--cyan))}
  .motion.live .md{background:var(--mc,var(--cyan));box-shadow:0 0 9px var(--mc,var(--cyan));animation:pulse 1.2s ease-in-out infinite}
  /* LIVE-banner linksboven tijdens het inzoomen: afdeling, agent, wat hij doet, voortgang van de 10 s */
  .acbar{position:absolute;left:12px;top:12px;z-index:5;max-width:min(580px,calc(100% - 24px));cursor:pointer;
    background:rgba(7,11,18,.92);border:1px solid var(--mc,var(--cyan));border-radius:12px;padding:7px 13px 9px;overflow:hidden;
    box-shadow:0 0 18px -6px var(--mc,var(--cyan)),0 6px 18px rgba(0,0,0,.5);opacity:0;transform:translateY(-6px);pointer-events:none;
    transition:opacity .25s,transform .25s}
  .acbar.on{opacity:1;transform:none;pointer-events:auto}
  .acbar .l1{display:flex;align-items:baseline;gap:8px;white-space:nowrap;min-width:0}
  .acbar .lv{font:700 10px var(--mono);letter-spacing:.18em;color:var(--mc,var(--cyan));display:inline-flex;align-items:center;gap:6px;align-self:center}
  .acbar .lv i{width:7px;height:7px;border-radius:50%;background:var(--mc,var(--cyan));box-shadow:0 0 8px var(--mc,var(--cyan));animation:pulse 1.2s ease-in-out infinite}
  .acbar .dp{font:700 10px var(--mono);letter-spacing:.14em;color:color-mix(in srgb,var(--mc,var(--cyan)) 60%,#fff);text-transform:uppercase}
  .acbar .dp::before{content:"· ";color:var(--dim)}
  .acbar b{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .acbar .vb{color:var(--dim);font-size:12.5px}
  .acbar .more{font:700 10px var(--mono);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:0 6px}
  .acbar .l2{margin-top:3px;font:12px/1.35 var(--mono);color:#b9cbd8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .acbar .l2::before{content:"> ";color:var(--mc,var(--cyan))}
  .acbar .pr{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.06)}
  .acbar .pr i{display:block;height:100%;width:0;background:var(--mc,var(--cyan));box-shadow:0 0 8px var(--mc,var(--cyan));animation:mtime var(--hold,10s) linear forwards}
  @keyframes mtime{to{width:100%}}
  @media (max-width:880px){ .acbar{left:8px;top:8px;max-width:calc(100% - 16px)} .motion{padding:0 9px} }
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);font-family:var(--mono);letter-spacing:.08em}

  /* paneel — terminal-stijl */
  .panel{--dim:#93abbd;position:absolute;top:12px;right:12px;bottom:12px;width:var(--pw,420px);z-index:6;
    background:rgba(11,16,25,.84);-webkit-backdrop-filter:blur(10px) saturate(1.15);backdrop-filter:blur(10px) saturate(1.15);
    border:1px solid rgba(160,190,220,.14);border-radius:16px;
    box-shadow:0 18px 50px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.05);
    overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#24324a transparent;
    padding:16px 18px 28px;min-height:0;font-family:var(--mono);font-size:13px}
  .panel > *{zoom:var(--pz,1.15)}   /* tekstgrootte op de inhoud, niet op de zwevende kaart zelf */
  .panel::-webkit-scrollbar{width:8px}
  .panel::-webkit-scrollbar-thumb{background:#24324a;border-radius:8px;border:2px solid transparent;background-clip:padding-box}
  .panel::-webkit-scrollbar-track{background:transparent;margin:14px 0}
  .panel h2{margin:0 0 2px;font:700 16px/1.25 var(--font)}
  .panel h3{margin:20px 0 7px;font:700 10px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:8px}
  .panel h3::before{content:"//";color:var(--cyan);opacity:.7}
  .panel h3 .n{margin-left:auto;color:var(--green);letter-spacing:.04em}
  .panel p{margin:6px 0}
  .back{appearance:none;border:0;background:none;padding:0;margin:0 0 12px;color:var(--cyan);cursor:pointer;font:12px var(--mono)}
  .back:hover{text-decoration:underline}
  .chip{display:inline-flex;align-items:center;gap:6px;font:600 11px var(--mono);letter-spacing:.06em;color:color-mix(in srgb,var(--c) 60%,#fff);margin-bottom:6px;text-transform:uppercase}
  button.chip{appearance:none;border:0;background:none;padding:0;cursor:pointer}
  button.chip:hover{text-decoration:underline}

      var kx = w._sx + 11, ky = w._sy - 1, nm = String(tg.agent_name || "");
      work.innerHTML = '<rect x="' + f1(kx - 4.5) + '" y="' + f1(ky - 5.5) + '" width="9" height="5.5" rx="1" fill="#d94b3d"/>'
        + '<rect x="' + f1(kx - 4.5) + '" y="' + f1(ky - 5.5) + '" width="9" height="1.4" fill="#f07a62"/>'
        + '<path d="M' + f1(kx - 2) + "," + f1(ky - 5.5) + " v-2 h4 v2" + '" fill="none" stroke="#5b2620" stroke-width=".9"/>'
        + '<g class="sparks"><line x1="' + f1(mx - 4) + '" y1="' + f1(my - 6) + '" x2="' + f1(mx - 7) + '" y2="' + f1(my - 10) + '"/><line x1="' + f1(mx + 3) + '" y1="' + f1(my - 7) + '" x2="' + f1(mx + 6) + '" y2="' + f1(my - 11) + '"/><line x1="' + f1(mx) + '" y1="' + f1(my - 8) + '" x2="' + f1(mx) + '" y2="' + f1(my - 13) + '"/></g>'
        + bubbleSvg(w._sx + 6, w._sy - WALK_H * 0.9, "🔧 even kijken bij " + (nm.length > 20 ? nm.slice(0, 19) + "…" : nm), dA.color);
      subLayer().appendChild(work);
      return sleep(7500).then(function () { if (work) { work.remove(); work = null; } carryKit(w, HEAL.kit); if (HEAL.kit) HEAL.uses++; });
    }
    var done = false;
    function cleanup() {
      if (done) return; done = true;
      w.remove(); if (work) work.remove(); if (bub) bub.remove(); doors.forEach(function (x) { if (x) x.remove(); });
      if (S.pose[me.agent_id]) setOwnPose(me, null);
      HEAL.lastAt = Date.now();
      renderBubbles(); HEAL.busy = false; q.busy = false;
      setTimeout(function () { if (!q.busy) nextTrip(me.agent_id); }, 600);
    }
    /* de reis in stukken: [route, actie na aankomst] */
    var legs = [];
    if (tg) {
      if (fetch) legs.push([routeDeskToRoom(me, dA, C, cab.spot), function () { return atCab(true); }], [routeDeskToRoom(tg, dB, C, cab.spot).slice(1).reverse(), doWork]);
      else legs.push([healRoute(me, dA, tg, dB), doWork]);
      if (giveBack) legs.push([routeDeskToRoom(tg, dB, C, cab.spot).slice(1), function () { return atCab(false); }], [routeDeskToRoom(me, dA, C, cab.spot).reverse(), null]);
      else legs.push([healRoute(me, dA, tg, dB).reverse(), null]);
    } else legs.push([routeDeskToRoom(me, dA, C, cab.spot), function () { return atCab(false); }], [routeDeskToRoom(me, dA, C, cab.spot).reverse(), null]);
    carryKit(w, HEAL.kit);
    var chain = playStand(function (f) { setOwnPose(me, "stand", f); }, false).then(function () {
      if (!alive()) return;
      setOwnPose(me, "empty"); renderBubbles();
    });
    legs.forEach(function (lg) { chain = chain.then(function () { return go(lg[0]); }).then(function () { return alive() && lg[1] ? lg[1]() : null; }); });
    chain.then(function () {
      w.remove();
      if (!alive()) return;
      return playStand(function (f) { setOwnPose(me, "stand", f); }, true);
    }).then(cleanup, cleanup);
  }

  /* ---- replay: de afgelopen 24 uur versneld -------------------------------------------------------- */
  var RP_SPEEDS = [720, 1440, 2880], elRp = $("rpbar"), elRpBtn = $("replayBtn");
  function rpUi() {
    elRpBtn.setAttribute("aria-pressed", RP.on ? "true" : "false");
    elRpBtn.style.setProperty("--mc", RP.on ? "var(--gold)" : "");
    elRpBtn.classList.toggle("live", RP.on);
    elRp.classList.toggle("on", RP.on);
    elScene.classList.toggle("replay", RP.on);
    if (!RP.on) return;
    $("rpPlay").textContent = RP.playing ? "❚❚" : "▶";
    $("rpSpeed").textContent = (RP.speed / 1440) + "×";
    rpLabels();
  }
  function rpLabels() {
    if (RP.loading) { $("rpTime").textContent = "laden…"; $("rpCount").textContent = ""; return; }
    $("rpTime").textContent = fmtDHM.format(new Date(RP.t));
    $("rpCount").textContent = RP.n + " runs" + (RP.err ? " · " + RP.err + " fout" : "");
    var sl = $("rpSlider"); if (document.activeElement !== sl) sl.value = String(Math.round((RP.t - RP.t0) / (RP.t1 - RP.t0) * 1000));
  }
  function rpHist() {
    var bins = [], errs = [], i, mx = 1, h = "", span = RP.t1 - RP.t0;
    for (i = 0; i < 96; i++) { bins.push(0); errs.push(0); }
    RP.runs.forEach(function (r) { var b = Math.min(95, Math.max(0, Math.floor((r.t - RP.t0) / span * 96))); bins[b]++; if (!r.ok) errs[b]++; });
    bins.forEach(function (v) { mx = Math.max(mx, v); });
    for (i = 0; i < 96; i++) {
      var el = sunElev(RP.t0 + (i + 0.5) / 96 * span), dk = 1 - smooth(-7, 5, el);
      if (dk < 0.95) h += '<rect x="' + i + '" y="0" width="1.02" height="16" fill="#8fc7ff" fill-opacity="' + ((1 - dk) * 0.13).toFixed(3) + '"/>';   /* daglicht licht, nacht donker */
      var bh = bins[i] ? 2 + 13 * bins[i] / mx : 0;
      if (bh) h += '<rect x="' + (i + 0.15) + '" y="' + (16 - bh).toFixed(1) + '" width=".7" height="' + bh.toFixed(1) + '" fill="' + (errs[i] ? "#ff5d5d" : "#ffd166") + '" fill-opacity=".85"/>';
    }
    $("rpHist").innerHTML = h;
  }
  function rpOpen() {
    if (RP.on) return rpClose();
    RP.on = true; RP.loading = true; RP.playing = false; acStop(true); rpUi();
    var t1 = Date.now(), t0 = t1 - 24 * 3600e3;
    rest("dewi_runs_public?select=workflow,run_at,status&run_at=gte." + encodeURIComponent(new Date(t0).toISOString()) + "&order=run_at.asc&limit=5000").then(function (rows) {
      if (!RP.on) return;
      RP.runs = (rows || []).map(function (r) { return { wf: r.workflow, t: ms(r.run_at), ok: r.status === "ok" }; })
        .filter(function (r) { return r.t >= t0; });
      RP.orders = (ORD.rows || []).map(function (o) { return { o: o, t: ms(o.order_created_at) }; }).filter(function (x) { return x.t >= t0; }).sort(function (p, q) { return p.t - q.t; });
      RP.t0 = t0; RP.t1 = t1; RP.t = t0; RP.i = 0; RP.oi = 0; RP.last = {}; RP.n = 0; RP.err = 0;
      RP.loading = false; RP.playing = true; RP.prev = performance.now(); RP.tick = 0;
      rpHist(); fxTick(true); rpUi();
      if (!RP.raf) RP.raf = requestAnimationFrame(rpLoop);
    }, function (e) {
      RP.on = false; RP.loading = false; rpUi();
      showMsg("Replay kon de runs niet laden (" + ((e && e.message) || e) + ")."); setTimeout(function () { showMsg(""); }, 6000);
    });
  }
  function rpClose() {
    RP.on = false; RP.playing = false; RP.loading = false;
    if (RP.raf) cancelAnimationFrame(RP.raf); RP.raf = 0;
    rpUi(); FX.glowSig = ""; fxTick(true); patchAgents(); renderBubbles();
  }
  function rpSeek(t) {                              /* springen: geen effecten, wel wie er recent draaide */
    RP.t = Math.max(RP.t0, Math.min(RP.t1, t)); RP.last = {}; RP.n = 0; RP.err = 0; RP.i = 0;
    while (RP.i < RP.runs.length && RP.runs[RP.i].t <= RP.t) { var r = RP.runs[RP.i++]; RP.last[r.wf] = r.t; RP.n++; if (!r.ok) RP.err++; }
    RP.oi = 0; while (RP.oi < RP.orders.length && RP.orders[RP.oi].t <= RP.t) RP.oi++;
    fxTick(true); rpLabels();
  }
  function rpLoop(now) {
    RP.raf = 0; if (!RP.on) return;
    var dt = Math.min(250, now - (RP.prev || now)); RP.prev = now;
    if (RP.playing && !document.hidden) {
      RP.t = Math.min(RP.t1, RP.t + dt * RP.speed);
      var fired = 0;
      while (RP.i < RP.runs.length && RP.runs[RP.i].t <= RP.t) { rpFire(RP.runs[RP.i++], fired++ < 12); }
      while (RP.oi < RP.orders.length && RP.orders[RP.oi].t <= RP.t) celebrateOrder(RP.orders[RP.oi++].o, 0, true);
      if (RP.t >= RP.t1) { RP.playing = false; rpUi(); setTimeout(function () { if (RP.on && !RP.playing && RP.t >= RP.t1) rpClose(); }, 3500); }
      if (now - RP.tick > 250) { RP.tick = now; fxTick(false); }
      rpLabels();
    }
    RP.raf = requestAnimationFrame(rpLoop);
  }
  function rpFire(r, fx) {
    RP.last[r.wf] = r.t; RP.n++; if (!r.ok) RP.err++;
    var a = S.byWf[r.wf]; if (!a || !fx) return;
    if (a._p) {
      var el = agentEl(a.agent_id);
      if (el) {
        var ring = document.createElementNS(SVG_NS, "ellipse");
        ring.setAttribute("class", "rp-ring"); ring.setAttribute("cx", f1(DESK_W * 0.06)); ring.setAttribute("cy", f1(-DESK_H * 0.07));
        ring.setAttribute("rx", f1(DESK_W * 0.46)); ring.setAttribute("ry", f1(DESK_W * 0.23));
        ring.setAttribute("style", "stroke:" + (r.ok ? colorOf(a) : "#ff5d5d"));
        el.appendChild(ring); setTimeout(function () { ring.remove(); }, 1300);
      }
    }
    if (r.ok && usesBrain(a) && a._p && RP.balls < 5 && !REDUCED) { RP.balls++; fireBall(a.agent_id); setTimeout(function () { RP.balls--; }, 2600); }
  }
  elRpBtn.addEventListener("click", function () { userActed(); rpOpen(); });
  $("rpClose").addEventListener("click", rpClose);
  $("rpPlay").addEventListener("click", function () {
    if (RP.loading) return;
    if (!RP.playing && RP.t >= RP.t1) rpSeek(RP.t0);
    RP.playing = !RP.playing; RP.prev = performance.now(); rpUi();
  });
  $("rpSpeed").addEventListener("click", function () { RP.speed = RP_SPEEDS[(RP_SPEEDS.indexOf(RP.speed) + 1) % RP_SPEEDS.length]; rpUi(); });
  $("rpSlider").addEventListener("input", function (e) { if (!RP.loading && RP.t1) rpSeek(RP.t0 + Number(e.target.value) / 1000 * (RP.t1 - RP.t0)); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && RP.on && !S.focus) rpClose(); });

  /* ---- geluid: gamelan-sfeer, regen, gong (WebAudio, geen bestanden) ------------------------------ */
  var SND = { on: false, want: false, ctx: null, out: null, t: null, rain: null };
  try { SND.want = localStorage.getItem("dewi.office2.sound") === "1"; } catch (e) {}
  var PELOG = [293.7, 318.5, 345.2, 403.3, 440.0, 587.3, 637.0];
  var elSnd = $("soundBtn");
  function sndCtx() {
    if (SND.ctx) return SND.ctx;
    var Ctor = window.AudioContext || window.webkitAudioContext; if (!Ctor) return null;
    var c = SND.ctx = new Ctor(), lp = c.createBiquadFilter();
    SND.out = c.createGain(); SND.out.gain.value = 0.9; lp.type = "lowpass"; lp.frequency.value = 5200;
    SND.out.connect(lp); lp.connect(c.destination);
    return c;
  }
  function bell(f, when, vol, dur) {
    var c = SND.ctx; if (!c) return;
    [[1, 1], [2.76, 0.28], [5.4, 0.07]].forEach(function (p) {
      var o = c.createOscillator(), g = c.createGain(), d = dur / (p[0] > 1 ? 2.4 : 1);
      o.type = "sine"; o.frequency.value = f * p[0];
      g.gain.setValueAtTime(0.0001, when); g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol * p[1]), when + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, when + d);
      o.connect(g); g.connect(SND.out); o.start(when); o.stop(when + d + 0.05);
    });
  }
  function gong(when, vol) {
    var c = SND.ctx; if (!c) return;
    [[65.4, 1, 7], [66.6, 0.8, 7], [130.8, 0.32, 4.5], [197.2, 0.16, 3], [262.4, 0.07, 2]].forEach(function (p) {
      var o = c.createOscillator(), g = c.createGain();
      o.type = "sine"; o.frequency.value = p[0];
      g.gain.setValueAtTime(0.0001, when); g.gain.exponentialRampToValueAtTime(vol * p[1], when + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, when + p[2]);
      o.connect(g); g.connect(SND.out); o.start(when); o.stop(when + p[2] + 0.05);
    });
  }
  function ambientTick() {
    SND.t = null; if (!SND.on) return;
    if (!document.hidden && SND.ctx && SND.ctx.state === "running") {
      var now = SND.ctx.currentTime + 0.05, v = 0.03 * (1 - FX.dark * 0.45);
      if (Math.random() < 0.1) gong(now, 0.045);
      else {
        var n = 1 + ((Math.random() * 3) | 0), b = (Math.random() * 4) | 0;
        for (var i = 0; i < n; i++) bell(PELOG[(b + i * (1 + ((Math.random() * 2) | 0))) % PELOG.length], now + i * 0.34, v * (1 - i * 0.15), 2.3);
      }
    }
    SND.t = setTimeout(ambientTick, (3600 + Math.random() * 4800) * (1 + FX.dark * 0.6));
  }
  function sndRain() {
    var c = SND.ctx, on = SND.on && wxKind() === "rain"; if (!c) return;
    if (on && !SND.rain) {
      var len = c.sampleRate * 3, b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0), last = 0;
      for (var i = 0; i < len; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.2; }
      var s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
      s.buffer = b; s.loop = true; f.type = "lowpass"; f.frequency.value = 1100;
      g.gain.setValueAtTime(0.0001, c.currentTime); g.gain.linearRampToValueAtTime(0.045, c.currentTime + 2);
      s.connect(f); f.connect(g); g.connect(SND.out); s.start();
      SND.rain = { s: s, g: g };
    } else if (!on && SND.rain) {
      var r = SND.rain; SND.rain = null;
      r.g.gain.linearRampToValueAtTime(0.0001, c.currentTime + 1.4);
      setTimeout(function () { try { r.s.stop(); } catch (e) {} }, 1600);
    }
  }
  function sndOrder() {
    if (!SND.on || !SND.ctx) return;
    var now = SND.ctx.currentTime + 0.05; gong(now, 0.16);
    [3, 4, 5].forEach(function (k, i) { bell(PELOG[k], now + 0.7 + i * 0.22, 0.05, 2); });
  }
  function soundSet(v, save) {
    SND.want = v;
    if (v) {
      var c = sndCtx();
      if (c) {
        SND.on = true;
        if (c.state !== "running") c.resume();
        if (!SND.t) SND.t = setTimeout(ambientTick, 900);
        sndRain(); bell(PELOG[4], c.currentTime + 0.05, 0.035, 1.8);
      }
    } else {
      SND.on = false; clearTimeout(SND.t); SND.t = null; sndRain();
      setTimeout(function () { if (!SND.on && SND.ctx && SND.ctx.state === "running") SND.ctx.suspend(); }, 1800);
    }
    if (save) { try { localStorage.setItem("dewi.office2.sound", v ? "1" : "0"); } catch (e) {} }
    elSnd.setAttribute("aria-pressed", SND.want ? "true" : "false");
  }
  elSnd.setAttribute("aria-pressed", SND.want ? "true" : "false");
  elSnd.addEventListener("click", function () { soundSet(!SND.want, true); });
  if (SND.want) {   /* een browser speelt pas geluid na een eerste handeling op de pagina */
    var unlock = function () { document.removeEventListener("pointerdown", unlock); document.removeEventListener("keydown", unlock); if (SND.want && !SND.on) soundSet(true, false); };
    document.addEventListener("pointerdown", unlock); document.addEventListener("keydown", unlock);
  }

  /* ---- start van de sfeer ---- */
  renderSkyChip();
  loadFame(); setInterval(function () { if (!document.hidden) loadFame(); }, 15 * 60000);
  loadPrivate(); setInterval(function () { if (!document.hidden) loadPrivate(); }, 120000);
  if (SBX) SBX.auth.onAuthStateChange(function (ev) { if (ev === "SIGNED_IN" || ev === "SIGNED_OUT") loadPrivate(); });

  /* ----------------------------------------------------------------- start */
  if (!SB_KEY) { $("loading").style.display = "none"; showMsg("dewi-config.js is niet geladen: geen Supabase-sleutel gevonden."); return; }
  load();
  setInterval(function () { if (!document.hidden) load(); }, REFRESH_MS);
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && S.loadedAt && Date.now() - S.loadedAt.getTime() > REFRESH_MS) load();
  });
})();
</script>
