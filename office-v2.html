<!DOCTYPE html>
<!--
  DEWI — office-v2.html  (v2-presentatielaag; office.html blijft ongewijzigd als terugvaloptie)
  Isometrisch kantoor rond een centrale BRAIN: elke afdeling is een platform aan een datapijp,
  elke agent een bureau met monitor en stoel; de monitor draagt de live status.
  (menu ☰ > Systeem > Office v2). Zelfde conventie als de andere cockpit-pagina's:
  - leest SUPABASE_URL + anon key uit dewi-config.js (team-guard zit daar ook in),
  - eigen <header> met het DEWI-merkje zodat dewi-frame.js de paneel-toggle en het menu plaatst,
  - draait op de anon-key zonder sessie en leest alleen views met anon-select:
      v_office_depts        afdelingen (kleur, icoon, volgorde)
      v_office_agents       agents + status (working / ok / error / silent / paused / idle)
      v_office_tools        tool -> workflows (uit dewi_agent_tools, gevuld door Workflow Backup 02:30)
      v_office_links        agent -> agent (sub-workflow-aanroepen, uit dewi_agent_links)
      v_office_agent_loops  open loops per workflow (alleen bij een gekozen agent)
      dewi_runs_public      laatste runs (alleen bij een gekozen agent)
  Geen bibliotheken: de scene is SVG, de projectie is 2:1 isometrisch (zie iso()).
  Verschil met office.html: radiale indeling rond de Brain, permanente datapijpen met lopende
  puntjes (snelheid = runs 24 u), stippelbogen voor sub-workflow-koppelingen, bureau+monitor+stoel
  per agent, zwevende afdelingskaartjes, wheel-zoom + drag-pan op de viewBox, zoom naar selectie,
  paneel in terminal-stijl. Monitors tonen statuskleur (geen view levert een output-beeld); een
  afbeeldings-URL in een run-samenvatting wordt in het paneel als thumbnail getoond.
  Deeplink: office-v2.html?agent=<agent_id>.
-->
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Office v2 · DEWI</title>
<script src="dewi-config.js"></script>
<script src="dewi-frame.js"></script><!-- uniforme paneel-toggle + menu -->
<style>
  :root{
    --bg:#06090f; --ground:#080c14; --slab:#101826; --line:#1c2636; --panel:#0b1019; --panel2:#0f1623;
    --text:#cfe2ec; --dim:#7590a3; --cyan:#00d4ff; --green:#3ee08f; --amber:#ffb547; --red:#ff5d5d;
    --grey:#8aa0b5; --violet:#b58cff; --gold:#ffd166;
    --font:'Segoe UI',system-ui,-apple-system,sans-serif;
    --mono:ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);font:13px/1.45 var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit}
  a{color:var(--cyan);text-decoration:none}
  a:hover{text-decoration:underline}
  :focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:4px}
  #app{display:flex;flex-direction:column;height:100%}

  /* kop — zelfde opbouw als organisation.html zodat dewi-frame.js zijn knop voor .spacer zet */
  header{display:flex;align-items:center;gap:16px;padding:11px 20px;flex-wrap:wrap;
    border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(0,212,255,.05),transparent)}
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 9px var(--green);align-self:center}
  .brand .ttl{font-weight:700;letter-spacing:3px;font-size:16px}
  .brand .sub{color:var(--dim);font-size:13px}
  .brand .ver{font:700 9.5px var(--mono);letter-spacing:.14em;color:var(--cyan);border:1px solid rgba(0,212,255,.4);border-radius:4px;padding:1px 5px;align-self:center}
  .spacer{flex:1}
  .metrics{display:flex;gap:18px}
  .metric{text-align:right;line-height:1.1}
  .metric b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
  .metric span{font-size:11px;color:var(--dim)}
  .metric.m-error b{color:var(--red)} .metric.m-silent b{color:var(--amber)} .metric.m-working b{color:var(--cyan)}
  .metric.zero b{color:var(--dim)}
  .upd{color:var(--dim);font-size:11.5px;font-variant-numeric:tabular-nums;min-width:112px;text-align:right}

  main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 352px}
  .stage{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}

  /* tools-balk ("verbonden met") */
  .tools{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:9px 16px;min-height:56px;border-bottom:1px solid var(--line);position:relative}
  .tools .lbl{font:700 10px var(--mono);letter-spacing:.16em;color:var(--dim);margin-right:4px;text-transform:uppercase}
  .tools .note{color:var(--dim);font-size:11.5px;margin-left:6px}
  /* Icoonstrip: alleen het beeldmerk. De naam staat in aria-label en verschijnt bij hover. */
  .tool{position:relative;appearance:none;cursor:pointer;width:38px;height:38px;padding:0;border:0;background:none;flex:none;
    display:inline-flex;align-items:center;justify-content:center}
  .tool .ic{position:relative;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;
    font:800 13px var(--mono);letter-spacing:0;color:var(--tc,#44607A);background:#fff;overflow:hidden;
    box-shadow:0 0 0 1px rgba(0,0,0,.25) inset,0 2px 7px rgba(0,0,0,.5);
    transition:transform .12s,box-shadow .12s,background .12s}
  .tool .ic .lg{width:25px;height:25px;display:block;color:var(--tc,#44607A);overflow:visible}
  .tool i{position:absolute;right:-5px;bottom:-5px;font-style:normal;font:700 9.5px var(--mono);font-variant-numeric:tabular-nums;
    color:var(--text);background:#0a0f18;border:1px solid var(--line);border-radius:7px;padding:0 3.5px;line-height:14px;min-width:14px;text-align:center}
  .tool:hover .ic,.tool:focus-visible .ic,.tool.pre .ic{transform:translateY(-3px);
    box-shadow:0 0 0 2px var(--tc,#44607A),0 0 16px -2px var(--tc,#44607A),0 5px 10px rgba(0,0,0,.55)}
  .tool.has .ic{box-shadow:0 0 0 2px var(--tc,var(--cyan)),0 0 14px -3px var(--tc,var(--cyan)),0 2px 7px rgba(0,0,0,.5)}
  .tool.on .ic{background:var(--tc,var(--cyan));color:#fff;
    box-shadow:0 0 0 1.5px rgba(255,255,255,.85),0 0 20px -2px var(--tc,var(--cyan)),0 2px 8px rgba(0,0,0,.55)}
  .tool.on .ic .lg{color:#fff}
  .tool.on i{color:var(--text);border-color:var(--tc,var(--cyan))}
  .tool::after{content:attr(data-name);position:absolute;top:43px;left:50%;transform:translateX(-50%);z-index:7;
    background:#0b1220;border:1px solid var(--line);border-radius:7px;padding:3px 8px;white-space:nowrap;
    font:600 11px var(--mono);color:var(--text);pointer-events:none;opacity:0;transition:opacity .1s;
    box-shadow:0 6px 16px rgba(0,0,0,.55)}
  .tool:hover::after,.tool:focus-visible::after{opacity:1}
  .tool i{font-style:normal;font-weight:700;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
  .tool:hover,.tool.pre{border-color:var(--cyan)}
  .tool.has{border-color:var(--tc,var(--cyan));color:var(--tc,var(--cyan))}
  .tool.on{background:var(--tc,var(--cyan));border-color:var(--tc,var(--cyan));color:#04101a}
  .tool.on i{color:rgba(0,0,0,.6)}
  .tool.on .ic{background:rgba(0,0,0,.55);color:var(--tc,#fff);box-shadow:none}

  .scene{flex:1;min-height:0;position:relative;overflow:hidden;background:
    radial-gradient(ellipse 70% 60% at 50% 48%,rgba(0,212,255,.06),transparent 70%),var(--ground);touch-action:none}
  #floor{display:block;width:100%;height:100%;font-family:var(--font);cursor:grab;user-select:none;-webkit-user-select:none}
  #floor.drag{cursor:grabbing}
  #wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:hidden}
  #wires path{fill:none;stroke:var(--cyan);stroke-width:1.1;stroke-opacity:.55;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .32s ease-out forwards}
  #wires circle{fill:var(--cyan)}
  @keyframes draw{to{stroke-dashoffset:0}}

  /* camera-knoppen (rechtsonder; linksonder zit de ☰ van dewi-nav) */
  .cam{position:absolute;right:14px;bottom:14px;z-index:5;display:flex;flex-direction:column;gap:4px}
  .cam button{appearance:none;width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:rgba(7,11,18,.9);color:var(--text);cursor:pointer;font:700 15px var(--mono);line-height:1}
  .cam button:hover{border-color:var(--cyan);color:var(--cyan)}
  .hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:4;font:11px var(--mono);letter-spacing:.06em;color:var(--dim);
    background:rgba(7,11,18,.75);border:1px solid var(--line);border-radius:999px;padding:4px 11px;pointer-events:none;white-space:nowrap;transition:opacity .4s}
  .hint.off{opacity:0}

  /* vloer */
  .ground{fill:var(--ground)}
  .ground-tex{opacity:.9}
  .grid{stroke:#0e1521;stroke-width:1}
  .slab-tex{opacity:.85}
  .prop{opacity:.9;pointer-events:none}
  .dept{--c:#8aa0b5}
  #floor.intro .dept,#floor.intro .brain{animation:rise .55s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i)*55ms)}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}}
  .slab{cursor:pointer;outline:none;transition:opacity .2s}
  .shadow{fill:#000;fill-opacity:.45}
  .slab-top{fill:var(--slab);stroke:color-mix(in srgb,var(--c) 65%,transparent);stroke-width:1.1;stroke-linejoin:round}
  .slab-glow{fill:color-mix(in srgb,var(--c) 7%,transparent)}
  .slab-l{fill:color-mix(in srgb,var(--c) 34%,#070b12)}
  .slab-r{fill:color-mix(in srgb,var(--c) 18%,#070b12)}
  .slab-lip{fill:none;stroke:color-mix(in srgb,var(--c) 85%,#fff);stroke-width:1.4;stroke-opacity:.55}
  .slab:hover .slab-top,.slab:focus-visible .slab-top,.dept.cur .slab-top{stroke:var(--c);stroke-width:1.8}
  .dept.cur .slab-glow{fill:color-mix(in srgb,var(--c) 16%,transparent)}
  .band{fill:#fff;fill-opacity:.028}
  .lane{font:700 7.6px var(--mono);letter-spacing:.1em;fill:color-mix(in srgb,var(--c) 55%,#b9cbd8)}
  .plate{font:700 10.5px var(--mono);letter-spacing:.08em;fill:color-mix(in srgb,var(--c) 55%,#fff)}

  /* zwevend afdelingskaartje */
  /* Afdelingspaneel: witte kaart boven het platform. Bij hover komt hij op en valt de slagschaduw dieper. */
  .card{cursor:pointer}
  .card .stem{stroke:color-mix(in srgb,var(--c) 45%,transparent);stroke-width:1;stroke-dasharray:2 2}
  .card .pin{fill:var(--c)}
  .pcard{filter:url(#fPanel);transition:transform .14s ease,filter .14s ease}
  .card:hover .pcard,.card:focus-visible .pcard,.dept.cur .card .pcard{filter:url(#fPanelUp);transform:translateY(-4px)}
  .card .bg{fill:#fff}
  .card .ring{fill:none;stroke:var(--c);stroke-width:0;opacity:0;transition:stroke-width .14s,opacity .14s}
  .card:hover .ring,.dept.cur .card .ring{stroke-width:2;opacity:1}
  .card .tt{font:700 9.3px "Segoe UI",system-ui,sans-serif;letter-spacing:.13em;fill:#15181d}
  .card .dot2{fill:var(--c)}
  .card .num{font:300 26px "Segoe UI",system-ui,sans-serif;letter-spacing:-.02em;fill:#15181d}
  .card .numl{font:700 7.4px "Segoe UI",system-ui,sans-serif;letter-spacing:.14em;fill:#8c93a0}
  .card .lb{font:600 7.6px "Segoe UI",system-ui,sans-serif;letter-spacing:.09em;fill:#8c93a0}
  .card .vl{font:700 10.6px "Segoe UI",system-ui,sans-serif;fill:#15181d;text-anchor:end;font-variant-numeric:tabular-nums}
  .card .lead{stroke:#e3e6ea;stroke-width:1;stroke-dasharray:1 2.6}
  .card .sep{stroke:#ebedf0;stroke-width:1}
  .card .fl{font:700 7.3px "Segoe UI",system-ui,sans-serif;letter-spacing:.11em;fill:#8c93a0}
  .card .fv{font:700 10px "Segoe UI",system-ui,sans-serif;fill:#15181d;font-variant-numeric:tabular-nums}
  .card .fv.d{fill:var(--c)}

  /* datapijpen Brain -> afdeling */
  .pipe-base{fill:none;stroke:#0d1522;stroke-width:7;stroke-linecap:round}
  .pipe-edge{fill:none;stroke:color-mix(in srgb,var(--c) 30%,#0d1522);stroke-width:5;stroke-linecap:round}
  .pipe-core{fill:none;stroke:color-mix(in srgb,var(--c) 40%,transparent);stroke-width:1.2}
  .pipe-flow{fill:none;stroke:var(--c);stroke-width:2.6;stroke-linecap:round;stroke-dasharray:3 13;animation:flow var(--t,6s) linear infinite;opacity:.9}
  .pipe-flow.quiet{opacity:.25;animation-duration:calc(var(--t,6s)*3)}
  @keyframes flow{to{stroke-dashoffset:-160}}

  /* sub-workflow-bogen tussen agents */
  .link{fill:none;stroke:var(--violet);stroke-width:1.1;stroke-dasharray:3 4;stroke-opacity:.55;pointer-events:none}
  .link-dot{fill:var(--violet);pointer-events:none}
  #linksLayer{pointer-events:none}
  #floor.has-hl .link{stroke-opacity:.12}

  /* Brain */
  .brain .core-glow{fill:url(#gBrainGlow)}
  .brain .halo{fill:url(#gBrainGlow);animation:breathe 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes breathe{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.1)}}
  .brain .bt{font:700 11px var(--mono);letter-spacing:.26em;fill:var(--cyan);text-anchor:middle}
  .brain .bs{font:8.5px var(--mono);letter-spacing:.08em;fill:var(--dim);text-anchor:middle}

  /* agents: gerenderd bureau + monitor + stoel (sprite), scherm ingekleurd naar status */
  .ag{cursor:pointer;outline:none;transition:opacity .2s;--s:var(--green)}
  .ag .hit{fill:transparent}
  .ag .sprite{image-rendering:auto}
  .ag .m-screen{fill:var(--s);opacity:.62;mix-blend-mode:screen}
  .ag .m-glow{fill:var(--s);opacity:.3;filter:url(#fSoft);mix-blend-mode:screen;pointer-events:none}
  .ag .loop{fill:var(--violet);stroke:#0a0f18;stroke-width:.8}
  .ag .badge circle{fill:var(--s);stroke:#0a0f18;stroke-width:1}
  .ag .badge text{font-weight:800;font-size:8px;fill:#06101a}
  .ag .selring{fill:none;stroke:#fff;stroke-width:1.4;stroke-dasharray:3 2;display:none}
  .ag.s-working{--s:var(--cyan)} .ag.s-ok{--s:var(--green)} .ag.s-error{--s:var(--red)} .ag.s-silent{--s:var(--amber)}
  .ag.s-paused{--s:var(--grey)} .ag.s-idle{--s:#3a4a5c}
  .ag.s-ok .m-screen{opacity:.26} .ag.s-ok .m-glow{opacity:.07}
  .ag.s-idle .m-screen{opacity:.2} .ag.s-idle .m-glow,.ag.s-paused .m-glow{display:none}
  .ag.s-paused .m-screen{opacity:.28}
  .ag.s-silent .m-screen{animation:dimflick 2.6s steps(2,jump-none) infinite}
  @keyframes dimflick{from{opacity:.62}to{opacity:.3}}
  .ag.s-working .m-glow{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.2}50%{opacity:.6}}
  .ag.s-error .m-screen{animation:blink 1.1s steps(2,jump-none) infinite}
  @keyframes blink{from{opacity:.75}to{opacity:.28}}
  .ag.s-paused .sprite,.ag.s-idle .sprite{filter:grayscale(.55) brightness(.8)}
  .ag:hover .m-screen,.ag:focus-visible .m-screen{opacity:1}
  .ag:focus-visible .hit{stroke:#fff;stroke-width:1;stroke-dasharray:2 2}
  .ag.sel .selring{display:block}
  #floor.has-hl .ag:not(.hl){opacity:.14}
  #floor.has-hl .dept:not(.hl-d) .slab,#floor.has-hl .dept:not(.hl-d) .card,#floor.has-hl .dept:not(.hl-d) .pipe{opacity:.35}

  #tip{position:absolute;z-index:5;pointer-events:none;display:none;transform:translate(-50%,-100%);white-space:nowrap;
    background:#0b1220;border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12px;box-shadow:0 6px 18px rgba(0,0,0,.5)}
  #tip b{display:block;font-weight:700}
  #tip span{color:var(--dim);font-size:11.5px;font-family:var(--mono)}
  #msg{position:absolute;left:16px;right:16px;bottom:16px;z-index:6;display:none;background:#2a1216;border:1px solid var(--red);
    color:#ffd9d9;border-radius:10px;padding:9px 12px;font-size:12.5px}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);font-family:var(--mono);letter-spacing:.08em}

  /* paneel — terminal-stijl */
  .panel{border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:16px 16px 28px;min-height:0;font-family:var(--mono);font-size:12.2px}
  .panel h2{margin:0 0 2px;font:700 16px/1.25 var(--font)}
  .panel h3{margin:20px 0 7px;font:700 10px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:8px}
  .panel h3::before{content:"//";color:var(--cyan);opacity:.7}
  .panel h3 .n{margin-left:auto;color:var(--green);letter-spacing:.04em}
  .panel p{margin:6px 0}
  .back{appearance:none;border:0;background:none;padding:0;margin:0 0 12px;color:var(--cyan);cursor:pointer;font:12px var(--mono)}
  .back:hover{text-decoration:underline}
  .chip{display:inline-flex;align-items:center;gap:6px;font:600 11px var(--mono);letter-spacing:.06em;color:color-mix(in srgb,var(--c) 60%,#fff);margin-bottom:6px;text-transform:uppercase}
  button.chip{appearance:none;border:0;background:none;padding:0;cursor:pointer}
  button.chip:hover{text-decoration:underline}
  .pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--s);color:var(--s);border-radius:999px;padding:2px 10px;font:700 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;margin:8px 0 2px}
  .sdot{width:9px;height:9px;border-radius:50%;background:var(--s);flex:none;display:inline-block}
  .s-working{--s:var(--cyan)} .s-ok{--s:var(--green)} .s-error{--s:var(--red)} .s-silent{--s:var(--amber)} .s-paused{--s:var(--grey)} .s-idle{--s:var(--dim)}
  .sdot.hollow{background:none;border:1.5px dashed var(--s)}
  .why{color:var(--dim)}
  dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 14px;margin:12px 0 0}
  dt{color:var(--dim)} dd{margin:0;overflow-wrap:anywhere}
  .sum{background:var(--panel2);border:1px solid var(--line);border-left:2px solid var(--green);border-radius:6px;padding:8px 10px;overflow-wrap:anywhere}
  .thumb{display:block;max-width:100%;border-radius:6px;border:1px solid var(--line);margin-top:8px}
  .list{list-style:none;margin:0;padding:0}
  .row{appearance:none;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;cursor:pointer;font:inherit;
    display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 9px;align-items:center;padding:7px 4px}
  .list li:first-child .row{border-top:0}
  .row:hover,.row.cur{background:rgba(255,255,255,.035)}
  .row .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--font)}
  .row .mt{color:var(--dim);font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .row .sb{grid-column:2 / -1;color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .ic{width:18px;text-align:center}
  .bar{grid-column:2 / -1;display:flex;height:4px;border-radius:2px;overflow:hidden;background:var(--line);margin-top:3px}
  .bar i{display:block;background:var(--s)}
  .prog{grid-column:2 / -1;height:3px;border-radius:2px;background:var(--line);margin-top:4px;overflow:hidden}
  .prog i{display:block;height:100%;background:var(--green);width:var(--w,0%)}
  .lanehd{margin:12px 0 2px;font:700 10px var(--mono);letter-spacing:.14em;color:color-mix(in srgb,var(--c) 55%,#b9cbd8)}
  .runs{list-style:none;margin:0;padding:0}
  .runs li{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:11.5px;align-items:baseline}
  .runs li:first-child{border-top:0}
  .runs time{color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
  .runs .rs{overflow-wrap:anywhere}
  .ptools{display:flex;flex-wrap:wrap;gap:12px;padding:3px 0 5px}
  .links{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
  .links a{border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-weight:600;font-size:11.5px}
  .links a:hover{border-color:var(--cyan);text-decoration:none}
  .muted{color:var(--dim)}
  .loopitem{border-left:2px solid var(--violet);padding:2px 0 2px 9px;margin:6px 0}
  .kv{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0 0}
  .kv div{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 10px;min-width:72px}
  .kv b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
  .kv span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .kv .w b{color:var(--cyan)} .kv .e b{color:var(--red)} .kv .s b{color:var(--amber)}
  .cursor::after{content:"▌";color:var(--green);animation:cur 1s steps(2,jump-none) infinite;margin-left:2px}
  @keyframes cur{to{opacity:0}}

  @media (max-width:880px){
    body{overflow:auto}
    #app{height:auto;min-height:100%}
    main{display:block}
    .stage{height:66vh;min-height:400px}
    .tools{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:7px}
    .tools::-webkit-scrollbar{display:none}
    .tools .tool,.tools .lbl,.tools .note{flex:none;white-space:nowrap}
    .tools .tool,.tools .tool .ic{width:31px;height:31px}
    .tools .tool .ic .lg{width:20px;height:20px}
    .tools .tool::after{display:none}
    .panel{border-left:0;border-top:1px solid var(--line);padding-bottom:84px}
    .metrics{gap:13px} .upd{display:none}
    .hint{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    #floor.intro .dept,#floor.intro .brain,.pipe-flow,.brain .halo,.ag .m-glow,.ag.s-error .m-screen,.ag.s-silent .m-screen,#wires path,.cursor::after{animation:none}
    .pcard{transition:none}
    .card:hover .pcard,.card:focus-visible .pcard,.dept.cur .card .pcard{transform:none}
    #wires path{stroke-dashoffset:0}
    .ag.s-working .m-glow{opacity:.45}
  }
</style>

<div id="app">
  <header>

  function viewScale() { /* viewBox-eenheden per schermpixel (meet) */

  var camAnim = null;
  function setCam(box, animate) {

    var from = S.cam.slice(), to = box.slice(), t0 = performance.now(), D = 520;

  function loadRuns(a) {
    if (!a) return;
    var id = a.agent_id, wf = encodeURIComponent(a.workflow_name);
    var jobs = [settle(rest("dewi_runs_public?select=run_at,status,summary&workflow=eq." + wf + "&order=run_at.desc&limit=8"))];
    if (Number(a.open_loops) > 0) jobs.push(settle(rest("v_office_agent_loops?select=slug,title,status,priority&workflow_name=eq." + wf)));
    Promise.all(jobs).then(function (res) {
      S.runs[id] = res[0].ok ? { rows: res[0].v || [] } : { error: res[0].e.message || String(res[0].e) };
      if (res[1]) S.loops[id] = res[1].ok ? { rows: res[1].v || [] } : { error: res[1].e.message || String(res[1].e) };
      if (S.focus && S.focus.type === "agent" && S.focus.id === id) {
        var pr = $("p-runs"); if (pr) pr.innerHTML = runsHtml(a);
        var pl = $("p-loops"); if (pl) pl.innerHTML = loopsHtml(a);
      }
    });
  }
  function renderPanel() {
    var f = S.focus, keep = elPanel.scrollTop, key = f ? f.type + ":" + (f.id || f.name || f.key) : "";
    var h;
    if (!S.agents.length) h = "";
    else if (f && f.type === "agent" && S.byId[f.id]) h = panelAgent(S.byId[f.id]);
    else if (f && f.type === "dept") { var d = deptByName(f.name); h = d ? panelDept(d) : panelOverview(); }
    else if (f && f.type === "tool" && toolByName(f.name)) h = panelTool(toolByName(f.name));
    else if (f && f.type === "state") h = panelState(f.key);
    else h = panelOverview();
    elPanel.innerHTML = h;
    elPanel.scrollTop = key === S.panelKey ? keep : 0;
    S.panelKey = key;
  }

  /* ------------------------------------------------------------ interactie */
  function showMsg(t) { elMsg.textContent = t; elMsg.style.display = t ? "block" : "none"; }
  function tipFor(el) {
    var a = S.byId[el.getAttribute("data-id")]; if (!a) return;
    var r = el.querySelector(".hit").getBoundingClientRect(), sr = elStage.getBoundingClientRect();
    elTip.innerHTML = "<b>" + esc(a.agent_name) + "</b><span>" + esc(STATES[st(a)].l.toUpperCase() + (a.schedule_human ? " · " + a.schedule_human : "") + " · " + (Number(a.runs_24h) || 0) + " runs 24u") + "</span>";
    elTip.style.display = "block";
    var half = elTip.offsetWidth / 2, x = r.left + r.width / 2 - sr.left;
    elTip.style.left = Math.max(half + 6, Math.min(sr.width - half - 6, x)) + "px";
    elTip.style.top = Math.max(elTip.offsetHeight + 4, r.top - sr.top - 4) + "px";
  }
  function hideTip() { elTip.style.display = "none"; }
  function closest(t, sel) { return t && t.closest ? t.closest(sel) : null; }
  function same(f, type, v) { return f && f.type === type && (f.id === v || f.name === v || f.key === v); }

  elFloor.addEventListener("click", function (e) {
    if (suppressClick) return;
    var ag = closest(e.target, ".ag");
    if (ag) { if (!window.matchMedia("(hover: hover)").matches) hideTip(); var id = ag.getAttribute("data-id"); setFocus(same(S.focus, "agent", id) ? null : { type: "agent", id: id }, true); return; }
    var sl = closest(e.target, ".slab,.card");
    if (sl) { var n = sl.parentNode.getAttribute("data-dept"); setFocus(same(S.focus, "dept", n) ? null : { type: "dept", name: n }); return; }
    if (closest(e.target, ".brain")) { setFocus(null); return; }
    if (S.focus) setFocus(null, true);
  });
  elFloor.addEventListener("keydown", function (e) {
    if (e.key !== "Enter" && e.key !== " ") return;
    var t = closest(e.target, ".ag,.slab,.card"); if (!t) return;
    e.preventDefault(); t.dispatchEvent(new MouseEvent("click", { bubbles: true }));
  });
  elFloor.addEventListener("pointerover", function (e) { if (drag && drag.moved) return; var ag = closest(e.target, ".ag"); if (ag) tipFor(ag); });
  elFloor.addEventListener("pointerout", function (e) { if (closest(e.target, ".ag")) hideTip(); });
  elFloor.addEventListener("focusin", function (e) { var ag = closest(e.target, ".ag"); if (ag) tipFor(ag); });
  elFloor.addEventListener("focusout", hideTip);

  function toolClick(e) {
    var b = closest(e.target, ".tool"); if (!b) return false;
    var n = b.getAttribute("data-tool"); if (!toolByName(n)) return true;
    setFocus(same(S.focus, "tool", n) ? null : { type: "tool", name: n }, true);
    return true;
  }
  elTools.addEventListener("click", toolClick);
  function toolHover(on) {
    return function (e) {
      var b = closest(e.target, ".tool"); if (!b) return;
      var n = on ? b.getAttribute("data-tool") : null;
      if (S.hoverTool === n) return;
      S.hoverTool = n; applyFocus();
    };
  }
  elTools.addEventListener("pointerover", toolHover(true));
  elTools.addEventListener("pointerout", toolHover(false));
  elTools.addEventListener("focusin", toolHover(true));
  elTools.addEventListener("focusout", toolHover(false));

  elPanel.addEventListener("click", function (e) {
    if (toolClick(e)) return;
    var t = closest(e.target, "[data-back],[data-agent],[data-dept],[data-state]"); if (!t) return;
    if (t.hasAttribute("data-back")) setFocus(null);
    else if (t.hasAttribute("data-agent")) { var a = S.byId[t.getAttribute("data-agent")]; setFocus({ type: "agent", id: t.getAttribute("data-agent") }, true); if (a) zoomToAgent(a); }
    else if (t.hasAttribute("data-dept")) setFocus({ type: "dept", name: t.getAttribute("data-dept") });
    else { var k = t.getAttribute("data-state"); setFocus(same(S.focus, "state", k) ? null : { type: "state", key: k }, true); }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && S.focus && !document.documentElement.classList.contains("dn-open") && !document.querySelector("#dn-pal.open")) setFocus(null);
  });
  elTools.addEventListener("scroll", drawWires, { passive: true });
  var rzT = null;
  window.addEventListener("resize", function () {
    hideTip(); S.pairs = []; drawWires();
    clearTimeout(rzT);
    rzT = setTimeout(function () {
      if (!S.agents.length) return;
      var o = S.sceneSize || [1, 1], n = [elScene.clientWidth, elScene.clientHeight];
      if (Math.abs(n[0] / n[1] - o[0] / o[1]) > 0.08 * (o[0] / o[1])) { layout(); renderFloor(); }
      applyFocus();
    }, 220);
  });

  /* ----------------------------------------------------------------- start */
  if (!SB_KEY) { $("loading").style.display = "none"; showMsg("dewi-config.js is niet geladen: geen Supabase-sleutel gevonden."); return; }
  load();
  setInterval(function () { if (!document.hidden) load(); }, REFRESH_MS);
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && S.loadedAt && Date.now() - S.loadedAt.getTime() > REFRESH_MS) load();
  });
})();
</script>
</body>
</html>
