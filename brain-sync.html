<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brain sync · DEWI</title>
<style>
  :root{
    --bg:#14110d; --panel:#1c1812; --border:#2c261d; --text:#e8dfd0; --muted:#8a7c68;
    --violet:#a37bff; --ok:#2fd47e; --warn:#ffb020; --alert:#c0392b; --head:#f6f1e7;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif}
  .wrap{max-width:1000px;margin:0 auto;padding:24px 16px}
  h1{font-family:Georgia,serif;color:var(--head);font-size:22px;margin:0 0 2px}
  .sub{color:var(--muted);margin:0 0 18px;font-size:13px}
  .cards{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 16px;min-width:150px}
  .card .n{font-size:26px;font-weight:700}
  .card .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
  .card.warn{border-color:#5a4520}.card.warn .n{color:var(--warn)}
  .card.ok .n{color:var(--ok)}
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden}
  th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px}
  th{color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;font-size:11px}
  tr:last-child td{border-bottom:none}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}
  .pill.sync{background:rgba(47,212,126,.14);color:var(--ok)}
  .pill.drift{background:rgba(192,57,43,.16);color:#ff6b5b}
  .note{color:var(--head)}
  .muted{color:var(--muted)}
  .err{color:#ff6b5b;padding:14px;background:var(--panel);border:1px solid var(--border);border-radius:10px}
  .foot{color:var(--muted);font-size:12px;margin-top:14px}
  code{background:#0e0c09;padding:1px 6px;border-radius:5px;color:var(--violet)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Brain sync</h1>
  <p class="sub">Her-upload-manifest voor de stabiele DEWI-notities · bron <code>v_dewi_brain_sync</code></p>
  <div class="cards" id="cards"></div>
  <div id="content"><p class="muted">Laden…</p></div>
  <p class="foot" id="foot"></p>
</div>
<script>
  // Hergebruik dezelfde Supabase-config als de andere dash-pagina's (kpi.html e.d.).
  const SUPABASE_URL = 'https://jucubuoftjehwancegma.supabase.co';
  const SUPABASE_ANON_KEY = '<<PLAK_HIER_DEZELFDE_ANON_KEY_ALS_DE_ANDERE_DASH_PAGINAS>>';

  const fmt = s => s ? new Date(s).toLocaleString('nl-NL',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}) : '—';

  async function load(){
    const content = document.getElementById('content');
    try{
      const res = await fetch(SUPABASE_URL + '/rest/v1/v_dewi_brain_sync?select=*', {
        headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY }
      });
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const rows = await res.json();
      const drift = rows.filter(r => r.needs_reupload);
      const inSync = rows.length - drift.length;

      document.getElementById('cards').innerHTML =
        card(rows.length,'notities','') +
        card(drift.length,'wachten op her-upload', drift.length ? 'warn' : 'ok') +
        card(inSync,'in sync','ok');

      const order = [...rows].sort((a,b)=> (b.needs_reupload-a.needs_reupload) || a.slug.localeCompare(b.slug));
      content.innerHTML =
        '<table><thead><tr><th>Notitie</th><th>Status</th><th>Laatste Drive-wijziging</th><th>Laatste PK-sync</th></tr></thead><tbody>' +
        order.map(r =>
          '<tr><td class="note">'+r.title+'</td>' +
          '<td>'+(r.needs_reupload
              ? '<span class="pill drift">her-upload</span>'
              : '<span class="pill sync">in sync</span>')+'</td>' +
          '<td class="muted">'+fmt(r.drive_modified_at)+'</td>' +
          '<td class="muted">'+fmt(r.pk_synced_at)+'</td></tr>'
        ).join('') + '</tbody></table>';

      document.getElementById('foot').textContent =
        'Bijgewerkt door de Brain Sync Sentinel (dagelijks ~06:40). Zet een pk-sync-loop op done na her-upload; de baseline verschuift dan automatisch.';
    }catch(e){
      content.innerHTML = '<div class="err">Kon <code>v_dewi_brain_sync</code> niet laden: '+e.message+
        '. Controleer of de anon-key is ingevuld (zelfde als de andere dash-pagina\'s).</div>';
    }
  }
  function card(n,l,cls){ return '<div class="card '+(cls||'')+'"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>'; }
  load();
</script>
</body>
</html>
