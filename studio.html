<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio · Social naslagwerk · DEWI</title>
<style>
:root{
  --bg:#0e1116; --panel:#161b22; --panel-2:#1c232d; --line:#2a323d;
  --txt:#e6edf3; --muted:#9aa7b4; --dim:#6b7684;
  --ok:#2ea043; --ok-bg:#12261a; --no:#e5484d; --no-bg:#2a1416;
  --accent:#4c8dff; --radius:14px;
  --social:#4c8dff; --reels:#c96dd8; --stories:#e0a13a; --stills:#3fb6a8;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:22px 18px 60px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;letter-spacing:.2px}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}
.count{font-size:13px;color:var(--muted);background:var(--panel);border:1px solid var(--line);
  padding:6px 12px;border-radius:999px;white-space:nowrap}
.nav{font-size:13px;color:var(--dim);text-decoration:none}
.nav:hover{color:var(--muted)}

/* ---- feed grid ---- */
.row{margin-bottom:26px}
.rowhead{display:flex;align-items:center;gap:9px;margin:0 2px 10px}
.rowhead .cd{width:9px;height:9px;border-radius:50%}
.rowhead .lbl{font-size:14px;font-weight:600;letter-spacing:.2px}
.rowhead .n{font-size:12px;color:var(--dim)}
.rowhead .fmt{font-size:11px;color:var(--dim);margin-left:auto}
.strip{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x proximity}
.strip::-webkit-scrollbar{height:8px}
.strip::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.strip::-webkit-scrollbar-track{background:transparent}
.card{flex:0 0 auto;width:158px;scroll-snap-align:start;cursor:zoom-in}
.card .frame{position:relative;background:#000;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card .frame img,.card .frame video{width:100%;display:block;object-fit:cover;background:#000}
.card.r-social .frame img,.card.r-social .frame video{aspect-ratio:1/1}
.card.r-reels .frame img,.card.r-reels .frame video,
.card.r-stories .frame img,.card.r-stories .frame video,
.card.r-stills .frame img,.card.r-stills .frame video{aspect-ratio:9/16}
.card .noimg{display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:28px;aspect-ratio:9/16}
.card.r-social .noimg{aspect-ratio:1/1}
.card .play{position:absolute;left:8px;bottom:8px;width:26px;height:26px;border-radius:50%;
  background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
.card .ch{position:absolute;top:7px;right:7px;font-size:9.5px;font-weight:600;padding:2px 7px;border-radius:999px;
  background:rgba(0,0,0,.6);color:#fff;letter-spacing:.03em}
.card .cap{padding:7px 2px 0}
.card .t{font-size:12px;line-height:1.28;color:var(--txt);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .d{font-size:11px;color:var(--dim);margin-top:3px}
.strip .empty{color:var(--dim);font-size:12.5px;padding:22px 6px}

/* ---- states ---- */
.state{text-align:center;padding:80px 20px;color:var(--muted)}
.state .ico{font-size:46px;color:var(--dim);margin-bottom:14px}
.state h2{font-size:18px;font-weight:600;color:var(--txt);margin:0 0 6px}
.state p{font-size:13.5px;margin:0}
.spinner{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--accent);
  border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---- approval mode (?id=) ---- */
.review{max-width:460px;margin:10px auto 0}
.review .frame{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;position:relative}
.review .frame img,.review .frame video{width:100%;display:block;background:#000}
.review .noimg{aspect-ratio:9/16;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:34px}
.review .ctitle{font-size:15px;font-weight:600;margin:12px 2px 2px}
.review .cmeta{font-size:12px;color:var(--dim);margin:0 2px}
.thumbs{display:flex;gap:14px;justify-content:center;margin-top:16px}
.tbtn{width:64px;height:52px;border:1px solid var(--line);border-radius:12px;background:var(--panel-2);
  display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;transition:.12s}
.tbtn:hover{transform:translateY(-1px)}
.tbtn.up{color:var(--ok)} .tbtn.up:hover{background:var(--ok-bg);border-color:var(--ok)}
.tbtn.down{color:var(--no)} .tbtn.down:hover{background:var(--no-bg);border-color:var(--no)}
.tbtn:disabled{opacity:.4;cursor:default;transform:none}

/* ---- toast ---- */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
  background:var(--panel-2);border:1px solid var(--line);color:var(--txt);padding:11px 18px;
  border-radius:12px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:60}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{border-color:var(--no);color:#ffb4b7}

/* ---- lightbox ---- */
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;
  z-index:80;cursor:zoom-out;padding:24px}
.lb.open{display:flex}
.lb-inner{max-width:min(92vw,460px);max-height:92vh;display:flex;flex-direction:column;gap:12px;cursor:default}
.lb img,.lb video{max-width:100%;max-height:74vh;border-radius:12px;display:block;margin:0 auto;background:#000}
.lb-cap{color:#cfd8e3;font-size:13px;line-height:1.5;white-space:pre-wrap}
.lb-meta{color:var(--dim);font-size:12px}
.lb-links{display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
.lb-links a{font-size:12.5px;color:#bcd3ff;text-decoration:none;border:1px solid var(--line);
  padding:6px 11px;border-radius:999px}
.lb-links a:hover{border-color:var(--accent)}
.lb-close{position:absolute;top:18px;right:22px;color:#fff;font-size:26px;cursor:pointer;
  width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%;
  background:rgba(255,255,255,.1)}

@media(max-width:620px){ .card{width:132px} }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><span class="dot"></span> Studio · social naslagwerk</div>
    <div style="display:flex;align-items:center;gap:14px">
      <span class="count" id="count">—</span>
      <a class="nav" href="kpi.html">← dashboard</a>
    </div>
  </div>
  <div id="stage">
    <div class="state"><div class="spinner"></div><p>Laden…</p></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="lb" id="lb">
  <div class="lb-close" id="lbClose">✕</div>
  <div class="lb-inner" id="lbInner"></div>
</div>

<script>
const SUPA = "https://jucubuoftjehwancegma.supabase.co";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp1Y3VidW9mdGplaHdhbmNlZ21hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI2OTYwMDIsImV4cCI6MjA5ODI3MjAwMn0.gKYBE76kVv5XdMb-GuFAELdSp5R7OjCIiUzw7hW2Jus";
const DISPATCH = "https://homedecobali.app.n8n.cloud/webhook/proposal-dispatch";
const HDR = {apikey:ANON, Authorization:`Bearer ${ANON}`};

const stage = document.getElementById('stage');
const countEl = document.getElementById('count');
const toastEl = document.getElementById('toast');

const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(msg,err){toastEl.textContent=msg;toastEl.className='toast show'+(err?' err':'');
  clearTimeout(toast._t);toast._t=setTimeout(()=>toastEl.className='toast',2600);}
function dateTxt(iso){ if(!iso) return ''; const d=new Date(iso);
  return d.toLocaleDateString('nl-NL',{day:'numeric',month:'short'}); }
// Cloudinary video -> jpg poster frame
function poster(url){
  if(!url) return null;
  if(url.indexOf('/video/upload/')>=0)
    return url.replace('/video/upload/','/video/upload/so_0,f_jpg,w_420/');
  return url;
}

/* ============ FEED (default) ============ */
const SLOTS = [
  ['social','Social posts','feed · 1:1','var(--social)'],
  ['reels','Reels','video · 9:16','var(--reels)'],
  ['stories','Stories','video · 9:16','var(--stories)'],
  ['stills','Stills','story · 9:16','var(--stills)']
];

async function loadFeed(){
  try{
    const r=await fetch(`${SUPA}/rest/v1/v_dewi_feed?select=*`,{headers:HDR});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const rows=await r.json();
    renderFeed(rows);
  }catch(e){
    stage.innerHTML=`<div class="state"><div class="ico">⚠</div><h2>Kon het naslagwerk niet laden</h2>
      <p>${esc(e.message)} — probeer te verversen.</p></div>`;
  }
}

function renderFeed(rows){
  const by={social:[],reels:[],stories:[],stills:[]};
  for(const x of rows){ if(by[x.slot]) by[x.slot].push(x); }
  countEl.textContent = rows.length + ' posts · laatste 120 dagen';
  window._feed = {};
  let html='';
  for(const [slot,label,fmt,color] of SLOTS){
    const items=by[slot]||[];
    window._feed[slot]=items;
    const cards = items.length
      ? items.map((p,i)=>cardHtml(slot,p,i)).join('')
      : `<div class="empty">Nog niets gepost in deze categorie.</div>`;
    html+=`<div class="row">
      <div class="rowhead">
        <span class="cd" style="background:${color}"></span>
        <span class="lbl">${label}</span>
        <span class="n">${items.length}</span>
        <span class="fmt">${fmt}</span>
      </div>
      <div class="strip">${cards}</div>
    </div>`;
  }
  stage.innerHTML=html;
  stage.querySelectorAll('.card').forEach(el=>{
    el.onclick=()=>openMedia(el.dataset.slot, +el.dataset.i);
  });
}

function cardHtml(slot,p,i){
  const isVid = p.media_type==='video';
  const src = isVid ? poster(p.media_url) : p.media_url;
  const media = src
    ? `<img loading="lazy" src="${esc(src)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'noimg',textContent:'🖼'}))">`
    : `<div class="noimg">🖼</div>`;
  const ch = (p.channel||'').indexOf('facebook')>=0 && (p.channel||'').indexOf('instagram')>=0 ? 'FB·IG'
    : (p.channel||'').indexOf('facebook')>=0 ? 'FB'
    : (p.channel||'').indexOf('instagram')>=0 ? 'IG' : '';
  return `<div class="card r-${slot}" data-slot="${slot}" data-i="${i}">
    <div class="frame">
      ${media}
      ${isVid?'<div class="play">▶</div>':''}
      ${ch?`<div class="ch">${ch}</div>`:''}
    </div>
    <div class="cap">
      <div class="t">${esc(p.title||'')}</div>
      <div class="d">${esc(dateTxt(p.posted_at))}</div>
    </div>
  </div>`;
}

function openMedia(slot,i){
  const p=(window._feed[slot]||[])[i]; if(!p) return;
  const inner=document.getElementById('lbInner');
  const isVid=p.media_type==='video';
  const body = isVid
    ? `<video src="${esc(p.media_url)}" controls autoplay playsinline></video>`
    : (p.media_url?`<img src="${esc(p.media_url)}" alt="">`:`<div class="lb-cap">Geen media.</div>`);
  const links=[];
  if(p.fb_url) links.push(`<a href="${esc(p.fb_url)}" target="_blank" rel="noopener">Bekijk op Facebook ↗</a>`);
  if(p.product_url) links.push(`<a href="${esc(p.product_url)}" target="_blank" rel="noopener">Product ↗</a>`);
  inner.innerHTML=`${body}
    <div class="lb-meta">${esc(slot)} · ${esc(dateTxt(p.posted_at))}${p.external_post_id?' · IG '+esc(p.external_post_id):''}</div>
    ${p.title?`<div class="lb-cap" style="font-weight:600">${esc(p.title)}</div>`:''}
    ${p.caption?`<div class="lb-cap">${esc(p.caption)}</div>`:''}
    ${links.length?`<div class="lb-links">${links.join('')}</div>`:''}`;
  document.getElementById('lb').classList.add('open');
}

/* ============ APPROVAL (?id=) — blijft voor META / Merchant ============ */
let apQueue=[], apItem=null, apBusy=false;
async function loadApproval(id){
  try{
    const r=await fetch(`${SUPA}/rest/v1/v_dewi_studio?select=*`,{headers:HDR});
    if(!r.ok) throw new Error('HTTP '+r.status);
    apQueue=await r.json();
    apItem=apQueue.find(x=>x.id===id)||null;
    renderApproval();
  }catch(e){
    stage.innerHTML=`<div class="state"><div class="ico">⚠</div><h2>Kon voorstel niet laden</h2>
      <p>${esc(e.message)} — probeer te verversen.</p></div>`;
  }
}
function renderApproval(){
  const p=apItem;
  if(!p){
    countEl.textContent='—';
    stage.innerHTML=`<div class="state"><div class="ico">✓</div><h2>Voorstel niet meer open</h2>
      <p>Dit voorstel is al afgehandeld of verlopen. <a class="nav" href="studio.html">→ naar het naslagwerk</a></p></div>`;
    return;
  }
  countEl.textContent='1 goedkeuring';
  const isVid=p.media_type==='video'&&p.video_url;
  const cover=isVid?null:p.image_url;
  const media=isVid?`<video src="${esc(p.video_url)}" controls playsinline></video>`
    :(cover?`<img src="${esc(cover)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'noimg',textContent:'🖼'}))">`
    :`<div class="noimg">🖼</div>`);
  stage.innerHTML=`<div class="review">
    <div class="frame">${media}</div>
    <div class="ctitle">${esc(p.title||'')}</div>
    <div class="cmeta">${esc(p.kind||'')}${p.origin_label?' · '+esc(p.origin_label):''}</div>
    <div class="thumbs">
      <button class="tbtn up" id="btnUp" title="Goedkeuren">👍</button>
      <button class="tbtn down" id="btnDown" title="Afkeuren">👎</button>
    </div>
    <div class="state" style="padding:22px 0 0"><p style="font-size:12px">Goedkeuring geldt voor Meta / Merchant. Organic social loopt automatisch — zie het <a class="nav" href="studio.html">naslagwerk</a>.</p></div>
  </div>`;
  document.getElementById('btnUp').onclick=()=>decide('approve');
  document.getElementById('btnDown').onclick=()=>decide('skip');
}
async function decide(action){
  if(apBusy||!apItem) return; apBusy=true;
  const up=document.getElementById('btnUp'),down=document.getElementById('btnDown');
  if(up)up.disabled=true; if(down)down.disabled=true;
  try{
    const url=`${DISPATCH}?id=${encodeURIComponent(apItem.id)}&kind=${encodeURIComponent(apItem.kind)}&action=${action}`;
    const r=await fetch(url,{method:'GET'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    toast(action==='approve'?'👍 Goedgekeurd — naar publisher':'👎 Afgekeurd');
    apItem=null; apBusy=false; renderApproval();
  }catch(e){
    apBusy=false; if(up)up.disabled=false; if(down)down.disabled=false;
    toast('Actie mislukt: '+e.message,true);
  }
}

/* ============ lightbox wiring ============ */
function closeLightbox(){document.getElementById('lb').classList.remove('open');document.getElementById('lbInner').innerHTML='';}
document.getElementById('lb').onclick=closeLightbox;
document.getElementById('lbClose').onclick=e=>{e.stopPropagation();closeLightbox();};
document.getElementById('lbInner').onclick=e=>e.stopPropagation();
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLightbox();});

/* ============ boot ============ */
const wantId=new URLSearchParams(location.search).get('id');
if(wantId) loadApproval(wantId); else loadFeed();
</script>
</body>
</html>
